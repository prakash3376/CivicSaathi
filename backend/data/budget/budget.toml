summary = { en = "The interim budget speech proposed yearly support for landless farm workers, free government irrigation and higher pay for ASHA workers.", bn = "অন্তর্বর্তী বাজেট বক্তৃতায় ভূমিহীন কৃষি শ্রমিকদের বার্ষিক সহায়তা, সরকারি সেচ বিনামূল্যে এবং আশা কর্মীদের বেশি সম্মানভাতার প্রস্তাব করা হয়েছিল।", hi = "अंतरिम बजट भाषण में भूमिहीन कृषि मजदूरों को सालाना सहायता, सरकारी सिंचाई शुल्क की माफी और आशा कार्यकर्ताओं के लिए अधिक मानदेय का प्रस्ताव किया गया था।" }
meaning = "The speech proposed yearly support for landless agricultural labourers who are not covered by Krishak Bandhu (Natun), a waiver of irrigation charges for small and marginal farmers on government tubewells and river lift irrigation schemes, and a higher monthly honorarium for ASHA workers. This comes from the interim budget speech, which asked the Assembly to approve spending for the first months of the year only. The full budget was presented later, and its speech could not be read by our tool, so a proposal here may have been changed or dropped. Check with the department before relying on it."

[[records.statements]]
text = "The interim speech proposed an annual support of Rs 4,000 to each landless agricultural labourer, paid in two instalments of Rs. 2,000 each, one in the Rabi season and one in the Kharif season."
evidence = [
    { source_id = "wb-budget-speech-2026-27-interim", quote = "I propose an annual support of Rs 4,000 to each such labourer. The amount will be paid in two installment of Rs. 2,000 each, one during Rabi Crop season and the other during Kharif Crop season.", where = "page 177" },
  ]

[[records.statements]]
text = "The interim speech announced a complete waiver of the fee or charge on irrigation by Government Tubewells and RLI Schemes, to reduce the cost of cultivation of small and marginal farmers."
evidence = [
    { source_id = "wb-budget-speech-2026-27-interim", quote = "I am happy to announce the complete waiver of the fee or charge on irrigation by Government Tubewells and RLI Schemes.", where = "page 177" },
