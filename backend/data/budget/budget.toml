meaning = "The speech proposed a new scheme, Banglar Yuba-Sathi, giving a monthly assistance of 1,500 rupees to unemployed youth who meet the stated conditions, and money for the Mahatma-Shree scheme of 100 days of work. This comes from the interim budget speech, which asked the Assembly to approve spending for the first months of the year only. The full budget was presented later, and its speech could not be read by our tool, so a proposal here may have been changed or dropped. Check with the department before relying on it."

