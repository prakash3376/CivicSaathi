last_verified = 2026-10-31
summary = { en = "The interim budget speech proposed more money for women under Lakshmir Bhandar and higher pay for anganwadi workers.", bn = "অন্তর্বর্তী বাজেট বক্তৃতায় লক্ষ্মীর ভান্ডারে মহিলাদের জন্য বেশি অর্থ এবং অঙ্গনওয়াড়ি কর্মীদের জন্য বেশি সম্মানভাতার প্রস্তাব করা হয়েছিল।", hi = "अंतरिम बजट भाषण में लक्ष्मीर भंडार के तहत महिलाओं के लिए अधिक राशि और आंगनवाड़ी कार्यकर्ताओं के लिए अधिक मानदेय का प्रस्ताव किया गया था।" }
meaning = "The speech proposed that every woman covered by Lakshmir Bhandar would get an extra 500 rupees a month, and that the monthly honorarium of anganwadi workers and helpers would go up by 1,000 rupees. This comes from the interim budget speech, which asked the Assembly to approve spending for the first months of the year only. The full budget was presented later, and its speech could not be read by our tool, so a proposal here may have been changed or dropped. Check with the department before relying on it."

[[records.statements]]
text = "The interim speech proposed that all women covered by the Lakshmir Bhandar scheme would be entitled to an additional Rs. 500 per month from February 2026."
evidence = [
    { source_id = "wb-budget-speech-2026-27-interim", quote = "I am happy to propose that all women covered under this Scheme will be entitled to an additional amount of Rs. 500 per month from February, 2026 onwards.", where = "page 179" },
  ]

[[records.statements]]
text = "The interim speech proposed an additional annual allocation of Rs. 15,000 crore for this in 2026-27."
evidence = [
    { source_id = "wb-budget-speech-2026-27-interim", quote = "For this, I propose an additional annual allocation of Rs. 15,000 crore in the next Financial Year 2026-27.", where = "page 179" },
  ]

[[records.statements]]
text = "The interim speech announced that the monthly honorarium of Anganwadi Workers and Anganwadi Sahayaks would increase by Rs. 1,000 from April 2026."
evidence = [
    { source_id = "wb-budget-speech-2026-27-interim", quote = "I am happy to announce that the monthly honorarium of the Anganwari Workers and Anganwari Sahayaks will be increased by Rs. 1,000 from April, 2026 onwards.", where = "page 175" },
  ]

