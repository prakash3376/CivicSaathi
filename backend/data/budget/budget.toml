# Budget records: the Union Budget 2026-27 (presented 1 February 2026) and the West Bengal
# Budget 2026-27 (full budget of June 2026, with the interim speech of February 2026).
# Every figure carries its basis (Budget Estimate, Revised Estimate or Actual) and the
# financial year it is for. Nothing is computed. Sources: backend/data/sources/budget.toml.

[[records]]
id = "union-2026-27-total-expenditure"
budget_year = "2026-27"
level = "central"
kind = "allocation"
title = "Union Budget 2026-27: total expenditure of the Government of India"
department = "Ministry of Finance, Government of India"
source_ids = ["union-budget-speech-2026-27", "union-budget-summary-2026-27"]
last_verified = 2026-10-31
summary = { en = "This shows how much the Government of India plans to spend in the year, next to what it now expects to have spent in the year before.", bn = "এখানে দেখানো হয়েছে ভারত সরকার এই বছরে মোট কত খরচ করার পরিকল্পনা করেছে এবং আগের বছরে এখন কত খরচ হবে বলে ধরা হচ্ছে।", hi = "यहाँ दिखाया गया है कि भारत सरकार इस वर्ष कुल कितना खर्च करने की योजना बना रही है और पिछले वर्ष के लिए अब कितना खर्च अनुमानित है।" }
meaning = "The Budget Speech gives total expenditure of 53.5 lakh crore rupees in the 2026-27 Budget Estimates, and 49.6 lakh crore in the 2025-26 Revised Estimates. Both are estimates made while the year is still running or has not begun, not final spending."

[[records.figures]]
basis = "budget_estimate"
year = "2026-27"
amount = 53.5
unit = "lakh_crore"
evidence = [
    { source_id = "union-budget-speech-2026-27", quote = "Budget Estimates 2026-27 96. Coming to 2026-27, the non-debt receipts and the total expenditure are estimated as ₹36.5 lakh crore and ₹53.5 lakh crore respectively.", where = "page 19" },
  ]

[[records.figures]]
basis = "revised_estimate"
year = "2025-26"
amount = 49.6
unit = "lakh_crore"
evidence = [
    { source_id = "union-budget-summary-2026-27", quote = "Revised Estimates 2025-26 The Revised Estimates of the non-debt receipts are ₹34 lakh crore of which the Centre’s net tax receipts are ₹26.7 lakh crore. The Revised Estimate of the total expenditure is ₹49.6 lakh crore, of which the capital expenditure is about ₹11 lakh crore.", where = "page 7" },
  ]

[[records.statements]]
text = "The Centre’s net tax receipts are estimated at ₹28.7 lakh crore for 2026-27."
evidence = [
    { source_id = "union-budget-speech-2026-27", quote = "Coming to 2026-27, the non-debt receipts and the total expenditure are estimated as ₹36.5 lakh crore and ₹53.5 lakh crore respectively. The Centre’s net tax receipts are estimated at ₹28.7 lakh crore.", where = "page 19" },
  ]

[[records.statements]]
text = "To finance the fiscal deficit, net market borrowings from dated securities are estimated at ₹11.7 lakh crore and gross market borrowings at ₹17.2 lakh crore."
evidence = [
    { source_id = "union-budget-speech-2026-27", quote = "To finance the fiscal deficit, the net market borrowings from dated securities are estimated at ₹11.7 lakh crore. The balance financing is expected to come from small savings and other sources. The gross market borrowings are estimated at ₹17.2 lakh crore.", where = "page 19" },
  ]

