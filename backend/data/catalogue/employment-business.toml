  "The age limit, which differs by course. The State Portal page gives a range for the selected course without saying which course has which limit.",
  "Whether a job is guaranteed. The 2016 order lists a placement or self-employment feature and the State Portal page says training providers may assist with placement; the FAQ says that you do not get a placement if you drop out. No document says that every trainee gets a job.",
  "The current daily allowance. The only amount found is in the 2018 FAQ.",
  "A closing date. Training is given in batches at approved centres, with no single application window.",
  "A helpline number.",
]

