# PM Internship Scheme (employment)
# =================================================================================================

[[entries]]
id = "pm-internship-scheme"
name = "Prime Minister’s Internship Scheme (PMIS)"
kind = "scheme"
sectors = ["employment"]
level = "central"
department = "Ministry of Corporate Affairs, Government of India"
status = "active"
status_note = "The documents describe a pilot phase (rounds in 2024 and 2025). Later rounds, rules and amounts may differ: check the portal. The ministry's own guidelines could not be downloaded."
source_ids = ["pminternship-pib-2024", "pminternship-pib-2025"]
last_verified = 2026-10-31
summary = { en = "A paid internship in a large company, with a monthly stipend, a one-time grant and insurance cover, for young people who are not working or studying full-time.", bn = "যাঁরা পূর্ণ সময় কাজ বা পড়াশোনা করছেন না, সেই তরুণদের জন্য বড় সংস্থায় বেতনসহ ইন্টার্নশিপ; মাসিক ভাতা, এককালীন অনুদান ও বিমা সুরক্ষা।", hi = "जो युवा पूरे समय नौकरी या पढ़ाई नहीं कर रहे, उनके लिए बड़ी कंपनी में वेतन सहित इंटर्नशिप; मासिक वजीफ़ा, एकमुश्त अनुदान और बीमा सुरक्षा।" }
target = { en = "Young Indian nationals within the age band of the scheme, with a school, ITI, diploma or degree qualification, who are not employed full-time or in full-time education.", bn = "স্কুল, আইটিআই, ডিপ্লোমা বা ডিগ্রি যোগ্যতাসম্পন্ন, প্রকল্পের বয়সসীমার মধ্যে থাকা ভারতীয় তরুণ, যাঁরা পূর্ণ সময় কর্মরত বা পূর্ণ সময় শিক্ষায় নেই।", hi = "स्कूल, आईटीआई, डिप्लोमा या डिग्री योग्यता वाले, योजना की आयु सीमा के भीतर के भारतीय युवा, जो पूरे समय नौकरी या पूरे समय पढ़ाई में नहीं हैं।" }
not_stated = [
  "Whether a round is open now, and its closing date. The documents give the dates of the 2024 and 2025 rounds only.",
  "How many internships you can apply for at once. The October 2024 document says up to five on the portal; the March 2025 document says up to three at the same time on the mobile app.",
  "The ministry's own guidelines text (its PDF returned an error), so rules here are those of the Press Information Bureau explainers.",
]

[entries.apply]
label = "PM Internship portal and mobile app"
url = "https://pminternship.mca.gov.in/"
evidence = [{ source_id = "pminternship-pib-2025", quote = "Eligible candidates can apply through the new mobile app or through the Portal accessible at https://pminternship.mca.gov.in/", where = "page 4" }]

[[entries.benefits]]
text = "A monthly stipend of ₹5,000 for the whole internship: ₹500 from the partner company and ₹4,500 from the government into the intern's Aadhaar-seeded bank account."
evidence = [
  { source_id = "pminternship-pib-2024", quote = "Interns will receive a monthly stipend of ₹5,000 throughout the internship duration.", where = "page 3" },
  { source_id = "pminternship-pib-2024", quote = "₹500 contributed by partner companies, contingent on attendance and conduct.", where = "page 3" },
  { source_id = "pminternship-pib-2024", quote = "The remaining ₹4,500 will be provided by the government via Direct Benefit Transfer (DBT)", where = "page 3" },
]

[[entries.benefits]]
text = "A one-time grant of ₹6,000, paid through direct benefit transfer after joining the internship."
evidence = [{ source_id = "pminternship-pib-2024", quote = "Additionally, a one-time grant of ₹6,000 will be disbursed after joining the internship, also through DBT.", where = "page 3" }]

[[entries.benefits]]
text = "Insurance cover under two government schemes, with the premium paid by the government."
evidence = [
  { source_id = "pminternship-pib-2024", quote = "All interns will be covered under the government’s insurance schemes", where = "page 3" },
  { source_id = "pminternship-pib-2024", quote = "with the premium paid by the government.", where = "page 3" },
]

[[entries.eligibility]]
text = "In the pilot, a 12-month internship for Indian nationals aged 21 to 24 years who are not employed full-time or in full-time education (online or distance learners can apply)."
evidence = [{ source_id = "pminternship-pib-2024", quote = "The Pilot Project offers a 12-month internship program designed for youth aged 21 to 24 years, specifically for Indian nationals who are not employed full-time or engaged in full-time education.", where = "page 2" }]

[[entries.eligibility]]
text = "Candidates who passed High School or Higher Secondary School, hold an ITI certificate or a polytechnic diploma, or have a degree such as BA, B.Sc, B.Com, BCA or BBA."
evidence = [{ source_id = "pminternship-pib-2024", quote = "Candidates who have passed High School or Higher Secondary School, have a certificate from an ITI, have a diploma from a polytechnic institute. Graduated with degrees such as BA, B.Sc, B.Com, BCA, BBA, B.Pharma, etc.", where = "page 2" }]

[[entries.exclusions]]
text = "Not eligible: graduates of IITs, IIMs, National Law Universities, IISER, NIDs and IIITs; holders of CA, CMA, CS, MBBS, BDS, MBA or any master's or higher degree."
evidence = [
  { source_id = "pminternship-pib-2024", quote = "Graduates from IITs, IIMs, National Law Universities, IISER, NIDs, and IIITs", where = "page 2" },
  { source_id = "pminternship-pib-2024", quote = "Holders of qualifications such as CA, CMA, CS, MBBS, BDS, MBA, or any master’s or higher degree.", where = "page 2" },
]

[[entries.exclusions]]
text = "Not eligible: people already in skill training, an apprenticeship, an internship or student training under a Central or State government scheme, and people who completed an apprenticeship under NATS or NAPS."
evidence = [
  { source_id = "pminternship-pib-2024", quote = "Those undergoing skill, apprenticeships, internships, or student training under Central or State government schemes.", where = "page 2" },
  { source_id = "pminternship-pib-2024", quote = "Individuals who have completed apprenticeships under National Apprenticeship Training Scheme (NATS)", where = "page 2" },
]

[[entries.exclusions]]
text = "Not eligible: a candidate whose family members' income is above Rs 8 lakh for FY 2023-24 (the pilot's rule), or whose family members are permanent or regular government employees."
evidence = [
  { source_id = "pminternship-pib-2024", quote = "If the income of any of the family members of the candidate exceeds Rs 8 Lakh for FY 2023-24.", where = "page 2" },
  { source_id = "pminternship-pib-2024", quote = "Family members of permanent or regular government employees.", where = "page 2" },
]

[[entries.documents]]
text = "An Aadhaar-seeded bank account, into which the government's share of the stipend and the grant are paid."
evidence = [{ source_id = "pminternship-pib-2024", quote = "The remaining ₹4,500 will be provided by the government via Direct Benefit Transfer (DBT) to the intern’s Aadhaar-seeded", where = "page 3" }]

[[entries.steps]]
text = "Register on the portal, where a resume is generated from your information, then browse and apply for internships by location, sector, role and qualification."
evidence = [{ source_id = "pminternship-pib-2024", quote = "Eligible candidates must register on the portal, where a resume will be generated based on their information.", where = "page 4" }]

[[entries.steps]]
text = "The portal shortlists candidates and sends them to the company; the company chooses, and you accept an offer through the portal."
evidence = [
  { source_id = "pminternship-pib-2024", quote = "Companies can then choose candidates based on their own criteria and processes.", where = "page 4" },
  { source_id = "pminternship-pib-2024", quote = "Once an internship offer is extended, candidates can accept the offer through the portal", where = "page 4" },
]

