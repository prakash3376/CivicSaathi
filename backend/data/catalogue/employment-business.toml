# Employment & Skill Development and Business & MSME: programmes in the catalogue. Every statement
# carries a quote that `python -m app.cli catalogue-check` finds in the saved official document.
# English wording only (the quotes are English); the summary and the "who is it for" line are in
# three languages and hold no figure. The Bengali and Hindi are drafts by a non-native speaker and
# need a native speaker's review.

# =================================================================================================
# PM Vishwakarma (business + employment)
# =================================================================================================

[[entries]]
id = "pm-vishwakarma"
name = "PM Vishwakarma"
kind = "scheme"
sectors = ["business", "employment"]
level = "central"
department = "Ministry of Micro, Small and Medium Enterprises (nodal ministry), with the Ministry of Skill Development and Entrepreneurship and the Department of Financial Services, Government of India"
status = "active"
status_note = "The guidelines say the scheme runs initially for five years, up to 2027-28."
source_ids = ["pmvishwakarma-guidelines"]
last_verified = 2026-10-31
summary = { en = "Recognition, skill training, a toolkit grant, low-interest loans without collateral and market support for traditional artisans and craftspeople.", bn = "ঐতিহ্যবাহী কারিগর ও হস্তশিল্পীদের জন্য স্বীকৃতি, দক্ষতা প্রশিক্ষণ, সরঞ্জামের অনুদান, জামানত ছাড়া কম সুদের ঋণ এবং বাজার পাওয়ার সহায়তা।", hi = "पारंपरिक कारीगरों और शिल्पकारों के लिए पहचान, कौशल प्रशिक्षण, औज़ार अनुदान, बिना गारंटी कम ब्याज का ऋण और बाज़ार से जुड़ने में सहायता।" }
target = { en = "Self-employed artisans and craftspeople in the listed traditional trades, who work with their hands and tools.", bn = "তালিকাভুক্ত ঐতিহ্যবাহী পেশায় হাত ও যন্ত্রপাতি দিয়ে কাজ করা স্বনিযুক্ত কারিগর ও হস্তশিল্পী।", hi = "सूचीबद्ध पारंपरिक व्यवसायों में हाथ और औज़ारों से काम करने वाले स्वरोज़गार कारीगर और शिल्पकार।" }
not_stated = [
  "A closing date for registration. The guidelines do not give one.",
  "The helpline number. The guidelines only say that a multi-lingual helpline will be available on the portal.",
  "The full list of trades is in the guidelines (Table 1); check it against your own trade before you register.",
]

[entries.apply]
label = "PM Vishwakarma portal"
url = "https://pmvishwakarma.gov.in/"
evidence = [{ source_id = "pmvishwakarma-guidelines", quote = "Further, an Aadhaar authenticated and centralized PM Vishwakarma portal shall act as the facilitator for this exercise", where = "page 29" }]

[[entries.benefits]]
text = "A PM Vishwakarma Certificate and ID Card, given digitally and in physical form, which recognise the person as a Vishwakarma and make them eligible for all the benefits of the scheme."
evidence = [{ source_id = "pmvishwakarma-guidelines", quote = "The artisans and craftspeople will receive PM Vishwakarma Certificate and PM Vishwakarma ID Card.", where = "page 17" }]

[[entries.benefits]]
text = "A training stipend of Rs. 500 per day while undergoing the Basic and Advanced Training."
evidence = [{ source_id = "pmvishwakarma-guidelines", quote = "Each beneficiary will be eligible to receive a training stipend of Rs. 500 per day while undergoing the Basic and Advanced Training programmes.", where = "page 21" }]

[[entries.benefits]]
text = "A toolkit incentive of up to Rs. 15,000, paid through e-RUPI or e-vouchers that can be used at designated centres to buy improved tools, after the skill assessment."
evidence = [
  { source_id = "pmvishwakarma-guidelines", quote = "A toolkit incentive of upto Rs. 15,000 will be provided to the beneficiary after Skill Assessment at the start of Basic Training.", where = "page 21" },
  { source_id = "pmvishwakarma-guidelines", quote = "The incentive will be disbursed to the beneficiaries through e-RUPI/ e-vouchers which can be utilized at designated centres to procure improved toolkits.", where = "page 21" },
]

[[entries.benefits]]
text = "Collateral-free Enterprise Development Loans in two tranches: a first loan of up to Rs. 1,00,000 and a second of up to Rs 2,00,000, at a concessional interest rate of 5%, with the Government of India paying the interest subvention (up to 8%) to the banks."
evidence = [
  { source_id = "pmvishwakarma-guidelines", quote = "first loan tranche upto Rs. 1,00,000/- and second loan tranche upto Rs 2,00,000/-.", where = "page 22" },
  { source_id = "pmvishwakarma-guidelines", quote = "Concessional rate of interest chargeable to beneficiaries for loan will be fixed at 5%. The interest subvention by the Government of India will be to an extent of 8% and provided upfront to the banks.", where = "page 22" },
  { source_id = "pmvishwakarma-guidelines", quote = "financial support will be provided to the targeted beneficiaries in the form of collateral free ‘Enterprise Development Loans’.", where = "page 21" },
]

[[entries.benefits]]
text = "An incentive of Re. 1 per eligible digital transaction, up to a maximum of 100 eligible transactions a month, paid into the bank account."
evidence = [{ source_id = "pmvishwakarma-guidelines", quote = "An amount of Re. 1 per eligible digital transaction (upto maximum 100 eligible transactions monthly) will be credited to the beneficiary’s bank account in DBT mode through Aadhaar Payment Bridge System (APBS).", where = "page 24" }]

[[entries.eligibility]]
text = "An artisan or craftsperson who works with hands and tools in one of the family-based traditional trades listed in the guidelines, in the unorganized or informal sector, on a self-employment basis."
evidence = [{ source_id = "pmvishwakarma-guidelines", quote = "An artisan or craftsperson working with hands and tools and engaged in one of the family-based traditional trades specified in Para 2.3, in the unorganized or informal sector, on self-employment basis, shall be eligible for registration under PM Vishwakarma.", where = "page 27" }]

[[entries.eligibility]]
text = "The minimum age is 18 years on the date of registration."
evidence = [{ source_id = "pmvishwakarma-guidelines", quote = "The minimum age of the beneficiary should be 18 years on the date of registration.", where = "page 27" }]

[[entries.eligibility]]
text = "Registration and benefits are limited to one member of a family (husband, wife and unmarried children)."
evidence = [
  { source_id = "pmvishwakarma-guidelines", quote = "The registration and benefits under the Scheme shall be restricted to one member of the family.", where = "page 27" },
  { source_id = "pmvishwakarma-guidelines", quote = "a ‘family’ is defined as consisting of the husband, wife and unmarried children.", where = "page 27" },
]

[[entries.exclusions]]
text = "A person who took a loan under a similar credit-based self-employment scheme of the Central or a State Government (for example PMEGP, PM SVANidhi or MUDRA) in the past 5 years is not eligible; people who fully repaid a MUDRA or SVANidhi loan are eligible."
evidence = [{ source_id = "pmvishwakarma-guidelines", quote = "should not have availed loans under similar credit-based schemes of Central Government or State Government for self-employment/ business development, e.g. PMEGP, PM SVANidhi, MUDRA, in the past 5 years. However, the beneficiaries of MUDRA and SVANidhi who have fully repaid their loan, will be eligible under PM Vishwakarma.", where = "page 27" }]

[[entries.exclusions]]
text = "A person in government service, and their family members, are not eligible."
evidence = [{ source_id = "pmvishwakarma-guidelines", quote = "A person in government service and his/her family members shall not be eligible under the Scheme.", where = "page 28" }]

[[entries.documents]]
text = "Aadhaar, mobile number, bank details and ration card for registration; a person without a ration card must give the Aadhaar numbers of all family members."
evidence = [
  { source_id = "pmvishwakarma-guidelines", quote = "The beneficiary needs to produce documents like Aadhaar, mobile number, bank details, ration card for the registration.", where = "page 29" },
  { source_id = "pmvishwakarma-guidelines", quote = "In case of a beneficiary not having a ration card, he/she is required to produce Aadhaar numbers of all family members.", where = "page 30" },
]

[[entries.documents]]
text = "An Aadhaar-seeded bank account; Aadhaar authentication is needed at every stage."
evidence = [
  { source_id = "pmvishwakarma-guidelines", quote = "The beneficiary shall furnish his/her Aadhaar-seeded bank account details at the time of application.", where = "page 31" },
  { source_id = "pmvishwakarma-guidelines", quote = "At every stage of intervention under this Scheme, Aadhaar authentication will be mandatory.", where = "page 31" },
]

[[entries.steps]]
text = "Apply either directly on the Aadhaar-based PM Vishwakarma portal or through a Common Service Centre."
evidence = [{ source_id = "pmvishwakarma-guidelines", quote = "The registration shall be done by seeking applications through Common Service Centres (CSCs) or open online application, through Aadhaar based biometric authenticated PM Vishwakarma portal.", where = "page 30" }]

[[entries.steps]]
text = "There is no fee for enrolment: the cost of enrolment, registration and the certificate and ID card is borne by the Government."
evidence = [{ source_id = "pmvishwakarma-guidelines", quote = "There shall be no fee or charge for enrolment under PM Vishwakarma.", where = "page 30" }]

[[entries.steps]]
text = "Your application goes through three levels of checking (the Gram Panchayat or urban local body, the District Implementation Committee, then the Screening Committee). After approval you are registered and receive a digital ID, certificate and ID card."
evidence = [
  { source_id = "pmvishwakarma-guidelines", quote = "There will be a three-tier verification and approval process for the registration of beneficiaries:", where = "page 31" },
  { source_id = "pmvishwakarma-guidelines", quote = "After successful three-step verification and approval, artisans and craftspeople will be registered under this Scheme as Vishwakarmas.", where = "page 35" },
]

[[entries.steps]]
text = "After registration you go through a skill assessment and Basic Training (about 40 hours, over 5-7 days). Basic Training must be completed before the first loan."
evidence = [
  { source_id = "pmvishwakarma-guidelines", quote = "Basic Training will be of about 40 hours, over 5-7 days, and will include formalization of acquired skills", where = "page 18" },
  { source_id = "pmvishwakarma-guidelines", quote = "The beneficiary must have undergone Skill Assessment and completed Basic Training to be eligible to avail first tranche of credit support of upto Rs 1 lakh under the Scheme.", where = "page 21" },
]

# =================================================================================================
# PM SVANidhi (business)
# =================================================================================================

[[entries]]
id = "pm-svanidhi"
name = "PM Street Vendor’s AtmaNirbhar Nidhi (PM SVANidhi)"
kind = "scheme"
sectors = ["business"]
level = "central"
department = "Ministry of Housing and Urban Affairs, with the Department of Financial Services, Government of India"
status = "active"
status_note = "The guidelines of the restructured scheme extend the period for giving loans (see the dates in the benefits). The older 2020 FAQ on the portal is out of date and was not used."
source_ids = ["pmsvanidhi-scheme-guidelines", "pmsvanidhi-loan-guidelines"]
last_verified = 2026-10-31
summary = { en = "Working capital loans without collateral, in three steps of growing size, with an interest subsidy, for street vendors.", bn = "পথ বিক্রেতাদের জন্য জামানত ছাড়া কার্যকরী মূলধন ঋণ, ধাপে ধাপে বড় অঙ্কে, সুদে ভর্তুকিসহ।", hi = "रेहड़ी-पटरी वालों के लिए बिना गारंटी कार्यशील पूंजी ऋण, तीन चरणों में बढ़ती राशि के साथ और ब्याज पर सब्सिडी।" }
target = { en = "Street vendors who sell goods or services in towns and cities, and who hold a certificate of vending, identity card or letter of recommendation.", bn = "যে পথ বিক্রেতারা শহরে পণ্য বা পরিষেবা বিক্রি করেন এবং যাঁদের বিক্রয় শংসাপত্র, পরিচয়পত্র বা সুপারিশপত্র আছে।", hi = "शहरों और कस्बों में सामान या सेवाएँ बेचने वाले रेहड़ी-पटरी वाले, जिनके पास वेंडिंग प्रमाणपत्र, पहचान पत्र या सिफ़ारिश पत्र है।" }
not_stated = [
  "How long a loan takes to be sanctioned. The documents say nothing about a time limit for the loan itself.",
  "Whether your State or Union Territory has notified the street vending rules. The scheme guidelines say it covers States and UTs that have; the loan guidelines say all States and UTs. The portal lists the notified States.",
  "The bank interest rate. The guidelines only say it follows each lender's usual rates or the RBI rules for its category.",
]

[entries.apply]
label = "PM SVANidhi portal"
url = "https://pmsvanidhi.mohua.gov.in/"
evidence = [{ source_id = "pmsvanidhi-loan-guidelines", quote = "PMS Portal URL: https://pmsvanidhi.mohua.gov.in/", where = "page 3" }]

[[entries.benefits]]
text = "A collateral-free working capital loan in three tranches: up to ₹15,000 (repaid in 12 months), then up to ₹25,000 (18 months), then up to ₹50,000 (36 months). The next tranche opens after timely or early repayment, with a higher limit."
evidence = [
  { source_id = "pmsvanidhi-scheme-guidelines", quote = "SVs will be eligible for collateral free working capital term loan in three tranches:", where = "page 4" },
  { source_id = "pmsvanidhi-scheme-guidelines", quote = "st tranche loan of up to ₹15,000 to be repaid in 12 months,", where = "page 4" },
  { source_id = "pmsvanidhi-scheme-guidelines", quote = "nd tranche loan of up to ₹25,000 to be repaid in 18 months and", where = "page 4" },
  { source_id = "pmsvanidhi-scheme-guidelines", quote = "rd tranche loan of up to ₹50,000 to be repaid in 36 months Upon timely or early repayment of a tranche, vendors will be eligible for the next tranche of working capital term loans, with the enhanced limit.", where = "page 4" },
]

[[entries.benefits]]
text = "An interest subsidy of 7% per annum, credited to the borrower's account every quarter."
evidence = [{ source_id = "pmsvanidhi-scheme-guidelines", quote = "The vendors, availing loan under the scheme, are eligible to get an interest subsidy at 7% per annum. The interest subsidy amount will be credited into the borrower’s account quarterly.", where = "page 4" }]

[[entries.benefits]]
text = "No penalty for repaying before the scheduled date."
evidence = [{ source_id = "pmsvanidhi-scheme-guidelines", quote = "For repayment before the scheduled date, no prepayment penalty will be charged from the vendor.", where = "page 4" }]

[[entries.benefits]]
text = "Loans can be given until March 31, 2030, and interest subsidy can be claimed until March 31, 2033."
evidence = [
  { source_id = "pmsvanidhi-scheme-guidelines", quote = "the Government of India has approved the extension of the lending period till March 31, 2030.", where = "page 2" },
  { source_id = "pmsvanidhi-scheme-guidelines", quote = "The interest subsidy is available up to March 31, 2033.", where = "page 4" },
]

[[entries.benefits]]
text = "A UPI-linked RuPay credit card, as an extra facility, for vendors who have repaid the second tranche and are eligible for the third. The credit limit starts at ₹10,000 and is gradually raised to ₹30,000."
evidence = [
  { source_id = "pmsvanidhi-scheme-guidelines", quote = "A UPI linked RuPay Credit Card will be available as an additional facility for PM SVANidhi beneficiaries who have successfully repaid their 2nd tranche loan and are eligible for 3rd tranche loan under the PM SVANidhi Scheme.", where = "page 5" },
  { source_id = "pmsvanidhi-scheme-guidelines", quote = "initially the credit limit will be ₹10,000 which will be gradually increased to ₹30,000", where = "page 5" },
]

[[entries.benefits]]
text = "A cashback for digital transactions: up to ₹100 a month (₹1 per transaction), at most ₹1,200 a year in each tranche."
evidence = [{ source_id = "pmsvanidhi-scheme-guidelines", quote = "Any inward and outward digital transaction - up to ₹100 per month (₹1 per transaction) with maximum cashback of ₹1,200 per year in each tranche", where = "page 6" }]

[[entries.eligibility]]
text = "Street vendors who hold a valid Letter of Recommendation, Certificate of Vending or Identity Card issued by the urban local body or Town Vending Committee."
evidence = [{ source_id = "pmsvanidhi-loan-guidelines", quote = "SVs who possess a valid Letter of Recommendation (LoR) or Certificate of Vending (CoV) or Identity Card (ID Card) issued by the Urban Local Bodies (ULBs)/ Town Vending Committees (TVCs);", where = "page 3" }]

[[entries.eligibility]]
text = "Street vendors in census towns and peri-urban areas who have a Letter of Recommendation approved by their Block Development Officer."
evidence = [{ source_id = "pmsvanidhi-loan-guidelines", quote = "SVs operating in census towns, peri-urban areas etc., who have received an LoR approved by their Block Development Officer (BDO).", where = "page 3" }]

[[entries.eligibility]]
text = "A street vendor is a person who sells goods, food or services to the public in a street, footpath, public place or similar, from a temporary structure or by moving from place to place."
evidence = [{ source_id = "pmsvanidhi-scheme-guidelines", quote = "a ‘Street Vendor’ means a person engaged in vending of articles, goods, wares, food items or merchandise of everyday use or offering services to the general public, in a street, lane, side walk, footpath, pavement, public park or any other public place or private area, from a temporary built-up structure or by moving from place to place", where = "page 2" }]

[[entries.documents]]
text = "Certificate of Vending, Identity Card or Letter of Recommendation from the urban local body or Town Vending Committee (or a Block Development Officer's Letter of Recommendation in census towns and peri-urban areas)."
evidence = [
  { source_id = "pmsvanidhi-loan-guidelines", quote = "CoV/ ID Card/ LoR issued by ULBs or TVC, to SVs working within ULB’s jurisdiction", where = "page 3" },
  { source_id = "pmsvanidhi-loan-guidelines", quote = "LoR approved by the BDO to SVs operating in census towns, peri-urban areas etc.", where = "page 3" },
]

[[entries.documents]]
text = "Aadhaar Card (a Voter Identity Card only for vendors from Assam and Meghalaya who have no Aadhaar), savings bank passbook or statement with account details, and a valid and unique UPI ID linked to the bank account."
evidence = [{ source_id = "pmsvanidhi-loan-guidelines", quote = "Aadhaar Card iv. Voter Identity Card (for SVs from Assam and Meghalaya only) who do not have Aadhaar Card v. Savings Bank Account Passbook/ Bank Statement with account details of the SV vi. Valid and Unique UPI ID linked to the SVs bank account", where = "page 3" }]

[[entries.documents]]
text = "Lenders are told not to ask for any document beyond the official list."
evidence = [{ source_id = "pmsvanidhi-loan-guidelines", quote = "Institutions should not request any additional documents beyond those officially mandated.", where = "page 3" }]

[[entries.steps]]
text = "A vendor with a Certificate of Vending or Identity Card can apply for a loan directly on the portal with a preferred lender; a UPI ID linked to the bank account is mandatory."
evidence = [{ source_id = "pmsvanidhi-loan-guidelines", quote = "SVs holding a valid CoV or ID Card issued by the Urban Local Body (ULB)/ Town Vending Committees (TVC) are eligible to directly apply for a loan with their preferred LI through the PMS Portal and LoR is not required by them.", where = "page 5" }]

[[entries.steps]]
text = "A vendor without these can submit a combined Letter of Recommendation and loan application on the portal or the mobile app, at the urban local body or block office, or at an authorised Common Service Centre."
evidence = [
  { source_id = "pmsvanidhi-loan-guidelines", quote = "SV can apply themselves on the PMS Portal or through PM SVANidhi Mobile App", where = "page 5" },
  { source_id = "pmsvanidhi-loan-guidelines", quote = "At respective Urban Local Body (ULB) offices, Block offices or", where = "page 5" },
  { source_id = "pmsvanidhi-loan-guidelines", quote = "Authorized Common Service Centres (CSCs)", where = "page 5" },
]

[[entries.steps]]
text = "The urban local body or block verifies the application and then approves it; the letter is issued digitally on the portal, and the loan application then goes to your lender. Letters issued by hand are not valid."
evidence = [
  { source_id = "pmsvanidhi-loan-guidelines", quote = "The issuance of the LoR involves a two-step process, verification followed by approval.", where = "page 5" },
  { source_id = "pmsvanidhi-loan-guidelines", quote = "Manually issued LoRs will not be valid.", where = "page 3" },
]

# =================================================================================================
# PMFME (business)
# =================================================================================================

[[entries]]
id = "pmfme"
name = "PM Formalisation of Micro Food Processing Enterprises (PMFME)"
kind = "scheme"
sectors = ["business"]
level = "central"
department = "Ministry of Food Processing Industries, Government of India"
status = "active"
status_note = "The 2020 guidelines give the scheme period as 2020-21 to 2024-25. A September 2025 PIB document says it runs from 2020-21 to 2025-26. No later document was found, so check the PMFME portal for what applies now."
source_ids = ["pmfme-guidelines", "pmfme-pib-factsheet-2025"]
last_verified = 2026-10-31
summary = { en = "A subsidy linked to a bank loan for small food processing units, plus support for farmer groups and self-help groups.", bn = "ছোট খাদ্য প্রক্রিয়াকরণ ইউনিটের জন্য ব্যাংক ঋণের সঙ্গে যুক্ত ভর্তুকি, এবং কৃষক গোষ্ঠী ও স্বনির্ভর গোষ্ঠীর জন্য সহায়তা।", hi = "छोटी खाद्य प्रसंस्करण इकाइयों के लिए बैंक ऋण से जुड़ी सब्सिडी, तथा किसान समूहों और स्वयं सहायता समूहों के लिए सहायता।" }
target = { en = "Existing small, unregistered food processing units run by an individual or a family, and farmer producer organisations and self-help groups.", bn = "ব্যক্তি বা পরিবার পরিচালিত বিদ্যমান ছোট, অনিবন্ধিত খাদ্য প্রক্রিয়াকরণ ইউনিট এবং কৃষক উৎপাদক সংস্থা ও স্বনির্ভর গোষ্ঠী।", hi = "व्यक्ति या परिवार द्वारा चलाई जा रही मौजूदा छोटी, अपंजीकृत खाद्य प्रसंस्करण इकाइयाँ, तथा किसान उत्पादक संगठन और स्वयं सहायता समूह।" }
not_stated = [
  "The documents to bring. The guidelines say a Detailed Project Report goes to the bank with the necessary documents, but do not list them.",
  "A closing date. Applications are described as invited on an ongoing basis at district level.",
  "How to apply on the portal: the guidelines describe the process through the district and state agencies, not the portal screens.",
]

[entries.apply]
label = "PMFME portal"
url = "https://pmfme.mofpi.gov.in/"
evidence = [{ source_id = "pmfme-guidelines", quote = "The Scheme would to be monitored and the entire flow of data and approval of proposals, etc. would take place on an online system.", where = "page 30" }]

[[entries.benefits]]
text = "For an individual micro food processing unit, a credit-linked capital subsidy of 35% of the eligible project cost, up to Rs.10.0 lakh per unit. The owner contributes at least 10% and the rest is a bank loan."
evidence = [{ source_id = "pmfme-guidelines", quote = "Individual micro food processing units would be provided credit-linked capital subsidy @35% of the eligible project cost with a maximum ceiling of Rs.10.0 lakh per unit. Beneficiary contribution should be minimum of 10% of the project cost with balance being loan from Bank.", where = "page 7" }]

[[entries.benefits]]
text = "Seed capital of ₹40,000 per self-help group member for working capital and small tools, given through the group's federation as a repayable loan."
evidence = [
  { source_id = "pmfme-pib-factsheet-2025", quote = "₹40,000 per SHG member for working capital and small tools.", where = "page 4" },
  { source_id = "pmfme-pib-factsheet-2025", quote = "Seed capital given at federation level and disbursed as repayable loan to members.", where = "page 4" },
]

[[entries.benefits]]
text = "Farmer producer organisations and producer cooperatives get a grant of 35% with credit linkage."
evidence = [{ source_id = "pmfme-pib-factsheet-2025", quote = "Grant support at 35% with credit linkage.", where = "page 4" }]

[[entries.benefits]]
text = "Marketing training is fully funded under the scheme, and support is given for a common brand, packaging and standardisation for groups."
evidence = [
  { source_id = "pmfme-pib-factsheet-2025", quote = "Training in marketing fully funded under the scheme.", where = "page 4" },
  { source_id = "pmfme-pib-factsheet-2025", quote = "Development of common brand, packaging and standardisation.", where = "page 4" },
]

[[entries.eligibility]]
text = "An existing micro food processing unit that is in operation."
evidence = [{ source_id = "pmfme-guidelines", quote = "Existing micro food processing units in operations;", where = "page 7" }]

[[entries.eligibility]]
text = "The enterprise must be unincorporated and employ fewer than 10 workers; the applicant must own it (proprietary or partnership firm)."
evidence = [
  { source_id = "pmfme-guidelines", quote = "The enterprise should be unincorporated and should employ less than 10 workers;", where = "page 7" },
  { source_id = "pmfme-guidelines", quote = "Ownership status of enterprise could be proprietary / partnership firm;", where = "page 7" },
]

[[entries.eligibility]]
text = "The applicant must be above 18 years of age and have passed at least the VIII standard."
evidence = [{ source_id = "pmfme-guidelines", quote = "The applicant should be above 18 years of age and should possess at least VIII standard pass educational qualification;", where = "page 7" }]

[[entries.eligibility]]
text = "Only one person from a family can get the assistance (the family means self, spouse and children). The applicant must be willing to put in 10% of the project cost and take a bank loan."
evidence = [
  { source_id = "pmfme-guidelines", quote = "Only one person from one family would be eligible for obtaining financial assistance.", where = "page 7" },
  { source_id = "pmfme-guidelines", quote = "Willingness to formalize and contribute10% of project cost and obtain Bank loan;", where = "page 7" },
]

[[entries.eligibility]]
text = "Units making the product chosen for the district (One District One Product) are preferred, and new units are supported only for that product."
evidence = [
  { source_id = "pmfme-guidelines", quote = "The enterprise should preferably be involved in the product identified in the ODOP of the district.", where = "page 7" },
  { source_id = "pmfme-guidelines", quote = "New units, whether for individuals or groups would only be supported for ODOP products.", where = "page 6" },
]

[[entries.exclusions]]
