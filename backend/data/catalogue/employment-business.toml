target = { en = "Rural youth from poor families, with a higher age limit for women and some other groups.", bn = "দরিদ্র পরিবারের গ্রামীণ যুবক-যুবতী; মহিলা ও কিছু অন্য গোষ্ঠীর জন্য বয়সসীমা বেশি।", hi = "गरीब परिवारों के ग्रामीण युवा; महिलाओं और कुछ अन्य समूहों के लिए आयु सीमा अधिक है।" }
not_stated = [
