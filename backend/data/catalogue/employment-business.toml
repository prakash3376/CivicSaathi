[[entries.benefits]]
text = "The order that introduced the scheme lists as a feature a 70% placement or self-employment target, of which 50% wage-based employment, for trainees after completing the training."
evidence = [{ source_id = "utkarsh-bangla-compendium", quote = "70% placements/self-employment out of which 50% wage-based employment has been guaranteed under the scheme for the trainees after completion of the training", where = "page 20" }]

[[entries.eligibility]]
text = "The applicant should be a resident of West Bengal."
evidence = [{ source_id = "wb-utkarsh-page", quote = "Applicant should be a resident of West Bengal.", where = "Eligibility" }]

[[entries.eligibility]]
text = "The applicant should generally be unemployed, underemployed, a school or college dropout, a job seeker or a person who wants to upgrade skills."
evidence = [{ source_id = "wb-utkarsh-page", quote = "Applicant should generally be unemployed, underemployed, a school/college dropout, job seeker or person seeking ski upgradation.", where = "Eligibility" }]

[[entries.eligibility]]
text = "The applicant must meet the minimum age set for the chosen course (15 to 45 years) and the minimum educational qualification for the trade."
evidence = [
  { source_id = "wb-utkarsh-page", quote = "Applicant should meet the minimum age requirement prescribed for the selected course (15 to 45 years)", where = "Eligibility" },
  { source_id = "wb-utkarsh-page", quote = "Applicant should meet the minimum educational qualification required for the selected trade or training programme.", where = "Eligibility" },
]

[[entries.eligibility]]
text = "Women, economically weaker sections, minorities, Scheduled Castes, Scheduled Tribes and persons with disabilities may receive priority."
evidence = [{ source_id = "wb-utkarsh-page", quote = "Women, economically weaker sections, minorities, Scheduled Castes, Scheduled Tribes and persons with disabilities may receive priority under inclusive skill development objectives.", where = "Eligibility" }]

[[entries.exclusions]]
text = "Attendance below 80% means you cannot sit the final assessment or get the certificate, and a candidate who drops out of training does not get the certificate or a placement."
evidence = [
  { source_id = "pbssd-utkarsh-faq", quote = "If your attendance is lower than 80%, then you will not be eligible to appear for the final assessment and certification.", where = "Question 16" },
  { source_id = "pbssd-utkarsh-faq", quote = "If you have to drop-out of training, then you will not get your certificate or placement.", where = "Question 22" },
]

[[entries.documents]]
text = "Basic documents: identity proof, address proof, educational certificate, bank details and a photograph."
evidence = [{ source_id = "wb-utkarsh-page", quote = "Applicant should possess basic documents such as identity proof, address proof, educational certificate, bank details and photograph.", where = "Eligibility" }]

[[entries.documents]]
text = "Documents that may be asked for: Aadhaar card, voter ID, residence proof, educational certificate, bank passbook and photograph, plus a caste certificate or disability certificate where they apply."
evidence = [{ source_id = "wb-utkarsh-page", quote = "Required documents such as Aadhaar card, voter ID, residence proof, educational certificate, caste certificate if applicable, disability certificate if applicable, bank passbook and photograph may be submitted.", where = "How to apply" }]

[[entries.steps]]
text = "Visit the Utkarsh Bangla portal, or contact the nearest approved training centre, District Skill Development Office, BDO office or municipal office."
evidence = [{ source_id = "wb-utkarsh-page", quote = "The applicant should visit the Utkarsh Bangla portal or contact the nearest approved training centre, District Skill Development Office, BDO office or municipal office.", where = "How to apply" }]

[[entries.steps]]
text = "Check the courses, training centres, eligibility criteria and batch availability, then register with your personal details, address, qualification, preferred trade and contact details."
evidence = [
  { source_id = "wb-utkarsh-page", quote = "The applicant should check available courses, training centres, eligibility criteria and batch availability.", where = "How to apply" },
  { source_id = "wb-utkarsh-page", quote = "The applicant should register by providing personal details, address, educational qualification, preferred trade and contact details.", where = "How to apply" },
]

[[entries.steps]]
text = "You can pick a training provider for the job role on the portal and register with it."
evidence = [{ source_id = "pbssd-utkarsh-faq", quote = "You can then register yourself against the Training provider of your choice through the portal for the particular job role.", where = "Question 10" }]

[[entries.steps]]
text = "After verification you are enrolled in a batch, train in the classroom and in practice, and are assessed by an approved assessment agency."
evidence = [
  { source_id = "wb-utkarsh-page", quote = "The applicant is enrolled in a suitable training batch based on eligibility, interest and seat availability.", where = "How to apply" },
  { source_id = "wb-utkarsh-page", quote = "After training, assessment is conducted by the approved assessment agency. Successful candidates receive certification.", where = "How to apply" },
]
