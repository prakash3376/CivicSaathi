[[entries]]
id = "utkarsh-bangla"
name = "Utkarsh Bangla"
kind = "scheme"
sectors = ["employment"]
level = "state"
state = "West Bengal"
department = "Technical Education, Training & Skill Development Department, Government of West Bengal (implemented by the Paschim Banga Society for Skill Development)"
status = "active"
status_note = "The West Bengal State Portal page says it was last updated on 26 June 2026. The PBSSD FAQ used for the allowance and attendance rules dates from 2018, so those details may have changed."
source_ids = ["wb-utkarsh-page", "pbssd-utkarsh-faq", "utkarsh-bangla-compendium"]
last_verified = 2026-10-31
summary = { en = "Free short-term skill training with a certificate and help towards a job or self-employment, for residents of West Bengal.", bn = "পশ্চিমবঙ্গের বাসিন্দাদের জন্য বিনামূল্যে স্বল্পমেয়াদি দক্ষতা প্রশিক্ষণ, শংসাপত্র এবং চাকরি বা স্বনিযুক্তিতে সহায়তা।", hi = "पश्चिम बंगाल के निवासियों के लिए निःशुल्क अल्पकालिक कौशल प्रशिक्षण, प्रमाणपत्र और नौकरी या स्वरोज़गार में सहायता।" }
target = { en = "Young people and job seekers who live in West Bengal, such as the unemployed, school or college dropouts and people who want to upgrade their skills.", bn = "পশ্চিমবঙ্গের বাসিন্দা তরুণ ও কর্মপ্রার্থী, যেমন বেকার, স্কুল বা কলেজ ছেড়ে দেওয়া এবং দক্ষতা বাড়াতে চান এমন মানুষ।", hi = "पश्चिम बंगाल में रहने वाले युवा और रोज़गार चाहने वाले, जैसे बेरोज़गार, स्कूल या कॉलेज छोड़ने वाले और कौशल बढ़ाना चाहने वाले लोग।" }
