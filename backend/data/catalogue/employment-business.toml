evidence = [{ source_id = "pmfme-guidelines", quote = "Cost of the land should not be included in the Project cost.", where = "page 7" }]

[[entries.steps]]
text = "Applications are invited at the district level on an ongoing basis. Resource Persons check applications received directly in the field."
evidence = [
  { source_id = "pmfme-guidelines", quote = "Applications would be invited at the district level on an ongoing basis for Units, from those interested in availing the benefits under the Scheme.", where = "page 8" },
  { source_id = "pmfme-guidelines", quote = "For applications received directly, RPs would undertake field verification and due diligence to assess their potential.", where = "page 8" },
]

[[entries.steps]]
text = "The District Level Committee studies the report on each unit and interviews the interested persons."
evidence = [{ source_id = "pmfme-guidelines", quote = "District Level Committee should study the report submitted by RP for each Unit and interview the interested persons.", where = "page 8" }]

[[entries.steps]]
text = "For approved cases, the Resource Person helps prepare the project report for the bank loan, and the report and documents go to the bank for sanction."
evidence = [
  { source_id = "pmfme-guidelines", quote = "For the cases recommended by the District Level Committee/SNA, RPs should help them in preparation of DPR for availing bank loan for upgradation of the Unit.", where = "page 8" },
  { source_id = "pmfme-guidelines", quote = "The DPR along with necessary documents should be submitted to the Banks for sanction of loan.", where = "page 8" },
]

