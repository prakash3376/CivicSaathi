  "A closing date: training is given through approved centres and batches, not through one application window.",
  "A helpline number.",
]

[entries.apply]
label = "DDU-GKY site (Ministry of Rural Development)"
url = "https://ddugky.gov.in/"
evidence = [{ source_id = "ddugky-faq-2022", quote = "Deen Dayal Upadhyaya Grameen Kaushalya Yojana (DDU-GKY) is the demand-driven placement-linked skill training initiative of the Ministry of Rural Development", where = "Q 1" }]

[[entries.benefits]]
text = "The whole cost of the skill training is paid by the scheme: no fees, registration, examination, certification or placement charges."
evidence = [{ source_id = "ddugky-faq-2022", quote = "DDU-GKY subsidizes 100% cost of skill training of candidates at its approved training centres implemented by its PIAs in sanctioned projects. There are no fees, registration charges, examination or certification charges and no placement charges.", where = "Q 11" }]

[[entries.benefits]]
text = "Courses of three, six, nine or twelve months, with on-the-job training, and a government-recognised certificate on passing."
evidence = [
  { source_id = "ddugky-faq-2022", quote = "offers three-month, six-month, nine-month and twelve-month training courses", where = "Q 12" },
  { source_id = "ddugky-faq-2022", quote = "candidates will be provided a government recognized certificate upon successful completion of the training.", where = "Q 14" },
]

[[entries.benefits]]
text = "Free accommodation and food in residential programmes; in non-residential programmes, Rs. 100 for every eight hours of training attended, paid into the bank account."
evidence = [
  { source_id = "ddugky-faq-2022", quote = "Free accommodation and food in residential training programs", where = "Q 17" },
  { source_id = "ddugky-faq-2022", quote = "Rs. 100/- for every eight hours of training attended (workday) transferred directly to candidate’s bank account towards meal and conveyance allowance in non-residential training programs.", where = "Q 17" },
]

[[entries.benefits]]
text = "The scheme aims to help candidates find a job paying at least Rs. 6000 a month (at least 75% of those who complete training are to be placed), and gives post-placement support of Rs. 1,000 a month for two, three or six months depending on where the job is."
evidence = [
  { source_id = "ddugky-faq-2022", quote = "Enable the candidate to find a job that pays a minimum salary of Rs. 6000/- per month (at least 75% of all those who successfully completed training will be placed)", where = "Q 5" },
  { source_id = "ddugky-faq-2022", quote = "Rs. 1,000 per month will be transferred directly to his/her bank account for a period of two months in case he/she is placed within the district of domicile, for three months if placed within the state of domicile and for six months in case the placement happens outside the state of domicile.", where = "Q 20" },
]

[[entries.eligibility]]
text = "Rural youth from poor families aged 15 to 35 years."
evidence = [{ source_id = "ddugky-faq-2022", quote = "Rural youth from poor families in the age group of 15 to 35 years are eligible for the scheme.", where = "Q 6" }]

[[entries.eligibility]]
text = "Any one of these shows eligibility: a BPL card, a BPL PDS card, an RSBY card, being a family member of a registered self-help group member, or a family member of an MGNREGA worker with a minimum of 15 days of work in the last 12 months."
evidence = [
  { source_id = "ddugky-faq-2022", quote = "interim any of the following will ensure eligibility into DDU-GKY sponsored skill training programs:", where = "Q 6" },
  { source_id = "ddugky-faq-2022", quote = "Family members of paid workers under the Mahatma Gandhi National Rural Employment Guarantee Act (MGNREGA) with a minimum of 15 days of work in the last 12 months", where = "Q 6" },
  { source_id = "ddugky-faq-2022", quote = "Family members of Self Help Group (SHG) members of a registered SHG in the village", where = "Q 6" },
]

[[entries.eligibility]]
text = "The upper age limit is extended by 10 years, to 45 years, for women and for candidates from Particularly Vulnerable Tribal Groups, persons with disabilities, transgender persons and some other special groups."
evidence = [{ source_id = "ddugky-faq-2022", quote = "the upper age limit for women candidates, and candidates belonging to Particularly Vulnerable Tribal Groups (PVTGs), Persons with Disabilities (PwDs), Transgender and other Special Groups like rehabilitated bonded labour, victims of trafficking, manual scavengers, trans-genders, HIV positive persons, etc. shall be extended by 10 years to 45 years.", where = "Q 7" }]

[[entries.documents]]
text = "One identity proof for enrolment, such as a birth certificate, a BPL card, an MGNREGA worker card, an RSBY card, an Antyodaya Anna card, a BPL PDS card, or a self-help group certificate of a household member."
evidence = [
  { source_id = "ddugky-faq-2022", quote = "Any of the following documents may be furnished as identity proof for enrolment:", where = "Q 8" },
  { source_id = "ddugky-faq-2022", quote = "BPL Card of self or household (where candidate’s name is also mentioned)", where = "Q 8" },
]

[[entries.documents]]
text = "Candidates in a reserved category also need an SC/ST certificate or a disability certificate from the competent authority, or (for minority status) a self-certification."
evidence = [
  { source_id = "ddugky-faq-2022", quote = "Apart from the above, the reserved category would need to furnish any of the following proofs:", where = "Q 8" },
  { source_id = "ddugky-faq-2022", quote = "Self-certification by the candidate for his/her status as minority community", where = "Q 8" },
]

[[entries.steps]]
text = "Contact a training centre near you directly, or enrol through the Gram Panchayat or Gram Rozgar Sewak, who will recommend a nearby training centre."
evidence = [{ source_id = "ddugky-faq-2022", quote = "Alternatively, one can get enrolled with the respective Gram Panchayat or Gram Rozgar Sewak, who in turn will recommend the nearby Training Centre or its mobilization staff to meet the candidate and offer him/her counselling and guidance.", where = "Q 16" }]

[[entries.steps]]
text = "The training centre tests your aptitude and skill before you join a batch."
evidence = [{ source_id = "ddugky-faq-2022", quote = "Before the selection is made, the PIA training centre will test the candidate’s inherent aptitude and skill.", where = "Q 18" }]

