  { source_id = "wb-apy-page", quote = "Fill in required details such as name, age, bank account details, nominee information, and selected pension amount.", where = "scheme page, last updated 26 June 2026" },
  { source_id = "wb-apy-page", quote = "Submit the form at the bank or post office where you hold your savings account.", where = "scheme page, last updated 26 June 2026" },
]

