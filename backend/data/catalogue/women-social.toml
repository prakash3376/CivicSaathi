# Catalogue entries for the Women & Child Development and Social Welfare & Pensions sectors.
# Every statement carries a verbatim quote from an official document (see sources in
# data/sources/women-social.toml). Bengali and Hindi texts are drafts that need a native speaker.

# ==============================================================================================
# WOMEN & CHILD DEVELOPMENT
# ==============================================================================================

[[entries]]
id = "saksham-anganwadi-poshan-2"
name = "Saksham Anganwadi and Poshan 2.0"
kind = "scheme"
sectors = ["women-child"]
level = "central"
department = "Ministry of Women and Child Development, Government of India"
status = "active"
status_note = "The guidelines cover the Finance Commission period that ended with 2025-26; the documents read here do not say what applies after that."
source_ids = ["mwcd-saksham-guidelines"]
last_verified = 2026-10-31
summary = { en = "Nutrition, pre-school learning and health services for young children, pregnant women and nursing mothers, and some adolescent girls, given through Anganwadi centres.", bn = "অঙ্গনওয়াড়ি কেন্দ্রের মাধ্যমে ছোট শিশু, অন্তঃসত্ত্বা ও স্তন্যদানকারী মা এবং কিছু কিশোরীকে পুষ্টি, প্রাক-প্রাথমিক শিক্ষা ও স্বাস্থ্য পরিষেবা।", hi = "आंगनवाड़ी केंद्रों के ज़रिए छोटे बच्चों, गर्भवती और स्तनपान कराने वाली माताओं और कुछ किशोरियों को पोषण, पूर्व-विद्यालय शिक्षा और स्वास्थ्य सेवाएँ।" }
target = { en = "Children up to six years old, pregnant women, nursing mothers and adolescent girls in certain districts and states.", bn = "ছয় বছর পর্যন্ত শিশু, অন্তঃসত্ত্বা নারী, স্তন্যদানকারী মা এবং নির্দিষ্ট জেলা ও রাজ্যের কিশোরী।", hi = "छह साल तक के बच्चे, गर्भवती महिलाएँ, स्तनपान कराने वाली माताएँ और कुछ ज़िलों व राज्यों की किशोरियाँ।" }
not_stated = [
  "A separate application form or fee: the guidelines say the only pre-condition is registration at the nearest Anganwadi Centre.",
  "Which Anganwadi Centre serves your address, or the opening hours of the centre. Ask your local Anganwadi worker or the block child development office.",
  "What changed after the guidelines were issued in 2022. The guidelines also say the nutritional norms are under revision.",
]

[entries.apply]
label = "Ministry of Women and Child Development: Saksham Anganwadi and Poshan 2.0"
url = "https://wcd.gov.in/pregnant-lactating-women-children/nutrition-mission-saksham-anganwadi-and-poshan-2-0"
evidence = [{ source_id = "mwcd-saksham-guidelines", quote = "The only pre-condition is that the beneficiary has to be registered at the nearest Anganwadi Centre with Aadhaar identification.", where = "page 18" }]

[[entries.benefits]]
text = "Anganwadi centres give six services together: supplementary nutrition, pre-school non-formal education, nutrition and health education, immunization, health check-up and referral services."
evidence = [
  { source_id = "mwcd-saksham-guidelines", quote = "The Anganwadi Services Scheme provides the following package of services in an integrated manner to eligible beneficiaries:", where = "page 18, section 3.1" },
  { source_id = "mwcd-saksham-guidelines", quote = "i. supplementary nutrition ii. pre-school non-formal education iii. nutrition & health education iv. immunization v. health check-up and vi. referral services", where = "page 18, section 3.1" },
]

[[entries.benefits]]
text = "Pregnant women, nursing mothers, children aged 6 months to 3 years, severely malnourished children and adolescent girls aged 14 to 18 (where the scheme applies) are entitled to a take-home ration, and children aged 3 to 6 years to a hot cooked meal and morning snacks, at the Anganwadi centre where they are registered."
evidence = [{ source_id = "mwcd-saksham-guidelines", quote = "All pregnant women and lactating mothers (PW&LM), children in the age group of 6-36 months, SAM children and adolescent girls in the age group of 14-18 years (wherever applicable) are entitled to receive THR and Children in the age group of 3-6 years are entitled to receive HCM and Morning Snacks under the Anganwadi Services from the AWC where they are registered.", where = "page 21, section 3.3" }]

[[entries.benefits]]
text = "Supplementary nutrition is to be served for at least 300 days a year."
evidence = [{ source_id = "mwcd-saksham-guidelines", quote = "Supplementary Nutrition under the Scheme shall be served for a minimum of 300 days in a calendar year", where = "page 21, section 3.3" }]

[[entries.benefits]]
text = "The take-home ration is not given as raw ration such as wheat, rice or dal, and is to be handed out twice a month, preferably on the 1st and 15th."
evidence = [
  { source_id = "mwcd-saksham-guidelines", quote = "THR shall not be given in the form of raw ration (Wheat, Rice, Dal etc.).", where = "page 23, section 3.6" },
  { source_id = "mwcd-saksham-guidelines", quote = "The distribution of THR to beneficiaries shall be made twice a month, preferably on 1st and 15th of each calendar month uniformly.", where = "page 24, section 3.7" },
]

[[entries.eligibility]]
text = "The scheme covers children up to 6 years, pregnant women and lactating mothers, and adolescent girls (14-18 years) in Aspirational Districts and North Eastern States."
evidence = [{ source_id = "mwcd-saksham-guidelines", quote = "Children upto the age of 6 years; Pregnant Women and Lactating Mothers (PW&LM) and Adolescent Girls (14-18 years) in Aspirational Districts and North Eastern States.", where = "page 18, section 3.1" }]

[[entries.eligibility]]
text = "It is open to every eligible person on demand, whatever their caste, religion or income."
evidence = [{ source_id = "mwcd-saksham-guidelines", quote = "This Scheme is open to all eligible beneficiaries on demand, irrespective of caste, religion and income criteria.", where = "page 18, section 3.1" }]

[[entries.documents]]
text = "Aadhaar identification is needed at registration, but a child's own Aadhaar card is not required: the mother's Aadhaar card can be used."
evidence = [{ source_id = "mwcd-saksham-guidelines", quote = "A child's Aadhaar card shall not be mandatory for availing the benefits under the Scheme. The benefits under the scheme can be accessed using the mother's Aadhaar card.", where = "page 18, section 3.1" }]

[[entries.steps]]
text = "Register at the nearest Anganwadi Centre with Aadhaar identification; only registered beneficiaries receive supplementary nutrition."
evidence = [
  { source_id = "mwcd-saksham-guidelines", quote = "The only pre-condition is that the beneficiary has to be registered at the nearest Anganwadi Centre with Aadhaar identification.", where = "page 18, section 3.1" },
  { source_id = "mwcd-saksham-guidelines", quote = "Only those beneficiaries who are registered at the AWC are entitled to receive Supplementary Nutrition.", where = "page 21, section 3.3" },
]

[[entries.steps]]
text = "Pregnant women, nursing mothers and children who are staying in the area even for a short time can be registered and receive the services."
evidence = [{ source_id = "mwcd-saksham-guidelines", quote = "Pregnant women, lactating mothers and children up to the age of 6 years residing even temporarily in the coverage area of the AWC shall be registered and provided supplementary nutrition and other services.", where = "page 21, section 3.3" }]

