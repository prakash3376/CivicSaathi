[[entries]]
id = "sukanya-samriddhi-yojana"
name = "Sukanya Samriddhi Yojana (Sukanya Samriddhi Account Scheme)"
kind = "scheme"
sectors = ["women-child"]
level = "central"
department = "Government of India (rules under the Government Savings Promotion Act, 1873)"
status = "active"
source_ids = ["nsi-ssy-scheme-rules", "wb-ssy-page"]
last_verified = 2026-10-31
summary = { en = "A savings account for a girl child, opened by her guardian, that earns interest and allows part of the money to be taken out for her education.", bn = "কন্যাশিশুর নামে অভিভাবকের খোলা একটি সঞ্চয় অ্যাকাউন্ট, যেখানে সুদ পাওয়া যায় এবং শিক্ষার জন্য আংশিক টাকা তোলা যায়।", hi = "बालिका के नाम पर अभिभावक द्वारा खोला गया बचत खाता, जिस पर ब्याज मिलता है और जिससे पढ़ाई के लिए कुछ पैसे निकाले जा सकते हैं।" }
target = { en = "Guardians of a girl child who is below the age of ten when the account is opened.", bn = "যে কন্যাশিশুর বয়স অ্যাকাউন্ট খোলার সময় দশ বছরের কম, তার অভিভাবক।", hi = "उस बालिका के अभिभावक जिसकी उम्र खाता खोलते समय दस साल से कम हो।" }
not_stated = [
  "The current interest rate: the rules print the rate set in 2020 and the Government resets it from time to time. A West Bengal portal page last updated on 26 June 2026 gives a rate (see the benefits), but check the post office or bank for today's rate.",
  "Any fee.",
]

[entries.apply]
label = "National Savings Institute: Sukanya Samriddhi Account Scheme"
url = "https://www.nsiindia.gov.in/InternalPage.aspx?Id_Pk=171"
evidence = [{ source_id = "nsi-ssy-scheme-rules", quote = "The application in Form-1 for opening an account shall be accompanied by birth certificate of the girl child in whose name the account is to be opened, along with required documents of guardian.", where = "page 1, rule 3(3)" }]

[[entries.benefits]]
text = "The deposits earn interest, which is credited to the account at the end of each financial year."
evidence = [{ source_id = "nsi-ssy-scheme-rules", quote = "The interest shall be credited to the account at the end of each financial year", where = "page 2, rule 5(2)" }]

[[entries.benefits]]
text = "Once the girl is eighteen, or has passed the tenth standard (whichever is earlier), up to fifty per cent of the balance at the end of the previous financial year can be withdrawn for her education."
evidence = [
  { source_id = "nsi-ssy-scheme-rules", quote = "withdrawal of upto a maximum of fifty per cent. of the amount in the account at the end of the financial year preceding the year of application for withdrawal, shall be allowed for the purpose of education of the account holder", where = "page 3, rule 8(1)" },
  { source_id = "nsi-ssy-scheme-rules", quote = "such withdrawal shall be allowed after the account holder attains the age of eighteen years or has passed tenth standard, whichever is earlier.", where = "page 3, rule 8(1)" },
]

[[entries.benefits]]
text = "The account matures twenty-one years after it is opened, and can be closed earlier for the account holder's intended marriage if the girl will be at least eighteen on the date of marriage."
evidence = [
  { source_id = "nsi-ssy-scheme-rules", quote = "The account shall mature on completion of a period of twenty-one years from the date of its opening.", where = "page 3, rule 9(1)" },
  { source_id = "nsi-ssy-scheme-rules", quote = "The closure of the account may also be permitted before completion of twenty-one years if the account holder on an application makes a request for such closure for the reason of intended marriage of the account holder", where = "page 3, rule 9(2)" },
]

[[entries.eligibility]]
text = "A guardian can open the account in the name of a girl child who has not turned ten on the date of opening."
evidence = [{ source_id = "nsi-ssy-scheme-rules", quote = "The account may be opened by one of the guardian in the name of a girl child, who has not attained the age of ten years as on the date of opening of the account.", where = "page 1, rule 3(1)" }]

[[entries.eligibility]]
text = "Each girl can have only one account, and a family can have accounts for at most two girl children (with an exception for twins or triplets born in the first two births)."
evidence = [
  { source_id = "nsi-ssy-scheme-rules", quote = "Every account holder shall have a single account under this Scheme.", where = "page 1, rule 3(2)" },
  { source_id = "nsi-ssy-scheme-rules", quote = "An account under this Scheme may be opened for a maximum of two girl children in one family:", where = "page 1, rule 3(4)" },
]

[[entries.documents]]
text = "Form-1 with the girl child's birth certificate and the required documents of the guardian."
evidence = [{ source_id = "nsi-ssy-scheme-rules", quote = "The application in Form-1 for opening an account shall be accompanied by birth certificate of the girl child in whose name the account is to be opened, along with required documents of guardian.", where = "page 1, rule 3(3)" }]

[[entries.steps]]
text = "Open the account with at least two hundred and fifty rupees; later deposits are in multiples of fifty rupees, with at least two hundred and fifty rupees deposited in every financial year."
evidence = [{ source_id = "nsi-ssy-scheme-rules", quote = "The account may be opened with a minimum initial deposit of two hundred and fifty rupees and in multiples of fifty rupees thereafter and subsequent deposits shall be in multiples of fifty rupees subject to the condition that a minimum of two hundred and fifty rupees shall be made as deposit in a financial year in one account.", where = "page 2, rule 4(1)" }]

[[entries.steps]]
text = "No more than one lakh fifty thousand rupees can be deposited in a financial year, and deposits can be made only until fifteen years after the account was opened."
evidence = [
  { source_id = "nsi-ssy-scheme-rules", quote = "The total amount deposited in an account shall not exceed one lakh fifty thousand rupees in a financial year:", where = "page 2, rule 4(2)" },
  { source_id = "nsi-ssy-scheme-rules", quote = "Deposits may be made in the account till the completion of a period of fifteen years from the date of opening of the account.", where = "page 2, rule 4(3)" },
]

[[entries.steps]]
text = "The guardian runs the account until the girl turns eighteen; after that she operates it herself by submitting the necessary documents."
evidence = [{ source_id = "nsi-ssy-scheme-rules", quote = "The account shall be operated by the guardian till the account holder attains the age of eighteen years. The account shall be operated by the account holder herself after attaining age of eighteen years by submitting necessary documents.", where = "page 2, rule 6(1)" }]

[[entries.benefits]]
text = "A West Bengal portal page, last updated on 26 June 2026, says the account earns interest at the rate the Government notifies from time to time and gives the current rate as 8.2% a year, compounded annually."
evidence = [
  { source_id = "wb-ssy-page", quote = "The current rate is 8.2% per annum, compounded annually.", where = "scheme page, last updated 26 June 2026" },
  { source_id = "wb-ssy-page", quote = "Last updated on: Friday, 26th June, 2026", where = "scheme page footer" },
]

[[entries.steps]]
text = "The account is opened at a post office offering small savings schemes or an authorised public or private sector bank; the guardian asks for the account opening form and submits the documents."
evidence = [
  { source_id = "wb-ssy-page", quote = "Any post office offering small savings schemes", where = "scheme page, last updated 26 June 2026" },
  { source_id = "wb-ssy-page", quote = "The applicant should ask for the Sukanya Samriddhi Account opening form.", where = "scheme page, last updated 26 June 2026" },
]

