evidence = [{ source_id = "dfs-apy-faq", quote = "Approach the bank branch/ post office where individual’s savings bank account is held or open a savings account if the subscriber doesn’t have one.", where = "FAQ: procedure for opening an APY account" }]

[[entries.benefits]]
text = "A Central Government guaranteed minimum pension of Rs. 1000, 2000, 3000, 4000 or 5000 a month, after the age of 60 years until death."
evidence = [{ source_id = "jansuraksha-apy-details", quote = "Each subscriber under APY shall receive a Central Government guaranteed minimum pension of Rs. 1000 per month or Rs. 2000 per month or Rs. 3000 per month or Rs. 4000 per month or Rs. 5000 per month, after the age of 60 years until death;", where = "page 1, section 2.1" }]

[[entries.benefits]]
text = "After the subscriber's death the spouse receives the same pension; after both have died the nominee receives the pension wealth accumulated until the subscriber was 60."
evidence = [
  { source_id = "jansuraksha-apy-details", quote = "After the subscriber’s demise, the spouse of the subscriber shall be entitled to receive the same pension amount as that of the subscriber until the death of the spouse;", where = "page 1, section 2.1" },
  { source_id = "jansuraksha-apy-details", quote = "After the demise of both, the subscriber and the spouse, the nominee of the subscriber shall be entitled to receive the pension wealth, as accumulated till the age of 60 years of the subscriber.", where = "page 1, section 2.1" },
]

[[entries.eligibility]]
text = "APY is open to all citizens of India who have a savings bank account, aged 18 to 40 when they join."
evidence = [{ source_id = "jansuraksha-apy-details", quote = "APY is open to all citizens of India who have a savings bank account. The minimum age of joining APY is 18 years and maximum age is 40 years.", where = "page 2, section 3" }]

[[entries.exclusions]]
text = "From 1st October 2022, a citizen who is or has been an income-tax payer is not eligible to join APY."
evidence = [{ source_id = "jansuraksha-apy-details", quote = "From 1st October, 2022, any citizen who is or has been an income-tax payer, is not eligible to join APY.", where = "page 2, section 3" }]

[[entries.documents]]
text = "A savings bank account or post office savings account is mandatory."
evidence = [{ source_id = "dfs-apy-faq", quote = "the savings bank account/ post office savings bank account is mandatory for joining APY.", where = "FAQ" }]

[[entries.documents]]
text = "Nominee details are mandatory, and providing an Aadhaar number is desirable for proper identification."
evidence = [
  { source_id = "dfs-apy-faq", quote = "It is mandatory to provide nominee details in APY account.", where = "FAQ" },
  { source_id = "dfs-apy-faq", quote = "it is desirable to provide Aadhaar Number for proper identification of the subscriber.", where = "FAQ" },
]

[[entries.steps]]
text = "Go to the bank branch or post office where you hold your savings account, or open a savings account if you do not have one."
evidence = [{ source_id = "dfs-apy-faq", quote = "Approach the bank branch/ post office where individual’s savings bank account is held or open a savings account if the subscriber doesn’t have one.", where = "FAQ: procedure for opening an APY account" }]

[[entries.steps]]
text = "Contributions are paid by auto-debit from the savings account, monthly, quarterly or half-yearly, from the age of joining until the age of 60."
evidence = [{ source_id = "jansuraksha-apy-details", quote = "The subscribers are required to contribute the prescribed contribution amount from the age of joining APY till the age of 60 years.", where = "page 2, section 4" }]

[[entries.steps]]
