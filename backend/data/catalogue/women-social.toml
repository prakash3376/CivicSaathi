[[entries]]
id = "pm-matru-vandana-yojana"
name = "Pradhan Mantri Matru Vandana Yojana (PMMVY)"
kind = "scheme"
sectors = ["women-child"]
level = "central"
department = "Ministry of Women and Child Development, Government of India"
status = "active"
status_note = "The guidelines (PMMVY 2.0, under Mission Shakti) cover the Finance Commission period that ended with 2025-26; the documents read here do not say what applies after that."
source_ids = ["mwcd-mission-shakti-guidelines"]
last_verified = 2026-10-31
summary = { en = "Cash support for a pregnant or nursing mother from a disadvantaged section, paid in instalments straight into her bank or post office account.", bn = "সুবিধাবঞ্চিত অংশের অন্তঃসত্ত্বা ও সদ্যপ্রসূতি মাকে কিস্তিতে সরাসরি ব্যাংক বা পোস্ট অফিস অ্যাকাউন্টে নগদ সহায়তা।", hi = "वंचित वर्ग की गर्भवती और नई माताओं को किस्तों में सीधे बैंक या डाकघर खाते में नकद सहायता।" }
target = { en = "Pregnant women and nursing mothers from socially and economically disadvantaged sections, for the first child and for a second child who is a girl.", bn = "সামাজিক ও অর্থনৈতিকভাবে অনগ্রসর অংশের অন্তঃসত্ত্বা নারী ও স্তন্যদানকারী মা, প্রথম সন্তান এবং দ্বিতীয় কন্যাসন্তানের জন্য।", hi = "सामाजिक और आर्थिक रूप से वंचित वर्ग की गर्भवती महिलाएँ और स्तनपान कराने वाली माताएँ, पहले बच्चे और दूसरी बेटी के लिए।" }
not_stated = [
  "The current amounts and rules after the 2021-22 to 2025-26 period. Check the PMMVY portal.",
  "A last date to apply other than the limit in the guidelines (the guidelines give a number of days from pregnancy).",
  "A helpline number or fee.",
]

[entries.apply]
label = "PMMVY portal"
url = "https://pmmvy.wcd.gov.in/"
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "The PMMVY is implemented through web-based Management and Information System (MIS) Software, viz. Pradhan Mantri Matru Vandana Yojana-Common Application Software (PMMVY-CAS)", where = "page 30" }]

[[entries.benefits]]
text = "₹5000 in two instalments for the first child, and ₹6000 in one instalment after the birth for a second child, if the second child is a girl."
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "In case of the first child the amount of ₹5000 in two instalments and for the second child, the benefit of ₹6000 will be provided subject to second child is a girl child in one instalment after the birth.", where = "page 29" }]

[[entries.benefits]]
text = "The first instalment of ₹3,000 is paid on registration of the pregnancy and at least one ante-natal check-up within 6 months of the last menstrual period; the second instalment of ₹2,000 when the birth is registered and the child has had the first cycle of vaccines."
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "First Instalment On registration of pregnancy and at least one Ante-natal check-up within 6 months from LMP date at the Anganwadi Centre (AWC)/ approved Health facilities may be identified by the respective administering State /UT ₹ 3,000/-Second Instalment i. Child Birth is registered ii. Child has received first cycle of BCG, OPV,DPT and Hepatitis-B or its equivalent/substitute ₹ 2,000/-", where = "page 29" }]

[[entries.benefits]]
text = "The money goes directly into the beneficiary's bank or post office account by Direct Benefit Transfer."
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "The funds to the beneficiaries under PMMVY will be transferred directly to their Bank/Post Office account in Direct Benefit Transfer Mode.", where = "page 30" }]

[[entries.eligibility]]
text = "The scheme is for women from socially and economically disadvantaged sections, including women of scheduled castes and scheduled tribes, women with a disability of 40% or more, and holders of a BPL ration card."
evidence = [
  { source_id = "mwcd-mission-shakti-guidelines", quote = "The criteria for determining socially and economically disadvantaged sections of society will be the following:", where = "page 28" },
  { source_id = "mwcd-mission-shakti-guidelines", quote = "i. Women belonging to scheduled castes and scheduled tribes; ii. Women who are partially (40%) or fully disabled (Divyang Jan) iii. Women holder of BPL ration Card", where = "page 28" },
]

[[entries.eligibility]]
text = "Other qualifying groups include women under Ayushman Bharat PMJAY, e-Shram card holders, women farmers receiving Kisan Samman Nidhi, MGNREGA job card holders, women whose net family income is less than Rs. 8 Lakh a year, and pregnant or nursing Anganwadi workers, helpers and ASHAs."
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "v. Women holding E-shram card vi. Women farmers who are beneficiaries under KishanSammanNidhi vii. Women holding MGNREGA Job Card viii. Women whose net family income is less than Rs. 8 Lakh per annum ix. Pregnant and Lactating AWWs/ AWHs/ ASHAs", where = "page 29" }]

[[entries.eligibility]]
text = "The benefit is for the first two living children, provided the second child is a girl; for the second child, registration during the pregnancy is mandatory."
evidence = [
  { source_id = "mwcd-mission-shakti-guidelines", quote = "The benefit is available to a woman for the first two living children provided the second child is a girl.", where = "page 29" },
  { source_id = "mwcd-mission-shakti-guidelines", quote = "However, for availing benefits for second child, registration during the pregnancy shall be mandatory.", where = "page 29" },
]

[[entries.exclusions]]
text = "Women in regular employment with the Central or State Government or a public sector undertaking, or who get similar benefits under any law, are not entitled."
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "all pregnant women and lactating mothers in regular employment with the central Government or State Government or public Sector Undertaking or those who are in receipt of similar benefits under any law for the time being in force shall not be entitled to benefits under PMMVY.", where = "page 29" }]

[[entries.documents]]
text = "Benefits are paid only on the basis of the beneficiary's Aadhaar number."
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "Benefits can be availed only on the basis of the Aadhaar Number of Beneficiary so as to avoid any duplication or malpractices.", where = "page 29" }]

[[entries.documents]]
text = "The registration form lists: the Aadhaar card (or an identity card, or an Aadhaar enrolment slip if Aadhaar is not available), the MCP card, and the page of the bank or post office pass book showing name, account number and bank name."
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "1 Aadhaar Card of beneficiary 2 Identity Card of beneficiary (in case Aadhaar not available) 3 Aadhaar Enrolment slip of beneficiary (in case Aadhaar not available) 4 MCP Card 5 Page of Pass Book showing name, account number and bank name", where = "page 63, Form 1-A" }]

[[entries.steps]]
text = "Register the pregnancy at the Anganwadi Centre or an approved health facility and have at least one ante-natal check-up."
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "On registration of pregnancy and at least one Ante-natal check-up within 6 months from LMP date at the Anganwadi Centre (AWC)/ approved Health facilities may be identified by the respective administering State /UT", where = "page 29" }]

[[entries.steps]]
text = "An eligible woman can apply at any time but not later than 730 days of pregnancy, counted from the last menstrual period date registered on the MCP card."
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "An eligible beneficiary can apply, at any point of time but not later than 730 days of pregnancy. LMP registered in the MCP card will be the date of pregnancy to be considered in this respect.", where = "page 30" }]

[[entries.steps]]
text = "Payment of an instalment is meant to be made preferably within 30 days of registration and of the claim with complete details of the conditions being met."
evidence = [{ source_id = "mwcd-mission-shakti-guidelines", quote = "to ensure that the payment of the instalment is made in the account of the eligible beneficiary preferably within 30 days of registration and submission of the claim along with complete details of fulfilment of the conditionalities under the scheme.", where = "page 53, Annexure II" }]

