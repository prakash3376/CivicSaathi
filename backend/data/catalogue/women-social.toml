[[entries]]
id = "wb-annapurna-yojana"
name = "Annapurna Yojana"
kind = "scheme"
sectors = ["women-child"]
level = "state"
state = "West Bengal"
department = "Department of Women and Child Development and Social Welfare, Government of West Bengal"
status = "active"
status_note = "A new scheme: the West Bengal portal page calls it a new welfare scheme, and a news report of 20 May 2026 says it comes into effect from 1 June 2026."
source_ids = ["wb-annapurna-page", "air-annapurna-news"]
last_verified = 2026-10-31
effective_on = 2026-06-01
summary = { en = "A fixed monthly payment into the bank account of women of West Bengal in a set age range, who are not government employees or income-tax payers.", bn = "নির্দিষ্ট বয়সের পশ্চিমবঙ্গের নারী, যাঁরা সরকারি কর্মী বা আয়কর দাতা নন, তাঁদের ব্যাংক অ্যাকাউন্টে নিশ্চিত মাসিক অর্থ সহায়তা।", hi = "पश्चिम बंगाल की तय उम्र की महिलाओं, जो सरकारी कर्मचारी या आयकर दाता नहीं हैं, के बैंक खाते में तय मासिक सहायता।" }
target = { en = "Women residents of West Bengal in the set age range who are not in permanent government employment, not income-tax payers and not illegal immigrants.", bn = "পশ্চিমবঙ্গের নির্দিষ্ট বয়সের নারী বাসিন্দা, যাঁরা স্থায়ী সরকারি চাকরিতে নেই, আয়কর দাতা নন এবং অবৈধ অভিবাসী নন।", hi = "पश्चिम बंगाल की तय उम्र की महिला निवासी, जो स्थायी सरकारी नौकरी में नहीं हैं, आयकर दाता नहीं हैं और अवैध प्रवासी नहीं हैं।" }
not_stated = [
  "Whether the amount is the same for every category of woman: the page gives one amount.",
  "A last date to apply, and the exact date the online portal opened for new applicants (the news report says the portal would be launched on 1 June 2026).",
  "A helpline number.",
  "The State's own order: only the portal page and a news report on it were read.",
]

[entries.apply]
label = "West Bengal Social Registry (online application)"
url = "https://socialregistry.wb.gov.in/"
evidence = [{ source_id = "wb-annapurna-page", quote = "Alternatively, applications can be submitted online at https://socialregistry.wb.gov.in/.", where = "scheme page, Application Procedure" }]

[[entries.benefits]]
text = "Each eligible beneficiary is entitled to Rs. 3,000 per month."
evidence = [{ source_id = "wb-annapurna-page", quote = "Each eligible beneficiary is entitled to receive Rs. 3,000 per month.", where = "scheme page, Benefits" }]

[[entries.benefits]]
text = "The money is transferred directly to the Aadhaar-linked bank account of the beneficiary through Direct Benefit Transfer (DBT)."
evidence = [{ source_id = "air-annapurna-news", quote = "financial assistance will be transferred directly to the Aadhaar-linked bank accounts of eligible beneficiaries through Direct Benefit Transfer (DBT).", where = "news report, 20 May 2026" }]

[[entries.eligibility]]
text = "Female residents of West Bengal aged between 25 and 60."
evidence = [{ source_id = "wb-annapurna-page", quote = "This initiative provides assured monthly financial assistance to female residents of West Bengal between the ages of 25 and 60.", where = "scheme page" }]

[[entries.exclusions]]
text = "The beneficiary must not be in permanent government employment, must not be an illegal immigrant and must not be an income-tax payer."
evidence = [{ source_id = "wb-annapurna-page", quote = "To qualify, the intended beneficiary must not be any permanent government employment, not an illegal immigrant and must not be an income tax payer.", where = "scheme page" }]

[[entries.exclusions]]
text = "The news report adds that women who receive a regular salary or pension from the state or central government, statutory bodies, panchayats, municipalities, local bodies or government-aided educational institutions do not qualify."
evidence = [{ source_id = "air-annapurna-news", quote = "must not hold permanent government employment or receive a regular salary or pension from the state or central government, statutory bodies, panchayats, municipalities, local bodies, or government-aided educational institutions.", where = "news report, 20 May 2026" }]

[[entries.exclusions]]
text = "Existing Lakshmir Bhandar beneficiaries identified as deceased, shifted, deleted or listed as absentee electors during the SIR-2026 exercise, or flagged during voter slip distribution, are excluded from the automatic move to this scheme."
evidence = [{ source_id = "air-annapurna-news", quote = "However, individuals identified as deceased, shifted, deleted, or listed as absentee electors during the SIR-2026 exercise, or flagged during voter slip distribution, will be excluded.", where = "news report, 20 May 2026" }]

[[entries.documents]]
text = "The page lists EPIC (Voter ID Card), Aadhaar Card and an active mobile number as mandatory documents."
evidence = [{ source_id = "wb-annapurna-page", quote = "Mandatory Documents EPIC (Voter ID Card) Aadhaar Card Active Mobile Number", where = "scheme page, Mandatory Documents" }]

[[entries.steps]]
text = "The Family Level Data Collection form can be submitted in person at the office of a Block Development Officer or Sub-Divisional Officer, or at a Ward office in the Kolkata Municipal Corporation area, or online."
evidence = [{ source_id = "wb-annapurna-page", quote = "The Annapurna Yojana Family Level Data Collection form can be submitted in person at the offices of Block Development Officers (BDOS), Sub-Divisional Officers (SDOS), or at Ward offices within the Kolkata Municipal Corporation (KMC) area.", where = "scheme page, Application Procedure" }]

[[entries.steps]]
text = "Fresh applications are verified and enquired into by government officials; the District Magistrates and the KMC Commissioner are the final sanctioning authorities."
evidence = [
  { source_id = "air-annapurna-news", quote = "All fresh applications will undergo verification and enquiry by authorised government officials", where = "news report, 20 May 2026" },
  { source_id = "air-annapurna-news", quote = "The respective District Magistrates and the KMC Commissioner will serve as the final sanctioning authorities in their respective jurisdictions", where = "news report, 20 May 2026" },
]

