[[entries]]
id = "nsap"
name = "National Social Assistance Programme (NSAP)"
kind = "scheme"
sectors = ["social-welfare"]
level = "central"
department = "Ministry of Rural Development, Government of India"
status = "active"
status_note = "Described from a 2025 government fact sheet, which says NSAP has five parts: old age, widow and disability pensions, a family benefit, and the Annapurna food scheme."
source_ids = ["pib-nsap-factsheet"]
last_verified = 2026-10-31
summary = { en = "Central pensions and a family benefit for elderly people, widows and people with severe disability from households below the poverty line.", bn = "দারিদ্র্যসীমার নিচের পরিবারের প্রবীণ, বিধবা ও গুরুতর প্রতিবন্ধী ব্যক্তিদের জন্য কেন্দ্রীয় পেনশন ও পারিবারিক সহায়তা।", hi = "गरीबी रेखा से नीचे के परिवारों के बुज़ुर्गों, विधवाओं और गंभीर विकलांगता वाले व्यक्तियों के लिए केंद्र की पेंशन और पारिवारिक सहायता।" }
target = { en = "Elderly people, widows and people with severe or multiple disabilities from households below the poverty line, and households that lose their main earner.", bn = "দারিদ্র্যসীমার নিচের পরিবারের প্রবীণ, বিধবা, গুরুতর বা একাধিক প্রতিবন্ধকতা আছে এমন ব্যক্তি, এবং যে পরিবার প্রধান উপার্জনকারীকে হারিয়েছে।", hi = "गरीबी रेखा से नीचे के परिवारों के बुज़ुर्ग, विधवाएँ, गंभीर या एकाधिक विकलांगता वाले व्यक्ति और वे परिवार जिन्होंने मुख्य कमाने वाले को खो दिया।" }
not_stated = [
  "The application form, the papers to bring and where to submit them: the fact sheet says only that Gram Panchayats and Municipalities help identify beneficiaries. Ask your Gram Panchayat or municipality.",
  "How much your State adds on top of the central amount. The fact sheet says States are encouraged to add a top-up, and gives only the range across the country.",
  "The poverty-line list or other test used to decide who counts as below the poverty line.",
  "A helpline number or last date.",
]

[entries.apply]
label = "NSAP portal"
url = "https://nsap.nic.in/"
evidence = [{ source_id = "pib-nsap-factsheet", quote = "This information is accessible to the public on the official NSAP portal at www.nsap.nic.in", where = "Digitization of Beneficiaries" }]

[[entries.benefits]]
text = "Old age pension (IGNOAPS): Rs.200 a month from the Central Government for people aged 60 to 79, and Rs.500 a month for people aged 80 and above."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "Under this scheme, individuals between 60 and 79 years of age receive Rs.200 per month from the Central Government, while those aged 80 years and above are provided Rs.500 per month.", where = "IGNOAPS" }]

[[entries.benefits]]
text = "Widow pension (IGNWPS): Rs.300 a month of central assistance for widows aged 40 to 79, and Rs.500 a month for widows aged 80 and above."
evidence = [
  { source_id = "pib-nsap-factsheet", quote = "financial assistance is extended to widows aged between 40 and 79years who belong to families living below the poverty line", where = "IGNWPS" },
  { source_id = "pib-nsap-factsheet", quote = "Each eligible beneficiary in this age group receives Rs.300 per month as central assistance. For widows who are 80 years and above, the amount of central assistance is Rs.500 per month", where = "IGNWPS" },
]

[[entries.benefits]]
text = "Disability pension (IGNDPS): central assistance of Rs.300 a month, and Rs.500 a month for people aged 80 and above."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "The beneficiaries are eligible for central assistance of Rs.300 per month. Beneficiaries who are 80 years and above receive Rs.500 per month", where = "IGNDPS" }]

[[entries.benefits]]
text = "National Family Benefit Scheme: a lump sum of Rs.20,000 to the family when the main earner dies."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "The family receives Rs.20,000 as support to help them cope with the immediate financial difficulties arising from the loss.", where = "NFBS" }]

[[entries.benefits]]
text = "Annapurna: 10kg of food grains a month, free of cost, for senior citizens who are eligible for the old age pension but are not receiving it."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "10kg of food grains per month are provided free of cost to those senior citizens who, though eligible under Indira Gandhi National Old Age Pension Scheme (IGNOAPS), are not receiving old age pension.", where = "Annapurna Scheme" }]

[[entries.benefits]]
text = "States and Union Territories are encouraged to add a top-up to the central amount."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "States and Union Territories are encouraged to supplement the Central share by contributing an equivalent or higher top-up amount.", where = "IGNOAPS" }]

[[entries.eligibility]]
text = "Old age pension: elderly citizens aged 60 or above from families living below the poverty line."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "financial assistance to elderly citizens aged 60 years and above who belong to families living below the poverty line", where = "IGNOAPS" }]

[[entries.eligibility]]
text = "Widow pension: widows aged 40 to 79 from families living below the poverty line."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "financial assistance is extended to widows aged between 40 and 79years who belong to families living below the poverty line", where = "IGNWPS" }]

[[entries.eligibility]]
text = "Disability pension: people aged 18 to 79 with severe or multiple disabilities from families living below the poverty line."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "this scheme caters individuals aged between 18 and 79 years who have severe or multiple disabilities and belong to families living below the poverty line", where = "IGNDPS" }]

[[entries.eligibility]]
text = "Family benefit: a household below the poverty line, when the main earner who died was between 18 and 59 years of age."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "a household living below the poverty line becomes eligible for lump sum financial assistance in the unfortunate event of the death of its primary breadwinner, provided the deceased was between 18 and 59 years of age.", where = "NFBS" }]

[[entries.steps]]
text = "Gram Panchayats and Municipalities play an active role in identifying who is eligible."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "Selection: Gram Panchayats and Municipalities play an active role in identifying eligible beneficiaries under the different NSAP schemes.", where = "Features of Schemes under NSAP" }]

[[entries.steps]]
text = "Benefits are paid mainly by Direct Benefit Transfer into the beneficiary's bank or post office savings account, or by postal money order; cash at the doorstep is allowed only in extreme cases where the person cannot go to the bank or post office."
evidence = [{ source_id = "pib-nsap-factsheet", quote = "Benefits are provided through DBT mode (94%) i.e beneficiary’s bank or post office savings accounts, or via postal money orders. Disbursement through Cash at doorstep is also allowed by the scheme guidelines in extreme cases where the beneficiary is unable to go to the bank/post office for receiving the pension.", where = "Features of Schemes under NSAP" }]

