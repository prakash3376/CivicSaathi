[[entries]]
id = "wb-kanyashree-prakalpa"
name = "Kanyashree Prakalpa"
kind = "scheme"
sectors = ["women-child"]
level = "state"
state = "West Bengal"
department = "Women & Child Development and Social Welfare Department, Government of West Bengal"
status = "active"
status_note = "Described from the State's September 2021 manual for Bangla Sahayata Kendras; that document does not say whether the amounts or rules have changed since."
source_ids = ["bsk-manual-2021"]
last_verified = 2026-10-31
summary = { en = "A yearly scholarship and a one-time grant, paid into the bank account of unmarried girls in West Bengal who are still studying.", bn = "পশ্চিমবঙ্গের পড়াশোনা চালিয়ে যাওয়া অবিবাহিত মেয়েদের ব্যাংক অ্যাকাউন্টে বার্ষিক বৃত্তি ও এককালীন অনুদান।", hi = "पश्चिम बंगाल की पढ़ाई कर रही अविवाहित लड़कियों के बैंक खाते में सालाना छात्रवृत्ति और एकमुश्त अनुदान।" }
