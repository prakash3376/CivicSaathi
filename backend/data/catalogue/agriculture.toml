# Agriculture & Farmers: programmes in the catalogue. Every statement carries a quote that
# `python -m app.cli catalogue-check` finds in the indexed document. English wording only (the
# quotes are English); the summary and the "who is it for" line are in three languages and hold no
# figure. The Bengali and Hindi are drafts by a non-native speaker and need a native speaker's review.

[[entries]]
id = "pm-kisan"
name = "Pradhan Mantri Kisan Samman Nidhi (PM-KISAN)"
kind = "scheme"
sectors = ["agriculture"]
level = "central"
department = "Ministry of Agriculture and Farmers Welfare, Government of India"
status = "active"
source_ids = ["pmkisan-guidelines"]
last_verified = 2026-10-31
published_on = 2020-05-21
summary = { en = "Income support, paid straight into the bank account, to farmer families who own cultivable land.", bn = "চাষযোগ্য জমির মালিক কৃষক পরিবারগুলিকে সরাসরি ব্যাংক অ্যাকাউন্টে আয়ের সহায়তা।", hi = "खेती योग्य ज़मीन वाले किसान परिवारों को सीधे बैंक खाते में आय सहायता।" }
target = { en = "Landholding farmer families who have cultivable land.", bn = "চাষযোগ্য জমি আছে এমন কৃষক পরিবার।", hi = "खेती योग्य ज़मीन वाले किसान परिवार।" }
not_stated = [
  "A single application form. The guidelines make the State or UT government responsible for identifying eligible families, so ask your village or block agriculture office how to be listed.",
  "Anything that changed after the guidelines were issued in 2020. Check the PM-KISAN portal for the current rules.",
]

[entries.apply]
label = "PM-KISAN portal"
url = "https://pmkisan.gov.in/"
evidence = [{ source_id = "pmkisan-guidelines", quote = "The PM-Kisan Portal has been created with the following objectives", where = "page 8" }]

[[entries.benefits]]
text = "Rs.6000/- per year is released by the Central Government online directly into the bank accounts of the eligible farmers under Direct Benefit Transfer, subject to certain exclusions."
evidence = [{ source_id = "pmkisan-guidelines", quote = "Under the Scheme an amount of Rs.6000/- per year is released by the Central Government online directly into the bank accounts of the eligible farmers under Direct Benefit Transfer mode, subject to certain exclusions.", where = "page 2" }]

[[entries.benefits]]
text = "The money comes in three installments of Rs.2000/- each, every 4 months: April-July, August-November and December-March."
evidence = [{ source_id = "pmkisan-guidelines", quote = "The financial benefit of Rs.6000/- per year is to be released to the eligible farmers in three installments of Rs.2000/- each every 4-month / trimester, i.e. April-July, August-November and December-March.", where = "page 10" }]

[[entries.eligibility]]
text = "The scheme is for landholding farmers' families who have cultivable land."
evidence = [{ source_id = "pmkisan-guidelines", quote = "With a view to provide income support to all landholding farmers’ families in the country, having cultivable land", where = "page 2" }]

[[entries.exclusions]]
text = "Institutional land holders are not eligible."
evidence = [
  { source_id = "pmkisan-guidelines", quote = "The following categories of beneficiaries of higher economic status shall not be eligible for benefit under the scheme:", where = "page 2" },
  { source_id = "pmkisan-guidelines", quote = "(a) All Institutional Land holders; and", where = "page 2" },
]

[[entries.exclusions]]
text = "Persons who paid Income Tax in the last assessment year are not eligible."
evidence = [{ source_id = "pmkisan-guidelines", quote = "v) All Persons who paid Income Tax in last assessment year.", where = "page 3" }]

[[entries.exclusions]]
text = "Retired pensioners whose monthly pension is Rs.10,000/- or more are not eligible (Multi Tasking Staff, Class IV and Group D employees excepted)."
evidence = [{ source_id = "pmkisan-guidelines", quote = "iv) All superannuated / retired pensioners whose monthly pension is Rs.10,000/- or more (Excluding Multi Tasking Staff / Class IV / Group D employees)", where = "page 3" }]

[[entries.exclusions]]
text = "Doctors, Engineers, Lawyers, Chartered Accountants and Architects who are registered with professional bodies and practise are not eligible."
evidence = [{ source_id = "pmkisan-guidelines", quote = "vi) Professionals like Doctors, Engineers, Lawyers, Chartered Accountants, and Architects registered with Professional bodies and carrying out profession by undertaking practices.", where = "page 3" }]

[[entries.documents]]
text = "Details taken for each farmer: name, age, gender, category (SC/ST), Aadhaar number, bank account number and mobile number."
evidence = [{ source_id = "pmkisan-guidelines", quote = "capturing the Name, Age, Gender, Category (SC/ST), Aadhaar Number, Bank Account Number and the Mobile Number of the beneficiaries", where = "page 6" }]

[[entries.documents]]
text = "A self declaration by the farmer, which the State or UT government can use to certify that none of the exclusions apply."
evidence = [{ source_id = "pmkisan-guidelines", quote = "State / UT Governments can certify the eligibility of the beneficiaries based on self declaration by the beneficiaries.", where = "page 3" }]

[[entries.steps]]
text = "The State or UT government identifies the eligible landholding farmer families."
evidence = [{ source_id = "pmkisan-guidelines", quote = "Responsibility of identifying the land holder farmer family eligible for benefit under the scheme shall be of the State / UT Government.", where = "page 6" }]

[[entries.steps]]
text = "The lists of eligible beneficiaries are published at the village level, and eligible families who were left out must be given a chance to put their case."
evidence = [{ source_id = "pmkisan-guidelines", quote = "The lists of eligible beneficiaries would be published at the village level. Farmers’ families who are eligible but have been excluded should be provided an opportunity to represent their case.", where = "page 7" }]

# --- Pradhan Mantri Fasal Bima Yojana ---------------------------------------------------------

[[entries]]
id = "pmfby"
name = "Pradhan Mantri Fasal Bima Yojana (PMFBY)"
kind = "scheme"
sectors = ["agriculture"]
level = "central"
department = "Department of Agriculture, Cooperation and Farmers Welfare, Ministry of Agriculture & Farmers Welfare, Government of India"
status = "active"
status_note = "The guidelines used are the revised operational guidelines on the scheme portal. Crops, areas, premium and last dates are notified by each State for every season, so check the notice for your State."
source_ids = ["pmfby-guidelines"]
last_verified = 2026-10-31
summary = { en = "Crop insurance that pays farmers when a notified crop is lost or damaged by risks such as drought, flood, pests or storm.", bn = "খরা, বন্যা, পোকামাকড় বা ঝড়ের মতো ঝুঁকিতে বিজ্ঞাপিত ফসল নষ্ট বা ক্ষতিগ্রস্ত হলে কৃষকদের ক্ষতিপূরণ দেওয়ার ফসল বিমা।", hi = "सूखा, बाढ़, कीट या तूफ़ान जैसे जोखिमों से अधिसूचित फसल नष्ट या क्षतिग्रस्त होने पर किसानों को मुआवज़ा देने वाला फसल बीमा।" }
target = { en = "Farmers, including sharecroppers and tenant farmers, who grow a notified crop in a notified area.", bn = "বিজ্ঞাপিত এলাকায় বিজ্ঞাপিত ফসল চাষ করা কৃষক, ভাগচাষি ও ভাড়াটে কৃষক সহ।", hi = "अधिसूचित क्षेत्र में अधिसूचित फसल उगाने वाले किसान, जिनमें बटाईदार और काश्तकार किसान भी शामिल हैं।" }
not_stated = [
  "The last date to enrol in a given season. The guidelines give a standard calendar, but each State notifies its own dates, so ask your bank, a Common Service Centre or the portal.",
  "The exact premium and sum insured for your crop and area. The guidelines give only the highest share a farmer pays; the rest is set by each State notice.",
  "A helpline number for claims. The guidelines speak of a centralised toll free number but do not print it.",
  "The date of the guidelines, which carry no issue date in their text.",
]

[entries.apply]
label = "National Crop Insurance Portal"
url = "https://pmfby.gov.in/"
evidence = [{ source_id = "pmfby-guidelines", quote = "the Govt. of India has designed and developed a National Crop Insurance Portal (NCIP) (www. pmfby.gov.in)", where = "page 6" }]

[[entries.benefits]]
text = "Financial support to farmers who suffer crop loss or damage from unforeseen events."
evidence = [{ source_id = "pmfby-guidelines", quote = "Providing financial support to farmers suffering crop loss/damage arising out of unforeseen events", where = "page 6" }]

[[entries.benefits]]
text = "Standing crops are covered against yield loss from drought, dry spell, flood, inundation, widespread pests and disease, landslides, fire due to natural causes, lightning, storm, hailstorm and cyclone."
evidence = [{ source_id = "pmfby-guidelines", quote = "Standing Crop (Sowing to Harvesting): Comprehensive risk insurance is provided to cover yield losses due to non-preventable risks, viz. Drought, Dry spell, Flood, Inundation, widespread Pests and Disease attack, Landslides, Fire due to natural causes ,Lightening, Storm, Hailstorm and Cyclone.", where = "page 9" }]

[[entries.benefits]]
text = "The most a farmer pays is 2.0% of the sum insured for Kharif food grain and oilseed crops, 1.5% for Rabi food grain and oilseed crops, and 5% for annual commercial and horticultural crops, or the actuarial rate if that is lower."
evidence = [{ source_id = "pmfby-guidelines", quote = "Kharif All food grain and Oilseeds crops (all Cereals, Millets, Pulses and Oilseeds crops) 2.0% of SI or Actuarial rate, whichever is less Rabi All food grain and Oilseeds crops (all Cereals, Millets, Pulses and oilseeds) 1.5% of SI or Actuarial rate, whichever is less Kharif and Rabi Annual Commercial/ Annual Horticultural crops 5% of SI or Actuarial rate, whichever is less", where = "page 18" }]

[[entries.benefits]]
text = "Beyond the farmer's share, the rest of the premium is a subsidy shared equally by the Centre and the State."
evidence = [{ source_id = "pmfby-guidelines", quote = "The difference between Actuarial Premium Rate and the rate of Insurance premium payable by farmers shall be treated as Rate of Normal Premium Subsidy, which shall be shared equally by the Centre and State Govts.", where = "page 18" }]

[[entries.eligibility]]
text = "All farmers, including sharecroppers and tenant farmers, who grow the notified crops in the notified areas are eligible."
evidence = [{ source_id = "pmfby-guidelines", quote = "All farmers including sharecroppers and tenant farmers growing the notified crops in the notified areas are eligible for coverage.", where = "page 8" }]

[[entries.eligibility]]
text = "Farmers who have been sanctioned a seasonal crop loan from a financial institution for the notified crop are covered compulsorily."
evidence = [{ source_id = "pmfby-guidelines", quote = "All farmers who have been sanctioned Seasonal Agricultural Operations (SAO) loans from Financial Institutions (FIs) (i.e. loanee farmers) for the notified crop(s) season would be covered compulsorily.", where = "page 8" }]

[[entries.eligibility]]
text = "For farmers without a crop loan the scheme is optional."
evidence = [{ source_id = "pmfby-guidelines", quote = "The Scheme is optional for non-loanee farmers.", where = "page 8" }]

[[entries.exclusions]]
text = "Losses from war, nuclear risks, malicious damage and other preventable risks are not covered."
evidence = [{ source_id = "pmfby-guidelines", quote = "General Exclusions: Losses arising out of war and nuclear risks, malicious damage and other preventable risks shall be excluded.", where = "page 10" }]

[[entries.documents]]
text = "Farmers without a crop loan must show land records such as the Record of Rights or a land possession certificate."
evidence = [{ source_id = "pmfby-guidelines", quote = "The non-loanee farmers are required to submit necessary documentary evidence of land records prevailing in the State (Records of Right (RoR), Land possession Certificate (LPC) etc.)", where = "page 8" }]

[[entries.documents]]
text = "Farmers who enrol through a bank or agent rather than online bring a filled application form with a copy of the Aadhaar card, bank passbook and land ownership proof (or a contract document for tenants and sharecroppers), plus a sowing certificate or a self declaration of intent to sow."
evidence = [{ source_id = "pmfby-guidelines", quote = "shall submit the duly filled proposal/application form along with copy of Aadhaar Card, Bank Passbook, Land Ownership proof /contract document or any other document defined by the concerned State Govt. to identify share-cropper/tenant farmer, sowing certificate or self declaration of intent to sow the proposed crop.", where = "page 79" }]

[[entries.steps]]
text = "Fill in the application form and give it to the nearest bank branch, Common Service Centre or authorised channel partner or insurance intermediary."
evidence = [{ source_id = "pmfby-guidelines", quote = "Farmers desirous of availing insurance shall fill up Application Form of the Scheme and submit the same to nearest bank branch/CSCs or authorized channel partner or insurance intermediaries of insurance company.", where = "page 28" }]

[[entries.steps]]
text = "For loss from a local calamity or damage after harvest, the farmer must report the loss; for widespread calamities reporting is not essential."
evidence = [{ source_id = "pmfby-guidelines", quote = "Yield loss damage for localised calamities and post harvest losses will be assessed on the basis of individual insured farm level and hence lodging of loss information by farmer/designated agencies is essential.", where = "page 10" }]

[[entries.steps]]
text = "Report such a loss within 72 hours, to the insurance company, the bank, the local agriculture department or district officials, or on the toll free number."
evidence = [{ source_id = "pmfby-guidelines", quote = "Intimation may be given within 72 hours by farmer either directly to the insurance company, concerned bank, local agriculture department Govt./district officials or through toll free number", where = "page 51" }]

# --- Kisan Credit Card ------------------------------------------------------------------------

[[entries]]
id = "kisan-credit-card"
name = "Kisan Credit Card (KCC)"
kind = "scheme"
sectors = ["agriculture"]
level = "central"
department = "Department of Agriculture and Farmers Welfare, Government of India, with banks and cooperative banks"
status = "active"
status_note = "Based on an official explainer. The banks themselves set the final terms, so ask the bank branch."
source_ids = ["kcc-pib-explainer"]
last_verified = 2026-10-31
published_on = 2026-03-11
summary = { en = "A credit card for farmers that gives short-term loans for cultivation and other farm needs, with lower interest when repaid on time.", bn = "কৃষকদের জন্য ক্রেডিট কার্ড, যা চাষ ও অন্যান্য কৃষি প্রয়োজনে স্বল্পমেয়াদি ঋণ দেয়, সময়মতো শোধ করলে সুদ কম।", hi = "किसानों के लिए क्रेडिट कार्ड, जो खेती और अन्य कृषि ज़रूरतों के लिए अल्पकालिक ऋण देता है; समय पर चुकाने पर ब्याज कम लगता है।" }
target = { en = "Farmers who own and till land, tenant farmers, oral lessees and sharecroppers, and self help groups and joint liability groups of farmers.", bn = "জমির মালিক-চাষি, ভাড়াটে কৃষক, মৌখিক ইজারাদার ও ভাগচাষি এবং কৃষকদের স্বনির্ভর গোষ্ঠী ও যৌথ দায় গোষ্ঠী।", hi = "खुद ज़मीन जोतने वाले किसान, काश्तकार, मौखिक पट्टेदार और बटाईदार, तथा किसानों के स्वयं सहायता समूह और संयुक्त देयता समूह।" }
not_stated = [
  "The interest rate, processing fee and documents of a particular bank. The explainer describes the scheme, not each bank's terms.",
  "A last date. The card is not described as having an application deadline.",
  "The credit limits for farmers other than marginal farmers; the table did not survive extraction from the explainer.",
]

[entries.apply]
label = "Kisan Rin Portal"
url = "https://fasalrin.gov.in/"
evidence = [{ source_id = "kcc-pib-explainer", quote = "For farmers, the portal simplifies access to low -cost institutional credit", where = "page 3" }]

[[entries.benefits]]
text = "Loans up to Rs. 2 Lakh without collateral."
evidence = [{ source_id = "kcc-pib-explainer", quote = "Collateral -Free Loans: Enabling farmers to avail loans up to Rs. 2 Lakh without collateral", where = "page 7" }]

[[entries.benefits]]
text = "Short-term farm loans up to Rs 3 lakh are available at 7% interest, with a further 3% subvention for repaying on time, so the effective rate is 4%."
evidence = [{ source_id = "kcc-pib-explainer", quote = "Short -term agri -loans up to Rs 3 lakh are available at 7% interest, with an additional 3% subvention for timely repayment, reducing the effective rate to 4%.", where = "page 4" }]

[[entries.benefits]]
text = "The crop loan limit under the Modified Interest Subvention Scheme has been raised from Rs 3 lakh to Rs 5 lakh."
evidence = [{ source_id = "kcc-pib-explainer", quote = "the crop loan limit under MISS, which has been raised from Rs 3 lakh to Rs 5 lakh", where = "page 3" }]

[[entries.benefits]]
text = "A revolving credit facility, valid for up to 5 years, from which a farmer can withdraw funds as needed."
evidence = [{ source_id = "kcc-pib-explainer", quote = "The KCC continues to provide revolving credit facilities with a validity of up to 5 years, allowing farmers to withdraw funds as needed for their production.", where = "page 7" }]

[[entries.benefits]]
text = "After a natural calamity, interest is not charged for up to 1 year, extendable to 5 years in severe disasters."
evidence = [{ source_id = "kcc-pib-explainer", quote = "interest is not charged for up to 1 year , extendable to 5 years in cases of severe disasters", where = "page 7" }]

[[entries.benefits]]
text = "Marginal farmers can get a flexible limit of Rs 10,000 to Rs 50,000, based on landholding size and cropping patterns."
evidence = [{ source_id = "kcc-pib-explainer", quote = "A flexible limit of Rs 10,000 to Rs 50,000 may be sanctioned based on factors such as landholding size and cropping patterns.", where = "page 5" }]

[[entries.eligibility]]
text = "Individual farmers and joint borrowers who own and till land, and tenant farmers, oral lessees and sharecroppers."
evidence = [
  { source_id = "kcc-pib-explainer", quote = "individual farmers and joint borrowers who are owner -cultivators,", where = "page 2" },
  { source_id = "kcc-pib-explainer", quote = "tenant farmers, oral lessees, and sharecroppers.", where = "page 2" },
]

[[entries.eligibility]]
text = "Self Help Groups and Joint Liability Groups, including groups of tenant farmers and sharecroppers, are also covered."
evidence = [{ source_id = "kcc-pib-explainer", quote = "the scheme also includes Self Help Groups (SHGs) and Joint Liability Groups (JLGs), including groups formed by tenant farmers and sharecroppers", where = "page 3" }]

[[entries.documents]]
text = "Copies of land records and information on the crops grown, with a simple one-page application form."
evidence = [{ source_id = "kcc-pib-explainer", quote = "farmers are required to submit copies of land records and information on the crops cultivated.", where = "page 3" }]

[[entries.steps]]
text = "Get the one-page form from a bank, or download it from the websites of the banks, agricoop.gov.in or pmkisan.gov.in."
evidence = [{ source_id = "kcc-pib-explainer", quote = "made available for download on the websites of all Scheduled Commercial Banks (SCBs), the Department of Agriculture and Farmers Welfare (agricoop.gov.in), and the PM -KISAN portal (pmkisan.gov.in).", where = "page 3" }]

[[entries.steps]]
text = "Common Service Centres can help complete the application and send it to the bank branch."
evidence = [{ source_id = "kcc-pib-explainer", quote = "Common Service Centres (CSCs) have been authorized to assist in completing and digitally transmitting applications to the concerned bank branches", where = "page 3" }]

# --- Krishak Bandhu (West Bengal) -------------------------------------------------------------

[[entries]]
id = "krishak-bandhu"
name = "Krishak Bandhu (Natun)"
kind = "scheme"
sectors = ["agriculture"]
level = "state"
state = "West Bengal"
department = "Department of Agriculture, Government of West Bengal"
status = "active"
status_note = "The scheme portal is still online and lists its orders, but its page is now titled Mukhyamantri Krishak Samman Nidhi while the documents are all named Krishak Bandhu, so the programme may have been renamed. The newest statement of the amount is an FAQ on the portal and an older order gives a smaller amount, so confirm the current amount with the block agriculture office."
source_ids = ["wb-krishak-bandhu-faq", "wb-krishak-bandhu-sop-2021", "wb-krishak-bandhu-portal"]
last_verified = 2026-10-31
summary = { en = "West Bengal's income support for farmers, paid straight into the bank account in two instalments, one for the Kharif and one for the Rabi season.", bn = "পশ্চিমবঙ্গের কৃষকদের জন্য আয় সহায়তা, খারিফ ও রবি মরশুমে দুটি কিস্তিতে সরাসরি ব্যাংক অ্যাকাউন্টে।", hi = "पश्चिम बंगाल के किसानों के लिए आय सहायता, खरीफ और रबी सीज़न में दो किस्तों में सीधे बैंक खाते में।" }
target = { en = "Farmers of West Bengal who have cultivable land and the land papers to show it.", bn = "পশ্চিমবঙ্গের চাষযোগ্য জমি ও তার কাগজপত্র আছে এমন কৃষক।", hi = "पश्चिम बंगाल के वे किसान जिनके पास खेती योग्य ज़मीन और उसके कागज़ात हैं।" }
not_stated = [
  "Who is excluded, for example people in government service. The documents found do not list exclusions for the newer scheme.",
  "Whether the one-time death benefit described in an older order still applies.",
  "A deadline. Enrolment is described as done at camps, but no closing date is given.",
  "The rules after any renaming of the programme. The procedure document is older than the FAQ and describes the earlier scheme.",
]

[entries.apply]
label = "Krishak Bandhu portal"
url = "https://krishakbandhu.wb.gov.in/"
evidence = [{ source_id = "wb-krishak-bandhu-faq", quote = "Information of payment is provided through SMS on registered mobile No., if provided, and added to KB portal.", where = "page 5" }]

[[entries.benefits]]
text = "Rs. 10000/- per year for one acre or more of cultivable land, paid in two equal instalments for the Kharif and Rabi seasons."
evidence = [{ source_id = "wb-krishak-bandhu-faq", quote = "Under the new scheme, every enrolled farmer will get a financial assistance of Rs. 10000/- per annum for one acre or more of cultivable land, payable in two equal installments for Kharif & Rabi seasons.", where = "page 5" }]

[[entries.benefits]]
text = "Farmers with less than one acre are paid pro rata, with a minimum of Rs. 4000/- per year."
evidence = [{ source_id = "wb-krishak-bandhu-faq", quote = "Farmers having less than one acre of land will be eligible for assistance on pro rata basis subject to a minimum of Rs. 4000/- per annum per farmer.", where = "page 5" }]

[[entries.benefits]]
text = "The money is paid by direct benefit transfer into the beneficiary's bank account."
evidence = [{ source_id = "wb-krishak-bandhu-faq", quote = "Payment of eligible assistance will be done through DBT in the Bank A/c of the beneficiary.", where = "page 5" }]

[[entries.eligibility]]
text = "Under the revised procedure, all farmers who have documents showing cultivable land can apply."
evidence = [{ source_id = "wb-krishak-bandhu-sop-2021", quote = "All farmers having available documents of cultivable land will be eligible to apply.", where = "page 3" }]

[[entries.documents]]
text = "Voter ID, Aadhaar card, record of rights or a self declaration with land documents and a legal heir certificate, the first and last page of the bank passbook or a cancelled cheque (original and one photocopy), and an Aadhaar-linked mobile number."
evidence = [{ source_id = "wb-krishak-bandhu-faq", quote = "Voter ID, Aadhaar Card, RoR / Self Declaration with Land Documents & WarisonCertificate, Bank pass book 1 st page and last page/ Cancelled Cheque (Original & 1 photocopy)and Bank account and Aadhaar linked mobile number.", where = "page 5" }]

[[entries.documents]]
text = "The bank account must be a normal account (not a Jan Dhan account), Aadhaar seeded and working, in a scheduled commercial, state cooperative, district cooperative or gramin bank."
evidence = [{ source_id = "wb-krishak-bandhu-faq", quote = "Bank account should be with any scheduledCommercial Bank / State Cooperative Bank / District Cooperative Bank / Gramin Bank only. The account should be a normal one (not Jaan Dhan account), Aadhaar seeded and operative.", where = "page 5" }]

[[entries.steps]]
text = "Apply to the Assistant Director of Agriculture of the block where your voter ID (EPIC) is registered, except in the Kolkata Municipal Corporation area."
evidence = [{ source_id = "wb-krishak-bandhu-sop-2021", quote = "The farmer has to apply for enrolment to the Asst. Director of Agriculture of the Block where his EPIC exists (except Kolkata Municipal Corporation Area).", where = "page 1" }]

[[entries.steps]]
text = "Fill in the application form in Bengali (Nepali or English in the Hills), add a self declaration if needed, and submit it at the Krishak Bandhu desk at the camp."
evidence = [{ source_id = "wb-krishak-bandhu-faq", quote = "The farmer will have to fill up the Application Form in Bengali (Nepali/English for Hills)and Self Declaration (if needed) and submit at KB desk to the designated officials at the camp.", where = "page 5" }]

[[entries.steps]]
text = "You are given the counterpart of your form with an acknowledgement ID as your receipt."
evidence = [{ source_id = "wb-krishak-bandhu-faq", quote = "Yes, the designated staff will give the counter part of your application form after entering the Acknowledgement ID generated from KB Portal for future reference.", where = "page 5" }]

[[entries.steps]]
text = "When approved, your name appears in the Approved List on the portal and an SMS gives your Krishak Bandhu ID."
evidence = [{ source_id = "wb-krishak-bandhu-sop-2021", quote = "Upon generation of Krishak Bandhu ID, the farmer’s name will appear in the ‘Approved List’ in the Krishak Bandhu portal and he/she will receive an SMS indicating the KBID No.", where = "page 4" }]

[[entries.steps]]
text = "If a payment fails or the account is invalid, contact the block Assistant Director of Agriculture."
evidence = [{ source_id = "wb-krishak-bandhu-faq", quote = "In case of failure transaction of payment or in case of invalid accounts farmers may contact with the block ADA for assistance.", where = "page 5" }]

[[entries.steps]]
text = "The portal lists a direct helpline, 033-23570021, open 10am - 5pm."
evidence = [{ source_id = "wb-krishak-bandhu-portal", quote = "Direct Helpline No. 033-23570021 Time: 10am - 5pm", where = "home page" }]

[[entries.steps]]
text = "The Assistant Director of Agriculture of the block is the grievance officer at block level."
evidence = [{ source_id = "wb-krishak-bandhu-sop-2021", quote = "The Asstt. D.A. of the Block will act as the Grievance Redressal Officer at the Block level.", where = "page 5" }]

# --- Agriculture Infrastructure Fund ----------------------------------------------------------

[[entries]]
id = "agriculture-infrastructure-fund"
name = "Agriculture Infrastructure Fund (AIF)"
kind = "scheme"
sectors = ["agriculture"]
level = "central"
department = "Department of Agriculture and Farmers Welfare, Ministry of Agriculture and Farmers Welfare, Government of India"
status = "active"
status_note = "Based on the revised guidelines of July 2021 and the scheme portal, which is still online. Later changes to the guidelines may exist."
source_ids = ["aif-guidelines", "aif-portal-page"]
last_verified = 2026-10-31
summary = { en = "Loans from banks at a lower interest cost for building storage, processing and other farm-gate facilities that cut losses after harvest.", bn = "ফসল তোলার পর ক্ষতি কমানোর গুদাম, প্রক্রিয়াকরণ ও অন্যান্য খামার-প্রান্তের সুবিধা তৈরির জন্য কম সুদের খরচে ব্যাংক ঋণ।", hi = "फसल कटाई के बाद का नुकसान घटाने वाले भंडारण, प्रसंस्करण और अन्य खेत-स्तर की सुविधाएँ बनाने के लिए कम ब्याज लागत पर बैंक ऋण।" }
target = { en = "Farmers, farmer producer organisations, cooperatives, self help groups, agri-entrepreneurs, start-ups and mandis that want to build such facilities.", bn = "এমন সুবিধা গড়তে ইচ্ছুক কৃষক, কৃষক উৎপাদক সংগঠন, সমবায়, স্বনির্ভর গোষ্ঠী, কৃষি-উদ্যোক্তা, স্টার্ট-আপ ও মান্ডি।", hi = "ऐसी सुविधाएँ बनाने के इच्छुक किसान, किसान उत्पादक संगठन, सहकारी समितियाँ, स्वयं सहायता समूह, कृषि-उद्यमी, स्टार्ट-अप और मंडियाँ।" }
not_stated = [
  "A list of documents. The guidelines speak of minimum documentation but do not list it; each lending bank decides.",
  "The interest rate charged. It is agreed with each lender and circulated separately.",
  "A deadline for applying, other than the period for which the scheme runs.",
]

[entries.apply]
label = "Agriculture Infrastructure Fund portal"
url = "https://agriinfra.dac.gov.in/"
evidence = [{ source_id = "aif-portal-page", quote = "Online single window facility in collaboration with participating lending institutions.", where = "home page" }]

[[entries.benefits]]
text = "Interest subvention of 3% per year on loans up to ₹ 2 crore, for up to 7 years."
evidence = [{ source_id = "aif-guidelines", quote = "All loans under this financing facility will have interest subvention of 3% per annum up to a limit of ₹ 2 crore. This subvention will be available for a maximum period of 7 years.", where = "page 7" }]

[[entries.benefits]]
text = "Credit guarantee cover for eligible borrowers on a loan up to ₹ 2 crore, with the fee paid by the Government."
evidence = [{ source_id = "aif-guidelines", quote = "Credit guarantee coverage will be available for eligible borrowers from this financing facility under Credit Guarantee Fund Trust for Micro and Small Enterprises (CGTMSE) scheme for a loan up to ₹ 2 crore. The fee for this coverage will be paid by the Government.", where = "page 7" }]

[[entries.benefits]]
text = "The scheme is set to run until 2032-33."
evidence = [{ source_id = "aif-guidelines", quote = "The Scheme will be operational from 2020-21 to 2032-33. Loan disbursement under the scheme will complete in six years.", where = "page 6" }]

[[entries.eligibility]]
text = "Loans go to cooperatives, farmer producer organisations, self help groups, farmers, joint liability groups, agri-entrepreneurs, start-ups and public-private projects."
evidence = [{ source_id = "aif-guidelines", quote = "to be provided by banks and financial institutions as loans to Primary Agricultural Credit Societies (PACS), Marketing Cooperative Societies, Farmer Producers Organizations(FPOs), Self Help Group (SHG), Farmers, Joint Liability Groups (JLG), Multipurpose Cooperative Societies, Agri-entrepreneurs, Startups and Central/State agency or", where = "page 8" }]

[[entries.eligibility]]
text = "Projects such as warehouses, silos, pack houses and cold chains qualify."
evidence = [
  { source_id = "aif-guidelines", quote = "(A) Post Harvest Management Projects like: (i) Supply chain services including e-marketing platforms (ii) Warehouses (iii)Silos (iv)Pack houses (v) Assaying units (vi)Sorting &grading units (vii) Cold chains", where = "page 8" },
]

[[entries.eligibility]]
text = "Lending institutions decide who is an eligible borrower, keeping in mind how viable the project is."
evidence = [{ source_id = "aif-guidelines", quote = "Lending institutions will decide criteria for selection of eligible borrower in consultation with NABARD and monitoring committees, PMUs and keeping in mind the viability of the projects and to avoid NPA.", where = "page 12" }]

[[entries.exclusions]]
text = "A private entity such as a farmer, agri-entrepreneur or start-up is limited to 25 projects."
evidence = [{ source_id = "aif-guidelines", quote = "However, for a private sector entity, such as farmer, agri entrepreneur, start-up there will be a limit of maximum of 25 such projects.", where = "page 9" }]

[[entries.documents]]
text = "Loan money is paid into an Aadhaar-linked bank account."
evidence = [{ source_id = "aif-guidelines", quote = "Disbursal of funds by lending entities to beneficiaries under this scheme shall be in Aadhaar linked bank account.", where = "page 11" }]

[[entries.steps]]
text = "Apply through the online platform, which lets qualified entities apply for a loan under the fund."
evidence = [
  { source_id = "aif-guidelines", quote = "An online platform will be made available in collaboration with participating lending institutions to provide information and loan sanctioning facility.", where = "page 10" },
  { source_id = "aif-guidelines", quote = "It will enable all the qualified entities to apply for loan under the fund.", where = "page 10" },
]

[[entries.steps]]
text = "A Project Management Unit gives hand-holding support, including preparing the project report."
evidence = [{ source_id = "aif-portal-page", quote = "Project Management Unit to provide handholding support for projects including project preparation.", where = "home page" }]

[[entries.steps]]
text = "The promoter must put in at least 10% of the project cost."
evidence = [{ source_id = "aif-guidelines", quote = "However, a minimum of 10% of the project cost shall be mandatory as promoter’s contribution.", where = "page 11" }]

