[entries.apply]
label = "PMSMA portal"
url = "https://pmsma.mohfw.gov.in/"
evidence = [{ source_id = "pmsma-about", quote = "The Pradhan Mantri Surakshit Matritva Abhiyan has been launched by the Ministry of Health & Family Welfare (MoHFW), Government of India.", where = "What is the program?" }]

[[entries.benefits]]
text = "Assured, comprehensive and quality antenatal care, free of cost, for all pregnant women on the 9th of every month."
evidence = [{ source_id = "pmsma-about", quote = "The program aims to provide assured, comprehensive and quality antenatal care, free of cost, universally to all pregnant women on the 9th of every month.", where = "What is the program?" }]

[[entries.benefits]]
text = "A minimum package of check-ups including one ultrasound in the 2nd trimester, and medicines such as IFA and calcium supplements, at the PMSMA clinics."
evidence = [{ source_id = "pmsma-about", quote = "a minimum package of investigations (including one ultrasound during the 2nd trimester of pregnancy) and medicines such as IFA supplements, calcium supplements etc would be provided to all pregnant women attending the PMSMA clinics.", where = "Key Features of PMSMA" }]

[[entries.benefits]]
text = "Pregnant women are given Mother and Child Protection Cards and safe motherhood booklets."
evidence = [{ source_id = "pmsma-about", quote = "Pregnant women would be given Mother and Child Protection Cards and safe motherhood booklets.", where = "Key Features of PMSMA" }]

[[entries.eligibility]]
text = "The care is for women in their 2nd or 3rd trimester of pregnancy, at designated government health facilities."
evidence = [{ source_id = "pmsma-about", quote = "PMSMA guarantees a minimum package of antenatal care services to women in their 2nd / 3rd trimesters of pregnancy at designated government health facilities", where = "What is the program?" }]

[[entries.eligibility]]
text = "Special efforts are made to reach women who have not registered for antenatal care, women who dropped out, and women with high-risk pregnancies."
evidence = [{ source_id = "pmsma-about", quote = "special efforts would be made to reach out to women who have not registered for ANC (left out/missed ANC) and also those who have registered but not availed ANC services (dropout) as well as High Risk pregnant women.", where = "Key Features of PMSMA" }]

[[entries.steps]]
text = "Go to an identified public health facility (PHC, CHC, district hospital or urban health facility) on the 9th day of the month, in addition to routine antenatal check-ups."
evidence = [{ source_id = "pmsma-about", quote = "A minimum package of antenatal care services (including investigations and drugs) would be provided to the beneficiaries on the 9th day of every month at identified public health facilities (PHCs/ CHCs, DHs/ urban health facilities etc) in both urban and rural areas in addition to the routine ANC at the health facility/ outreach.", where = "Key Features of PMSMA" }]

[[entries.steps]]
text = "If the 9th is a Sunday or a holiday, the clinic is held on the next working day."
evidence = [{ source_id = "pmsma-guidelines", quote = "If the 9th day of the month is a Sunday/ a holiday, then the Clinic should be organized on the next working day.", where = "page 16" }]
