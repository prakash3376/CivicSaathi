target = { en = "Pregnant women from families below the poverty line, or from Scheduled Caste or Scheduled Tribe families, who deliver in a health centre.", bn = "দারিদ্র্যসীমার নিচের পরিবারের, বা তপশিলি জাতি বা তপশিলি উপজাতি পরিবারের যে গর্ভবতী মহিলারা স্বাস্থ্যকেন্দ্রে প্রসব করেন।", hi = "ग़रीबी रेखा से नीचे के, या अनुसूचित जाति या अनुसूचित जनजाति के परिवारों की वे गर्भवती महिलाएँ जो स्वास्थ्य केंद्र में प्रसव कराती हैं।" }
