[[entries]]
id = "post-matric-scholarship-obc-ebc-dnt"
name = "Centrally Sponsored Scheme of Post-Matric Scholarship for OBC, EBC and DNT students"
kind = "scheme"
sectors = ["education"]
level = "central"
department = "Department of Social Justice and Empowerment, Government of India (run by each State or UT government)"
status = "active"
source_ids = ["pms-obc-guidelines", "oasis-user-manual"]
last_verified = 2026-10-31
summary = { en = "Financial help for students of Other Backward Classes, Economically Backward Classes and Denotified Tribes who study after Class X, with a freeship card so fees need not be paid in advance.", bn = "দশম শ্রেণির পরে পড়াশোনা করা অন্যান্য অনগ্রসর শ্রেণি, অর্থনৈতিকভাবে অনগ্রসর শ্রেণি ও বিমুক্ত যাযাবর উপজাতির শিক্ষার্থীদের আর্থিক সহায়তা; ফ্রিশিপ কার্ড থাকলে আগাম ফি দিতে হয় না।", hi = "दसवीं के बाद पढ़ने वाले अन्य पिछड़ा वर्ग, आर्थिक रूप से पिछड़ा वर्ग और विमुक्त जनजाति के विद्यार्थियों के लिए आर्थिक सहायता; फ्रीशिप कार्ड से फ़ीस पहले नहीं देनी पड़ती।" }
target = { en = "Indian students of OBC, EBC and DNT families with limited income who study a recognised course after Class X.", bn = "সীমিত আয়ের ওবিসি, ইবিসি ও ডিএনটি পরিবারের যে ভারতীয় শিক্ষার্থীরা দশম শ্রেণির পরে স্বীকৃত পাঠক্রমে পড়ছেন।", hi = "सीमित आय वाले ओबीसी, ईबीसी और डीएनटी परिवारों के भारतीय विद्यार्थी जो दसवीं के बाद किसी मान्यता प्राप्त पाठ्यक्रम में पढ़ रहे हैं।" }
not_stated = [
