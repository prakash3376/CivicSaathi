[[entries]]
id = "pm-usp-csss"
name = "Pradhan Mantri Uchchatar Shiksha Protsahan (PM-USP): Central Sector Scheme of Scholarship for College and University Students"
kind = "scheme"
sectors = ["education"]
level = "central"
department = "Department of Higher Education, Ministry of Education, Government of India"
status = "active"
source_ids = ["pmusp-csss-guidelines", "pmusp-csss-faq"]
last_verified = 2026-10-31
summary = { en = "A yearly scholarship for meritorious students from poor families who join a regular college or university course after Class XII.", bn = "দ্বাদশ শ্রেণির পর নিয়মিত কলেজ বা বিশ্ববিদ্যালয়ের পাঠক্রমে ভর্তি হওয়া দরিদ্র পরিবারের মেধাবী শিক্ষার্থীদের জন্য বার্ষিক বৃত্তি।", hi = "बारहवीं के बाद नियमित कॉलेज या विश्वविद्यालय के पाठ्यक्रम में दाखिला लेने वाले ग़रीब परिवारों के मेधावी विद्यार्थियों के लिए वार्षिक छात्रवृत्ति।" }
target = { en = "Students from low-income families who did very well in the Class XII board examination and study a regular degree course.", bn = "কম আয়ের পরিবারের যে শিক্ষার্থীরা দ্বাদশ শ্রেণির বোর্ড পরীক্ষায় খুব ভালো ফল করেছেন এবং নিয়মিত ডিগ্রি পাঠক্রমে পড়ছেন।", hi = "कम आय वाले परिवारों के वे विद्यार्थी जिन्होंने बारहवीं बोर्ड परीक्षा में बहुत अच्छा प्रदर्शन किया और नियमित डिग्री पाठ्यक्रम में पढ़ रहे हैं।" }
not_stated = [
  "This year's opening and closing dates. The guidelines say the National Scholarship Portal gives the timelines.",
  "A fixed list of documents. The guidelines say verification of caste and qualifications is done through DigiLocker, and an income certificate is needed only for fresh applicants.",
  "Whether the rates changed after the 2022-23 guidelines. The 2025-26 FAQ repeats the same rates.",
]

[entries.apply]
label = "National Scholarship Portal"
url = "https://scholarships.gov.in/"
evidence = [{ source_id = "pmusp-csss-guidelines", quote = "Beneficiaries/ Applicants under the scheme must apply online in the National Scholarships Portal (www.scholarships.gov.in) for the fresh/ renewal scholarships.", where = "page 2, para 4(ix)" }]

[[entries.benefits]]
text = "The scholarship is Rs.12,000/- per year at graduation level for the first three years, and Rs.20,000/- per year at post-graduation level."
evidence = [{ source_id = "pmusp-csss-guidelines", quote = "The rate of scholarship is Rs.12,000/-per annum at Graduation level for first three years of College and University courses and Rs.20,000/-per annum at Post-Graduation level.", where = "page 3, para 7" }]

[[entries.benefits]]
text = "The money is paid straight into the student's savings bank account by Direct Benefit Transfer."
evidence = [{ source_id = "pmusp-csss-guidelines", quote = "The scholarship will be disbursed directly into the savings bank accounts of the beneficiaries through Direct Benefit Transfer (DBT)", where = "page 3, para 8" }]

[[entries.eligibility]]
text = "The student must be above the 80th percentile of successful candidates in the relevant stream in the Class XII board examination."
evidence = [{ source_id = "pmusp-csss-guidelines", quote = "Students who are above 80th percentile of successful candidates in the relevant stream from the respective Board of Examination in Class XII of 10+2 pattern or equivalent;", where = "page 1, para 4(i)" }]

[[entries.eligibility]]
text = "The student must follow a regular degree course, not distance mode or a diploma, at a recognised college or institution."
evidence = [
  { source_id = "pmusp-csss-guidelines", quote = "Pursuing regular degree courses and not correspondence or distance mode or pursuing Diploma courses;", where = "page 2, para 4(ii)" },
  { source_id = "pmusp-csss-guidelines", quote = "Pursuing courses at colleges/institutions recognized by All India Council for Technical Education and respective Regulatory Bodies concerned;", where = "page 2, para 4(iii)" },
]

[[entries.eligibility]]
text = "Gross parental or family income must be up to Rs. 4.5 lakh per year. An income certificate is needed only from fresh applicants."
evidence = [{ source_id = "pmusp-csss-guidelines", quote = "Students with gross parental/family income upto Rs. 4.5 lakh per annum are eligible for scholarship under the scheme. Income certificate will be required only for the fresh applicants;", where = "page 2, para 4(v)" }]

[[entries.eligibility]]
text = "Half of the scholarships are earmarked for girls."
evidence = [{ source_id = "pmusp-csss-guidelines", quote = "50% of the scholarships are earmarked for girls.", where = "page 1, para 3" }]

[[entries.exclusions]]
text = "A student who already gets another scholarship, including a State scholarship or a fee waiver or reimbursement scheme, is not eligible."
evidence = [{ source_id = "pmusp-csss-guidelines", quote = "Not availing benefit of any other scholarship schemes including State run scholarship schemes/ fee waiver & reimbursement scheme;", where = "page 2, para 4(iv)" }]

[[entries.exclusions]]
text = "Diploma students are not eligible."
evidence = [{ source_id = "pmusp-csss-faq", quote = "Diploma students are not eligible under the scheme.", where = "page 1, question 1" }]

[[entries.steps]]
text = "Apply online only, on the National Scholarship Portal. Applications sent directly to the Ministry are not accepted."
evidence = [{ source_id = "pmusp-csss-guidelines", quote = "Fresh/Renewal applications sent directly to the Ministry of Education shall not be accepted.", where = "page 2, para 4(ix)" }]

[[entries.steps]]
text = "The institute where the student studies verifies the online application first, and then the State Higher Education Department or the agency the State names."
evidence = [{ source_id = "pmusp-csss-guidelines", quote = "Online applications will be verified at two levels i.e by the Institute, where the student is studying and thereafter by the concerned State Higher Education Department or any other Agency/ Official nominated by the State as State Nodal Agency", where = "page 3, para 6(v)" }]

[[entries.steps]]
text = "To renew each year, the student must get at least 50% marks in the annual examination and keep attendance of at least 75%, and must apply for renewal on the portal."
evidence = [{ source_id = "pmusp-csss-guidelines", quote = "viii. For renewal of scholarship in each year of study, besides getting at least 50% marks in the Annual Examination, maintenance of adequate attendance of at least 75%, will also be the criteria.", where = "page 2, para 4(viii)" }]

