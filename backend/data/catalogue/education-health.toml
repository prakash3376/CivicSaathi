# Education and Health: programmes in the catalogue. Every statement carries a quote that
# `python -m app.cli catalogue-check` finds in the indexed document. English wording only (the
# quotes are English); the summary and the "who is it for" line are in three languages and hold no
# figure. The Bengali and Hindi are drafts by a non-native speaker and need a native speaker's review.
#
# The two scholarship schemes that have a questionnaire (aicte-pragati, svmcm) are in data/schemes.

# =================================================================================================
# EDUCATION
# =================================================================================================

[[entries]]
id = "wb-student-credit-card"
name = "West Bengal Student Credit Card Scheme"
kind = "scheme"
sectors = ["education"]
level = "state"
state = "West Bengal"
department = "Higher Education Department, Government of West Bengal"
status = "active"
source_ids = ["wbscc-gazette-2021", "wbscc-faq", "wbscc-about"]
last_verified = 2026-10-31
published_on = 2021-06-30
effective_on = 2021-06-30
summary = { en = "A low-interest education loan, taken on a credit card from a bank, for students who have lived in West Bengal for years.", bn = "যাঁরা বহু বছর ধরে পশ্চিমবঙ্গে বসবাস করছেন, সেই শিক্ষার্থীদের জন্য ব্যাংক থেকে ক্রেডিট কার্ডের মাধ্যমে কম সুদে শিক্ষা ঋণ।", hi = "जो विद्यार्थी कई वर्षों से पश्चिम बंगाल में रह रहे हैं, उनके लिए बैंक से क्रेडिट कार्ड के ज़रिए कम ब्याज पर शिक्षा ऋण।" }
target = { en = "Students from West Bengal who study from class X onwards, in India or abroad, including those preparing for competitive exams at a coaching institute.", bn = "পশ্চিমবঙ্গের যে শিক্ষার্থীরা দশম শ্রেণি থেকে ভারতে বা বিদেশে পড়াশোনা করছেন, প্রতিযোগিতামূলক পরীক্ষার কোচিং প্রতিষ্ঠানের শিক্ষার্থীরাও এর মধ্যে আছেন।", hi = "पश्चिम बंगाल के वे विद्यार्थी जो दसवीं कक्षा से आगे भारत या विदेश में पढ़ रहे हैं, प्रतियोगी परीक्षा की कोचिंग लेने वाले भी इसमें शामिल हैं।" }
not_stated = [
  "A closing date. The scheme documents do not give one; a student can apply at any time during the course.",
  "Later changes. The portal lists amendments after the June 2021 notification; this entry follows the original scheme text, the portal FAQ and the portal's About page.",
  "The exact bank that will lend, and the bank's own paperwork. The documents say the bank's forms and RBI rules apply.",
]

[entries.apply]
label = "WBSCC portal (Student Credit Card)"
url = "https://wbscc.wb.gov.in/"
evidence = [{ source_id = "wbscc-faq", quote = "click on tab STUDENT CREDIT CARD or visit wbscc.wb.gov.in", where = "page 1" }]

[[entries.benefits]]
text = "A student can get a loan of up to Rs. 10.00 lakhs at 4% simple interest from the State Co-operative Banks, their affiliated banks, and public and private sector banks in West Bengal."
evidence = [{ source_id = "wbscc-gazette-2021", quote = "obtain maximum loan of Rs. 10.00 lakhs at the rate of 4% simple interest from State Co-operative Banks and its affiliated Central Cooperative Banks and District Central Cooperative Banks and Public Sector/ Private Sector Banks operating in the State of West Bengal.", where = "page 3, para 3" }]

[[entries.benefits]]
text = "A 1% interest concession is given to a borrower who pays the interest in full during the study period."
evidence = [{ source_id = "wbscc-about", quote = "1% interest concession will be provided to borrower if the interest is fully serviced during the study period.", where = "About the Scheme" }]

[[entries.benefits]]
text = "The repayment period is fifteen (15) years, including the moratorium (repayment holiday)."
evidence = [{ source_id = "wbscc-about", quote = "The repayment period shall be fifteen (15) years for any loan availed under this Credit Card including the Moratorium/ repayment holiday.", where = "About the Scheme" }]

[[entries.benefits]]
text = "The loan can be used for course fees, hostel or rent, books and computers, and other costs of completing the course such as study tours and project work."
evidence = [
  { source_id = "wbscc-faq", quote = "Course fees payable to the School/College/ University / Professional Institutes/coaching institute where the student is enrolled for appearing in entrance examination", where = "page 2, question 10" },
  { source_id = "wbscc-gazette-2021", quote = "(b) Fees required for accommodation in School/ Madrasah/ College/ University/ Institution hostel or rent/ license fees payable for living outside the hostel or fees required for living as a Paying Guest.", where = "page 3, para 4" },
  { source_id = "wbscc-gazette-2021", quote = "(d) Cost of purchasing of books/ Computer/ Lap-top/ Tablet/ equipments etc.", where = "page 3, para 4" },
  { source_id = "wbscc-gazette-2021", quote = "(e) Any other expense required to complete the course such as study tours, project works, thesis, etc.", where = "page 3, para 4" },
]

[[entries.benefits]]
text = "Up to 20% of the loan can be used for living expenses during the course, and up to 30% for non-institutional expenses in all."
evidence = [
  { source_id = "wbscc-gazette-2021", quote = "(f) The student can incur expenditure up to 30% of the total loan sanctioned for non-institutional expenses for the whole course of study.", where = "page 3, para 4" },
  { source_id = "wbscc-gazette-2021", quote = "(g) Up to 20% of the total loan sanctioned can be used as living expenses for the duration of the course.", where = "page 3, para 4" },
]

[[entries.eligibility]]
text = "The student must be an Indian national and have lived in West Bengal for the last 10 years. A self-declaration in the application form is accepted."
evidence = [{ source_id = "wbscc-gazette-2021", quote = "The student seeking loan under the scheme should be an Indian national and resident of West Bengal for the last 10 years. Self-declaration by the student as appended in the application form will be accepted.", where = "page 3, para 5(a)" }]

[[entries.eligibility]]
text = "The student must not be more than 40 years old when applying."
evidence = [{ source_id = "wbscc-gazette-2021", quote = "The interested students should not be aged more than 40 (forty) years at the time of applying for loan.", where = "page 3, para 5(d)" }]

[[entries.eligibility]]
text = "The student must have passed Class IX from a recognised board active in West Bengal and be enrolled in Class X or a higher course (or a coaching institute for a competitive exam)."
evidence = [{ source_id = "wbscc-faq", quote = "Minimum eligibility to apply for the loan under the scheme is Class IX passed from any of the recognized Boards which are active in West Bengal.", where = "page 3, question 15" }]

[[entries.eligibility]]
text = "There is no marks percentage condition for applying."
evidence = [{ source_id = "wbscc-faq", quote = "No, there are no marks percentage criteria for applying in the scheme.", where = "page 4, question 22" }]

[[entries.eligibility]]
text = "The loan application is made by the student together with a parent or legal guardian as co-borrower."
evidence = [{ source_id = "wbscc-gazette-2021", quote = "The loan application should be submitted by the student and the parent/ legal guardian as co-borrower.", where = "page 4, para 6(e)" }]

[[entries.documents]]
text = "Upload with the online form: photographs and signatures of the student and the co-borrower, the student's Aadhaar card, proof of age, the co-borrower's address proof, the admission receipt, and PAN cards (or an undertaking if there is no PAN card)."
evidence = [
  { source_id = "wbscc-faq", quote = "Coloured Photograph of the co-applicant / co-borrower", where = "page 1, question 4" },
  { source_id = "wbscc-faq", quote = "5. Student’s AADHAR Card (should be in. Pdf format, between 400 KB and 50 KB)", where = "page 1, question 4" },
  { source_id = "wbscc-faq", quote = "Address Proof of Co-applicant/Co-borrower", where = "page 1, question 4" },
  { source_id = "wbscc-faq", quote = "Signature of the student (shouldbein.jpeg/.jpg format, between 50KB and 10 KB)", where = "page 1, question 4" },
  { source_id = "wbscc-faq", quote = "Age Proof of the Applicant (should be in.pdf format between 400 KB and 50 KB)", where = "page 1, question 4" },
  { source_id = "wbscc-faq", quote = "Admission Receipt (should be in .pdf between400 KB and 50 KB)", where = "page 1, question 4" },
  { source_id = "wbscc-faq", quote = "Student’s PAN Card/undertaking if there is no PAN Card", where = "page 1, question 4" },
]

[[entries.documents]]
text = "No domicile certificate or caste certificate is needed."
evidence = [{ source_id = "wbscc-faq", quote = "No. There is no need to furnish the copy of domicile certificate and Caste certificate.", where = "page 2, question 5" }]

[[entries.steps]]
text = "Register and fill in the online form on the scheme portal, through your school, college or institute."
evidence = [{ source_id = "wbscc-gazette-2021", quote = "Aspiring Student will apply online as per the format given at Annexure-I, through a web-based portal to be maintained by the Higher Education Department through the respective School/ Madrasah/ College/ Univer-sity/ Institute in which he has got enrolled.", where = "page 3, para 5(c)" }]

[[entries.steps]]
text = "The Higher Education Department examines the application and sends it to the bank, which sanctions it and issues the credit card."
evidence = [
  { source_id = "wbscc-gazette-2021", quote = "The Higher Education Department will forward the applications after due examination to the Bank for sanc-tion and issuance of Credit Card.", where = "page 4, para 5(f)" },
  { source_id = "wbscc-gazette-2021", quote = "The concerned Bank will sanction the applications after due examination and issue the credit card in physical form", where = "page 4, para 5(g)" },
]

[[entries.steps]]
text = "No hard copy of the form has to be sent after registration."
evidence = [{ source_id = "wbscc-faq", quote = "Do I need to send any hard copy of the completed form once the registration and filling up of form is over?", where = "page 2, question 7" }]

