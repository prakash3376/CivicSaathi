[entries.apply]
label = "National Health Mission: Janani Suraksha Yojana"
url = "https://nhm.gov.in/index1.php?lang=1&level=3&lid=309&sublinkid=841"
evidence = [{ source_id = "jsy-nhm-page", quote = "is a safe motherhood intervention under the National Health Mission", where = "page text" }]

[[entries.benefits]]
text = "The page names ten States as low performing (Uttar Pradesh, Uttarakhand, Bihar, Jharkhand, Madhya Pradesh, Chhattisgarh, Assam, Rajasthan, Orissa, and Jammu and Kashmir); every other State, West Bengal included, is a high performing State. In a high performing State the mother's package is Rs. 700 in a rural area and Rs. 600 in an urban area, and the ASHA's package is Rs. 600 in a rural area and Rs. 400 in an urban area."
evidence = [
  { source_id = "jsy-nhm-page", quote = "While these states have been named Low Performing States (LPS), the remaining states have been named High Performing states (HPS).", where = "page text" },
  { source_id = "jsy-nhm-page", quote = "Category: HPS; Rural area: 700; : 600; Total: 1300; Urban area: 600; : 400; Total: 1000", where = "cash assistance table" },
]

[[entries.benefits]]
text = "JSY joins cash assistance with delivery care and care after delivery."
evidence = [{ source_id = "jsy-nhm-page", quote = "JSY is a centrally sponsored scheme, which integrates cash assistance with delivery and post-delivery care.", where = "page text" }]

[[entries.eligibility]]
text = "In a high performing State, BPL, Scheduled Caste and Scheduled Tribe women who deliver in a government health centre (sub centre, PHC, CHC, FRU or the general ward of a district or state hospital) are eligible."
evidence = [{ source_id = "jsy-nhm-page", quote = "All BPL/Scheduled Caste/Scheduled Tribe (SC/ST) women delivering in a government health centre, such as SC/PHC/CHC/FRU/general wards of district or state hospital", where = "eligibility for cash assistance" }]

[[entries.eligibility]]
text = "BPL, SC and ST women who deliver in an accredited private institution are also eligible."
evidence = [{ source_id = "jsy-nhm-page", quote = "BPL/SC/ST women in accredited private institutions", where = "eligibility for cash assistance" }]

[[entries.documents]]
text = "A woman who delivers in an accredited private institution must show a proper BPL or SC/ST certificate to get the benefit."
evidence = [{ source_id = "jsy-nhm-guidelines", quote = "will have to produce a proper BPL or a SC/ST certificate in order to access JSY benefits", where = "page 3, para 4.4" }]

[[entries.documents]]
text = "Where BPL cards have not been issued or updated, the State sets a simple way to certify that the family is poor and needy, through the gram pradhan or ward member."
evidence = [{ source_id = "jsy-nhm-guidelines", quote = "However, where BPL cards have not yet been issued or have not been updated, States/UTs would formulate a simple criterion for certification of poor and needy status of the expectant mother’s family by empowering the gram pradhan or ward member.", where = "page 3, para 4.3" }]

[[entries.documents]]
text = "Each registered woman should have a JSY card along with a MCH card."
evidence = [{ source_id = "jsy-nhm-guidelines", quote = "Each beneficiary registered under this Yojana should have a JSY card along with a MCH card.", where = "page 3, para 4.2" }]

[[entries.steps]]
text = "The ASHA (or other link health worker) identifies the pregnant woman as a beneficiary and helps her register for antenatal check-ups."
evidence = [{ source_id = "jsy-nhm-guidelines", quote = "Identify pregnant woman as a beneficiary of the scheme and report or facilitate registration for ANC", where = "page 2, para 3.1" }]

[[entries.steps]]
text = "The cash assistance to the mother is paid at the institution itself."
evidence = [{ source_id = "jsy-nhm-guidelines", quote = "As the cash assistance to the mother is mainly to meet the cost of delivery, it should be disbursed effectively at the institution itself.", where = "page 4, para 4.7" }]

