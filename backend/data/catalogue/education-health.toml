[[entries]]
id = "post-matric-scholarship-sc"
name = "Post Matric Scholarship for Scheduled Caste students (PMS-SC)"
kind = "scheme"
sectors = ["education"]
level = "central"
department = "Ministry of Social Justice and Empowerment, Government of India (applications in West Bengal through the OASIS portal)"
status = "active"
source_ids = ["oasis-pms-sc-leaflet", "oasis-user-manual"]
last_verified = 2026-10-31
summary = { en = "Help with fees and a yearly allowance for Scheduled Caste students who study after Class X.", bn = "দশম শ্রেণির পরে পড়াশোনা করা তপশিলি জাতির শিক্ষার্থীদের জন্য ফি-তে সহায়তা ও বার্ষিক ভাতা।", hi = "दसवीं के बाद पढ़ाई करने वाले अनुसूचित जाति के विद्यार्थियों के लिए फ़ीस में मदद और वार्षिक भत्ता।" }
target = { en = "Scheduled Caste students from families with limited income who study a recognised course from Class XI onwards.", bn = "সীমিত আয়ের পরিবারের তপশিলি জাতির যে শিক্ষার্থীরা একাদশ শ্রেণি থেকে স্বীকৃত পাঠক্রমে পড়ছেন।", hi = "सीमित आय वाले परिवारों के अनुसूचित जाति के वे विद्यार्थी जो ग्यारहवीं कक्षा से आगे किसी मान्यता प्राप्त पाठ्यक्रम में पढ़ रहे हैं।" }
not_stated = [
  "The closing date for applications.",
  "The full scheme guidelines. The ministry's guidelines page could not be read by the tools (it is built by a script), so this entry rests on the one-page summary published on the West Bengal OASIS portal and the OASIS student manual. That summary is undated.",
  "The conditions for renewal, such as marks and attendance.",
]

[entries.apply]
label = "OASIS scholarship portal (West Bengal)"
url = "https://oasis.wb.gov.in/"
evidence = [{ source_id = "oasis-user-manual", quote = "OASIS (Online Application for Scholarship in Studies) is a dedicated initiative by the Backward Classes Welfare Department and the Tribal Development Department, Government of West Bengal.", where = "page 2" }]

[[entries.benefits]]
text = "The scholarship pays the compulsory non-refundable fees (including tuition fee) and an academic allowance of Rs. 2500 to Rs. 13500 per year."
evidence = [{ source_id = "oasis-pms-sc-leaflet", quote = "Compulsory non-refundable fees (including tuition fee) Academic allowance ranging from Rs. 2500 to Rs. 13500 per annum", where = "leaflet" }]

[[entries.benefits]]
text = "Students with a disability get an extra allowance of 10%."
evidence = [{ source_id = "oasis-pms-sc-leaflet", quote = "10% extra allowance for Divyang (specially abled) students", where = "leaflet" }]

[[entries.eligibility]]
text = "The student must belong to the Scheduled Caste category, and the parents' or guardian's yearly income must not be more than Rs. 2.50 lakh."
evidence = [{ source_id = "oasis-pms-sc-leaflet", quote = "Parents/Guardians annual income not exceeding Rs. 2.50 Lakh Students belonging to SC category", where = "leaflet" }]

[[entries.eligibility]]
text = "The student must study a recognised course from Class XI onwards in a recognised institution, university, college or school."
evidence = [{ source_id = "oasis-pms-sc-leaflet", quote = "Students pursuing courses in recognised Institutions/Universities/Colleges/Schools All recognised courses from class XI onwards", where = "leaflet" }]

[[entries.eligibility]]
text = "On the West Bengal OASIS portal the applicant must be a permanent resident (domicile) of West Bengal, and the scholarship is for studies within India only."
evidence = [{ source_id = "oasis-user-manual", quote = "The applicant must be a permanent resident (domicile) of West Bengal. The scholarship is valid for studies within India only.", where = "page 2" }]

[[entries.documents]]
text = "A valid mobile number, an Aadhaar number, an Aadhaar-seeded bank account, an income certificate and a caste certificate."
evidence = [{ source_id = "oasis-pms-sc-leaflet", quote = "Student should have a valid Mobile Number, Aadhaar Number (UID), Aadhaar seeded Bank Account, Income Certificate and Caste Certificate", where = "leaflet" }]

[[entries.steps]]
text = "Apply on the OASIS portal. One candidate can make only one application, and applying for another scholarship at the same time disqualifies the candidate from the OASIS scholarship."
evidence = [{ source_id = "oasis-user-manual", quote = "The application restriction is 1 Candidate = 1 Application. Applying for any other scholarship concurrently will disqualify the candidate from receiving the OASIS scholarship.", where = "page 2" }]

[[entries.steps]]
text = "The name, birth year and gender on the portal must match the Aadhaar card exactly, and the student must have an active individual bank account."
evidence = [
  { source_id = "oasis-user-manual", quote = "Candidates must possess an active, individual bank account.", where = "page 2" },
  { source_id = "oasis-user-manual", quote = "The student's name, spelling, birth year, and gender on the OASIS portal must match their Aadhaar card exactly.", where = "page 2" },
]

