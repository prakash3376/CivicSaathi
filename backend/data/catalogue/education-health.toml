[entries.apply]
label = "OASIS scholarship portal (West Bengal)"
url = "https://oasis.wb.gov.in/"
evidence = [{ source_id = "oasis-user-manual", quote = "Eligible Categories: Students belonging to Scheduled Caste (SC), Scheduled Tribe (ST), and Other Backward Classes (OBC).", where = "page 2" }]

[[entries.benefits]]
text = "Financial assistance to OBC, EBC and DNT students at the post-matriculation or post-secondary stage, to help them complete their education."
evidence = [{ source_id = "pms-obc-guidelines", quote = "The objective of the scheme is to provide financial assistance to the OBC, EBC and DNT students studying at post-matriculation or post-secondary stage to enable them to complete their education.", where = "page 1, para 1" }]

[[entries.benefits]]
text = "The yearly amount depends on the group of course: Rs. 20000 for professional degree and postgraduate courses (Group 1), Rs. 13000 for other professional courses (Group 2), Rs. 8000 for other graduate and postgraduate courses (Group 3), and Rs. 5000 for other post-matriculation non-degree courses (Group 4)."
evidence = [{ source_id = "pms-obc-guidelines", quote = "Group 1: Degree and Post Graduate level professional courses 10000 10000 20000 Group 2: Other Professional Courses leading to Degree, Diploma, Certificate 8000 5000 13000 Group 3: Graduate and Post Graduate courses not covered under Group I & Group II 6000 2000 8000 Group 4: All post-matriculation (Post Class X level) non-degree courses 5000 0 5000", where = "page 7, para 7.1" }]

[[entries.benefits]]
text = "A Freeship Card lets an eligible student take admission without paying the tuition fee or hostel fee in advance."
evidence = [{ source_id = "pms-obc-guidelines", quote = "The institutions should be willing to honour the FREESHIP CARD issued by the State/District Authority through the scholarship portal and admit the student without insisting on pre-payment of the college/tuition fee or hostel fee.", where = "page 2, para 4.1" }]

[[entries.benefits]]
text = "The whole scholarship amount is paid straight into the student's account by Direct Benefit Transfer."
evidence = [{ source_id = "pms-obc-guidelines", quote = "The entire scholarship amount - both from the State and Central Government -including the tuition fees, academic allowance and any other admissible allowance will be paid directly into the account of the students ONLY through DBT", where = "page 9, para 12.2" }]

[[entries.eligibility]]
text = "The scholarship is open to Indian nationals who belong to OBCs, EBCs and DNTs as notified by the Centre or the State."
evidence = [{ source_id = "pms-obc-guidelines", quote = "The scholarships will be open to Indian nationals belonging to OBCs, EBCs and DNTs, as notified by the Central Govt./State Govt./ UT Admin.", where = "page 3, para 5" }]

[[entries.eligibility]]
text = "Annual income up to Rs 2.50 lakh makes a student eligible."
evidence = [{ source_id = "pms-obc-guidelines", quote = "All the OBC/EBC/DNT students with annual income of up to Rs 2.50 lakh per annum would be eligible under the scheme.", where = "page 5, para 6.1" }]

[[entries.eligibility]]
text = "The student must have passed the Matriculation, higher secondary or a higher examination, and belong to the State or UT where he or she is permanently settled."
evidence = [{ source_id = "pms-obc-guidelines", quote = "who have passed the Matriculation or Higher secondary or any higher examination of a recognized University or Board of Secondary Education will be eligible.", where = "page 3, para 5(iii)" }]

[[entries.exclusions]]
text = "A scholarship holder under this scheme cannot hold any other scholarship or stipend."
evidence = [{ source_id = "pms-obc-guidelines", quote = "A scholarship holder under this Scheme will not hold any other scholarship/ stipend.", where = "page 4, para 5" }]

[[entries.exclusions]]
text = "Students who study the same stage of education again in a different subject (for example B.Sc. after B.A.) are not eligible."
evidence = [{ source_id = "pms-obc-guidelines", quote = "Candidates who, after passing one stage of education, are studying in the same stage of education in different subject e.g. B.Sc. after B.A or B.Com.after B.A. or M.A. in a subject after M.A in another subject will not be eligible.", where = "page 3, para 5(iv)" }]

[[entries.exclusions]]
text = "Only two boys of the same parents or guardian can receive the scholarship; this limit does not apply to girls."
evidence = [{ source_id = "pms-obc-guidelines", quote = "Only two boys of the same parents/guardian will be entitled to receive scholarships. This restriction will, however, not apply to girls.", where = "page 4, para 5(x)" }]

[[entries.documents]]
text = "Scanned and uploaded documents include a passport size photograph, certificates of examinations passed, a caste certificate signed by the authorised officer, and a valid income certificate."
evidence = [{ source_id = "pms-obc-guidelines", quote = "passport size photograph , copy of each of the certificates for diploma, degree etc. in respect of all examinations passed, Caste certificate duly signed by the authorized officer, valid Income certificate issued by the competent", where = "page 7, para 8.3" }]

[[entries.steps]]
text = "Register on the State scholarship portal for a Freeship Card well before admission, giving the Aadhaar number and the course you want to join."
evidence = [{ source_id = "pms-obc-guidelines", quote = "The student shall, well before the expected date of admission, register for issuance of a Freeship Card on the respective scholarship portal giving the details like the Aadhaar number, the name of the course in which he/she wants to take admission", where = "page 7, para 8.2" }]

[[entries.steps]]
text = "The State completes verification within 30 days of the registration and issues the Freeship Card on the portal."
evidence = [{ source_id = "pms-obc-guidelines", quote = "all States/UTs will complete the verification process within 30 days from the receipt of the registration request from the students and issue the Freeship Card through the IT portal", where = "page 8, para 8.4" }]

[[entries.steps]]
text = "On the day of admission the student applies for the scholarship on the portal, and the institution confirms the admission."
evidence = [
  { source_id = "pms-obc-guidelines", quote = "apply on the IT portal for the scholarship, along with documents needs to be uploaded as notified by the prescribed authority, on the same day as the date of admission into the institution.", where = "page 8, para 9.1" },
  { source_id = "pms-obc-guidelines", quote = "the institution shall verify on the scholarship portal that the student has taken admission in the institution with the same course as mentioned on the Freeship card", where = "page 8, para 9.2" },
]

