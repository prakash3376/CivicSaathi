last_verified = 2026-10-31
summary = { en = "A national mission to produce green hydrogen and green ammonia in India from renewable power, to cut fossil fuel imports and carbon emissions. It supports industry and research, not individuals.", bn = "নবায়নযোগ্য বিদ্যুৎ থেকে ভারতে সবুজ হাইড্রোজেন ও সবুজ অ্যামোনিয়া উৎপাদনের জাতীয় মিশন, জীবাশ্ম জ্বালানি আমদানি ও কার্বন নির্গমন কমাতে। এটি শিল্প ও গবেষণাকে সহায়তা করে, ব্যক্তিকে নয়।", hi = "नवीकरणीय बिजली से भारत में हरित हाइड्रोजन और हरित अमोनिया बनाने का राष्ट्रीय मिशन, ताकि जीवाश्म ईंधन का आयात और कार्बन उत्सर्जन घटे। यह उद्योग और शोध को सहायता देता है, व्यक्तियों को नहीं।" }
target = { en = "Industry, fertiliser and energy producers, and researchers. It is not a payment or a service for an individual household.", bn = "শিল্প, সার ও জ্বালানি উৎপাদক এবং গবেষক। এটি কোনো পরিবারের জন্য টাকা বা সেবা নয়।", hi = "उद्योग, उर्वरक और ऊर्जा उत्पादक, तथा शोधकर्ता। यह किसी परिवार के लिए भुगतान या सेवा नहीं है।" }
