# Housing & Basic Amenities, Transport & Infrastructure, Environment & Energy: programmes in the
# catalogue. Every statement carries a quote that `python -m app.cli catalogue-check` finds in the
# downloaded document. English wording only (the quotes are English); the summary and the "who is
# it for" line are in three languages and hold no figure. The Bengali and Hindi are drafts by a
# non-native speaker and need a native speaker's review.

# =================================================================================================
# HOUSING
# =================================================================================================

[[entries]]
id = "pmay-urban-2"
name = "Pradhan Mantri Awas Yojana - Urban 2.0 (PMAY-U 2.0)"
kind = "scheme"
sectors = ["housing"]
level = "central"
department = "Ministry of Housing and Urban Affairs, Government of India"
status = "active"
status_note = "The guidelines say the Mission is implemented for five years from the date given below. Check the portal for any later change."
source_ids = ["pmay-u2-guidelines"]
last_verified = 2026-10-31
effective_on = 2024-09-01
summary = { en = "Help for urban families to build, buy or rent an affordable pucca house, through four routes: building your own house, affordable housing projects, rental housing and a home-loan interest subsidy.", bn = "শহরের পরিবারগুলিকে সাশ্রয়ী পাকা বাড়ি তৈরি, কেনা বা ভাড়া নিতে সহায়তা, চারটি পথে: নিজের বাড়ি তৈরি, সাশ্রয়ী আবাসন প্রকল্প, ভাড়ার আবাসন এবং গৃহঋণের সুদে ভর্তুকি।", hi = "शहरी परिवारों को किफ़ायती पक्का मकान बनाने, खरीदने या किराये पर लेने में सहायता, चार रास्तों से: अपना मकान बनाना, किफ़ायती आवास परियोजनाएँ, किराये का आवास और गृह ऋण के ब्याज पर सब्सिडी।" }
target = { en = "Urban families in the lower, low and middle income groups who do not own a pucca house anywhere in India.", bn = "শহরের নিম্ন, স্বল্প ও মধ্যম আয়ের পরিবার, যাদের ভারতের কোথাও পাকা বাড়ি নেই।", hi = "शहरी निम्न, अल्प और मध्यम आय वर्ग के परिवार, जिनके पास भारत में कहीं भी पक्का मकान नहीं है।" }
not_stated = [
  "How much central assistance a family gets for each house. The guidelines have a funding table by State or Union Territory (page 43 of the guidelines); read it for your State.",
  "A last date to apply. The guidelines give the period of the Mission, not a deadline for families.",
  "An application fee or a helpline for families (the guidelines give contact details for the Ministry only).",
  "Anything issued after the guidelines of September 2024.",
]

[entries.apply]
label = "PMAY-Urban portal"
url = "https://pmay-urban.gov.in/"
evidence = [{ source_id = "pmay-u2-guidelines", quote = "For availing the benefit under ISS vertical, eligible beneficiaries will be required to register their demand through Unified web-portal.", where = "para 5.4.8, page 38" }]

[[entries.benefits]]
text = "The Mission runs for five years from 1 September 2024 and gives central assistance, through States, Union Territories and lending institutions, to construct, purchase or rent a house at an affordable cost."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "Housing for All’ Mission for urban areas will be implemented for 5 years from 01.09.2024 to provide Central Assistance to all eligible beneficiaries/households/ implementing agencies through States/Union Territories (UTs)/Primary Lending Institutions (PLIs) to construct, purchase or rent a house at an affordable cost.", where = "para 1.1, page 15" }]

[[entries.benefits]]
text = "There are four routes: Beneficiary Led Construction (BLC), Affordable Housing in Partnership (AHP), Affordable Rental Housing (ARH) and the Interest Subsidy Scheme (ISS)."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "i. Beneficiary Led Construction (BLC) ii. Affordable Housing in Partnership (AHP) iii. Affordable Rental Housing (ARH) iv. Interest Subsidy Scheme (ISS)", where = "para 1.2, page 15" }]

[[entries.benefits]]
text = "Building your own house (BLC): families in the economically weaker section (EWS) get financial assistance to build a new pucca house on their own land."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "The BLC vertical of the Scheme shall provide financial assistance to individual eligible families belonging to EWS categories to construct new pucca houses (an all-weather dwelling unit) on their own available land.", where = "para 5.1.1, page 20" }]

[[entries.benefits]]
text = "For a house built under BLC, central assistance is paid in three instalments in the ratio 40:40:20 as the construction progresses, by direct transfer to the beneficiary's bank account."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "Central Assistance shall be released in three instalments of 40:40:20 ratio, considering physical progress of construction of house, through Direct Benefit Transfer (DBT) mode to the bank account of beneficiary identified in projects through States/UTs.", where = "para 5.1.12, page 21" }]

[[entries.benefits]]
text = "Affordable housing projects (AHP): public or private agencies build affordable houses of 30-45 sqm carpet area and make them available for allotment to eligible EWS families."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "This vertical is a supply side intervention where affordable houses of 30-45 sqm carpet area will be constructed by Public/Private Agencies and made available for allotment to the eligible beneficiaries of EWS category.", where = "para 5.2.2, page 24" }]

[[entries.benefits]]
text = "Home-loan interest subsidy (ISS): households with income up to ₹9 lakh, a loan up to ₹25 lakh and a property value up to ₹35 lakh get a subsidy of 4.0% on the first ₹8 lakh of the loan, for a tenure up to 12 years, with a maximum release of ₹1.80 lakh."
evidence = [
  { source_id = "pmay-u2-guidelines", quote = "A maximum release of interest subsidy of ₹1.80 lakh having maximum NPV of ₹1.50 lakh (at Discount Rate of 8.5%) shall be provided to eligible beneficiaries having a loan tenure of more than five years.", where = "para 5.4.3, page 37" },
  { source_id = "pmay-u2-guidelines", quote = "Households having income up to ₹9 lakh, loan value up to ₹25 lakh for property value up to ₹35 lakh would be eligible for a subsidy at 4.0 % on first ₹8 lakh for a tenure up to 12 years.", where = "para 5.4.3, page 37" },
]

[[entries.eligibility]]
text = "Families in the EWS, LIG or MIG category, living in urban areas, with no pucca house anywhere in the country, are eligible to purchase or construct a house."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "Families belonging to EWS/LIG/MIG category, living in urban areas, having no pucca house anywhere in the country, are eligible to purchase or construct a house under PMAY-U 2.0.", where = "para 3.1, page 17" }]

[[entries.eligibility]]
text = "The income groups: EWS households have an annual income up to ₹3.0 lakh, LIG from ₹3.0 lakh up to ₹6.0 lakh, and MIG from ₹6 lakh up to ₹9 lakh."
evidence = [
  { source_id = "pmay-u2-guidelines", quote = "Economically Weaker Section (EWS) Households having an annual income up to ₹3.0 lakh.", where = "definitions, page 10" },
  { source_id = "pmay-u2-guidelines", quote = "Low Income Group (LIG) Households having an annual income from ₹3.0 lakh up to ₹ 6.0 lakh.", where = "definitions, page 10" },
  { source_id = "pmay-u2-guidelines", quote = "Middle Income Group (MIG) Households having an annual income from ₹6 lakh up to ₹9 lakh.", where = "definitions, page 10" },
]

[[entries.eligibility]]
text = "A beneficiary family means husband, wife, unmarried sons and/or unmarried daughters."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "A beneficiary family will comprise of husband, wife, unmarried sons and/or unmarried daughters.", where = "definitions, page 9" }]

[[entries.exclusions]]
text = "A family that was allotted a house under any housing scheme of the Central Government, a State or UT Government or a local body in the last 20 years, in urban or rural areas, is not eligible."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "The beneficiary who has been allotted house under any of the housing scheme of Central Government, State/UT Government and Local Self Government in last 20 years in urban or rural areas, shall not be eligible to seek benefit under PMAY-U 2.0.", where = "para 3.2, page 17" }]

[[entries.exclusions]]
text = "The interest subsidy is given only once for a property; if it is sold, the buyer cannot take the subsidy on it."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "The subsidy under the scheme will be provided only once for a property. If it is sold to someone else, the purchaser can’t take benefit of ISS on this property.", where = "para 5.4.5, page 37" }]

[[entries.exclusions]]
text = "There is a lock-in of five years: the beneficiary may not sell or transfer the house during that period."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "Under the scheme, there shall be a mandatory lock-in period of five years from the date of completion of house under BLC, possession of house under AHP and disbursal of first instalment of home loan under ISS verticals and the beneficiary shall not be allowed to sell/ transfer the house during the lock-in period.", where = "para 4.10, page 19" }]

[[entries.documents]]
text = "A signed undertaking, in the format given in the guidelines, that the family meets the income condition and owns no pucca house anywhere in India."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "An undertaking from the beneficiary will be taken as a declaration of the fulfilment of eligibility criteria of income and not owning a pucca house anywhere in India on his/her name or any other family members in a specified format as per Annexure-2 (A, B & C) of the Scheme Guidelines.", where = "para 1.10, page 16" }]

[[entries.documents]]
text = "An Aadhaar number or Aadhaar Virtual ID for every eligible beneficiary, including family members."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "All eligible beneficiaries (including family members) should have an Aadhaar/ Aadhaar Virtual ID integrated with the details of beneficiaries.", where = "para 3.8, page 17" }]

[[entries.documents]]
text = "For BLC, proof of ownership of the land. For a home loan under ISS, a self-certificate or affidavit as proof of income."
evidence = [
  { source_id = "pmay-u2-guidelines", quote = "Beneficiaries desirous of availing this assistance shall approach the ULBs/ Implementing Agencies or register their demand through Unified Web Portal with necessary documents, including ownership proof of land and submit the application.", where = "para 5.1.5, page 20" },
  { source_id = "pmay-u2-guidelines", quote = "For identification as an EWS/LIG/MIG beneficiary under the Scheme, an individual loan applicant will submit self-certificate/affidavit as proof of income.", where = "para 5.4.2, page 37" },
]

[[entries.steps]]
text = "For BLC: approach your urban local body or implementing agency, or register your demand on the unified web portal, with the documents, and submit the application."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "Beneficiaries desirous of availing this assistance shall approach the ULBs/ Implementing Agencies or register their demand through Unified Web Portal with necessary documents, including ownership proof of land and submit the application.", where = "para 5.1.5, page 20" }]

[[entries.steps]]
text = "For the interest subsidy: register your demand on the unified web portal."
evidence = [{ source_id = "pmay-u2-guidelines", quote = "For availing the benefit under ISS vertical, eligible beneficiaries will be required to register their demand through Unified web-portal.", where = "para 5.4.8, page 38" }]

