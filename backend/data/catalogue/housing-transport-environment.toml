[[entries]]
id = "jal-jeevan-mission"
name = "Jal Jeevan Mission (Har Ghar Jal)"
kind = "infrastructure"
sectors = ["housing"]
level = "central"
department = "Department of Drinking Water and Sanitation, Ministry of Jal Shakti, Government of India"
status = "active"
status_note = "The mission's portal page still gives 2024 as the target year for a tap in every rural household. A March 2026 department newsletter lists the Union Cabinet's approval to extend the mission up to December 2028 (JJM 2.0). The JJM 2.0 guidelines could not be read by the tools (the PDF has no text layer), so the details here come from the portal page and the PIB factsheet."
source_ids = ["jjm-about", "jjm-pib-2025oct", "jjm-samvad-2026-03"]
last_verified = 2026-10-31
summary = { en = "A national programme that builds piped water supply in villages so that every rural household has a tap with enough safe water, and that also serves schools, Anganwadi centres and health centres.", bn = "গ্রামে পাইপের জল সরবরাহ গড়ে তোলার জাতীয় কর্মসূচি, যাতে প্রতিটি গ্রামীণ পরিবারের কলে পর্যাপ্ত নিরাপদ জল থাকে; স্কুল, অঙ্গনওয়াড়ি ও স্বাস্থ্যকেন্দ্রেও জল পৌঁছায়।", hi = "गाँवों में पाइप से पानी की आपूर्ति बनाने का राष्ट्रीय कार्यक्रम, ताकि हर ग्रामीण परिवार के नल में पर्याप्त सुरक्षित पानी हो; स्कूल, आंगनवाड़ी और स्वास्थ्य केंद्र भी इसमें आते हैं।" }
target = { en = "Rural households and rural public buildings such as schools and Anganwadi centres. It is a public works programme run with States and village communities, not a payment to a person.", bn = "গ্রামীণ পরিবার এবং স্কুল ও অঙ্গনওয়াড়ির মতো গ্রামীণ সরকারি ভবন। এটি রাজ্য ও গ্রামীণ সম্প্রদায়ের সঙ্গে চালানো জনকল্যাণমূলক নির্মাণ কর্মসূচি, কোনো ব্যক্তিকে টাকা দেওয়া নয়।", hi = "ग्रामीण परिवार और स्कूल व आंगनवाड़ी जैसे ग्रामीण सार्वजनिक भवन। यह राज्यों और ग्रामीण समुदायों के साथ चलने वाला सार्वजनिक निर्माण कार्यक्रम है, किसी व्यक्ति को पैसे देना नहीं।" }
not_stated = [
  "How a household asks for a tap connection, and whether it must pay a share. The documents describe the programme and the community's role, not an application for a person.",
  "The JJM 2.0 rules: the guidelines released in 2026 could not be read by the tools.",
  "A fee or a helpline for households.",
]

[entries.apply]
label = "Jal Jeevan Mission portal"
url = "https://jaljeevanmission.gov.in/"
evidence = [{ source_id = "jjm-about", quote = "Every rural household has drinking water supply in adequate quantity of prescribed quality on regular and long-term basis at affordable service delivery charges leading to improvement in living standards of rural communities.", where = "About JJM, Vision" }]

[[entries.benefits]]
text = "The aim is that every rural household has drinking water in adequate quantity and of the prescribed quality, on a regular and long-term basis, at affordable service charges."
evidence = [{ source_id = "jjm-about", quote = "Every rural household has drinking water supply in adequate quantity of prescribed quality on regular and long-term basis at affordable service delivery charges leading to improvement in living standards of rural communities.", where = "About JJM, Vision" }]

[[entries.benefits]]
text = "The mission supports in-village piped water supply so that every rural household gets a tap connection."
evidence = [{ source_id = "jjm-about", quote = "Development of in-village piped water supply infrastructure to provide tap water connection to every rural household", where = "About JJM, Components" }]

[[entries.benefits]]
text = "Schools, Anganwadi centres, Gram Panchayat buildings, health centres, wellness centres and community buildings are also to get functional tap connections."
evidence = [{ source_id = "jjm-about", quote = "To provide functional tap connection to Schools, Anganwadi centres, GP buildings, Health centres, wellness centres and community buildings", where = "About JJM, Objectives" }]

[[entries.benefits]]
