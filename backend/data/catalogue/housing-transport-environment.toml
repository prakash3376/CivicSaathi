[[entries]]
id = "pmay-gramin"
name = "Pradhan Mantri Awaas Yojana - Gramin (PMAY-G)"
kind = "scheme"
sectors = ["housing"]
level = "central"
department = "Ministry of Rural Development, Government of India"
status = "active"
status_note = "The explainer says the Union Cabinet approved two crore more houses on 9 August 2024, with the outlay stated for the financial years 2024 to 2029."
source_ids = ["pmayg-pib-2024"]
last_verified = 2026-10-31
published_on = 2024-11-19
summary = { en = "Money to build a pucca house for houseless rural families and families living in kutcha houses, paid straight into the bank account.", bn = "গৃহহীন এবং কাঁচা বাড়িতে থাকা গ্রামীণ পরিবারগুলিকে পাকা বাড়ি তৈরির জন্য সহায়তা, সরাসরি ব্যাংক অ্যাকাউন্টে।", hi = "बेघर और कच्चे मकानों में रहने वाले ग्रामीण परिवारों को पक्का मकान बनाने के लिए सहायता, सीधे बैंक खाते में।" }
target = { en = "Rural households that have no shelter or live in kutcha houses, picked from the official survey lists and checked by the Gram Sabha.", bn = "যেসব গ্রামীণ পরিবারের আশ্রয় নেই বা কাঁচা বাড়িতে থাকে, সরকারি জরিপের তালিকা থেকে বাছাই করে গ্রামসভা যাচাই করে।", hi = "वे ग्रामीण परिवार जिनके पास आश्रय नहीं है या जो कच्चे मकान में रहते हैं, आधिकारिक सर्वेक्षण सूची से चुने और ग्राम सभा द्वारा सत्यापित।" }
not_stated = [
  "The official guidelines (the Framework for Implementation) could not be downloaded; this entry rests on a Ministry of Rural Development explainer published by PIB.",
  "A fee, a last date to apply, or a helpline.",
  "How the lists are made in your village: families are picked from the survey lists, so ask your Gram Panchayat whether your household is on the list.",
]

[entries.apply]
label = "PMAY-G registration (UMANG)"
url = "https://web.umang.gov.in/landing/department/pmayg.html"
evidence = [{ source_id = "pmayg-pib-2024", quote = "To avail benefits under PMAY-G, beneficiaries must go through a simple online registration process: https://web.umang.gov.in/landing/department/pmayg.html", where = "page 2" }]

[[entries.benefits]]
text = "The Union Cabinet approved assistance for two crore more houses, at Rs.1.20 lakh per house in plain areas and Rs.1.30 lakh in the North-Eastern States and the hill States and Union Territories named in the approval."
evidence = [{ source_id = "pmayg-pib-2024", quote = "On August 9, 2024, the Union Cabinet, chaired by Prime Minister Shri Narendra Modi, approved the proposal for financial assistance to be provided for the construction of two crore more houses at the existing unit assistance of Rs.1.20 lakh in plain areas and Rs.1.30 lakh in North Eastern Region States and Hill States of Himachal Pradesh, Uttarakhand, Union Territories of Jammu & Kashmir, and Ladakh.", where = "page 2" }]

[[entries.benefits]]
text = "The house must be at least 25 sq. mt., including a dedicated area for hygienic cooking."
evidence = [{ source_id = "pmayg-pib-2024", quote = "A minimum unit (house) size of 25 sq. mt., including a dedicated area for hygienic cooking.", where = "page 2" }]

[[entries.benefits]]
text = "A loan up to ₹70,000 at a 3% reduced interest rate is available to eligible beneficiaries for building the house."
evidence = [{ source_id = "pmayg-pib-2024", quote = "Loan up to ₹70,000 is available to eligible beneficiaries at a 3% reduced interest rate for the construction of their permanent house.", where = "page 3" }]

[[entries.benefits]]
text = "PMAY-G works with other schemes: up to ₹12,000 for a toilet under Swachh Bharat Mission-Gramin, and a free LPG connection for each house under Pradhan Mantri Ujjwala Yojana."
evidence = [
  { source_id = "pmayg-pib-2024", quote = "Swachh Bharat Mission-Gramin (SBM-G): Beneficiaries receive up to ₹12,000 to construct toilets, ensuring better sanitation facilities in rural homes.", where = "page 3" },
  { source_id = "pmayg-pib-2024", quote = "Pradhan Mantri Ujjwala Yojana (PMUY): Under this scheme, each house is entitled to a free LPG connection, promoting cleaner and safer cooking fuel.", where = "page 4" },
]

[[entries.eligibility]]
text = "Beneficiaries are identified through the SECC 2011 and Awaas+ (2018) surveys, verified by Gram Sabhas."
evidence = [{ source_id = "pmayg-pib-2024", quote = "Under this scheme, the beneficiaries are identified through SECC 2011 and Awaas+ (2018) surveys, verified by Gram Sabhas.", where = "page 4" }]

[[entries.eligibility]]
text = "Houseless households (all households without any shelter) are eligible."
evidence = [{ source_id = "pmayg-pib-2024", quote = "Houseless Households: All households without any shelter.", where = "page 4" }]

[[entries.eligibility]]
text = "Households living in homes with kutcha walls and kutcha roofs, or houses with zero, one or two rooms as per SECC 2011, are eligible."
evidence = [{ source_id = "pmayg-pib-2024", quote = "Households with Kuccha Houses: Households living in homes with kuccha walls and kuccha roofs or houses with zero, one, or two rooms as per the Socio Economic and Caste Census (SECC) 2011.", where = "page 4" }]

[[entries.eligibility]]
text = "Some groups are included automatically, such as destitute households, manual scavengers, Primitive Tribal Groups and legally released bonded labourers, and houseless households get priority."
evidence = [
  { source_id = "pmayg-pib-2024", quote = "The following categories of people are automatically included in the list of beneficiaries:", where = "page 5" },
  { source_id = "pmayg-pib-2024", quote = "Within the universe of eligible beneficiaries, priority will be given to the following categories:", where = "page 5" },
]

[[entries.eligibility]]
text = "At least 60% of targets are reserved for SC/ST households."
evidence = [{ source_id = "pmayg-pib-2024", quote = "The scheme reserves minimum 60% of targets for SC/ST households", where = "page 5" }]

[[entries.exclusions]]
text = "Households with a Kisan Credit Card with a credit limit of ₹50,000 or above are automatically excluded."
evidence = [{ source_id = "pmayg-pib-2024", quote = "Households with a Kisan Credit Card having a credit limit of ₹50,000 or above.", where = "page 6" }]

[[entries.exclusions]]
text = "Government employees, and households with non-agricultural enterprises, are automatically excluded."
evidence = [{ source_id = "pmayg-pib-2024", quote = "Government employees or those with non-agricultural enterprises.", where = "page 6" }]

[[entries.exclusions]]
text = "Households with a monthly income over ₹15,000, or that pay income tax, are automatically excluded."
evidence = [{ source_id = "pmayg-pib-2024", quote = "Households with monthly income over ₹15,000 or those paying income tax.", where = "page 6" }]

[[entries.exclusions]]
text = "Households that own assets such as refrigerators, landline phones, or irrigated land (more than 2.5 acres) are automatically excluded."
evidence = [{ source_id = "pmayg-pib-2024", quote = "Households owning assets such as refrigerators, landline phones, or irrigated land (more than 2.5 acres).", where = "page 6" }]

[[entries.documents]]
text = "A bank account or post office account linked to Aadhaar: all payments are made electronically into it."
evidence = [{ source_id = "pmayg-pib-2024", quote = "Payments are directly transferred to the beneficiaries' bank accounts or post office accounts that are linked to Aadhaar, ensuring that funds reach the intended recipients without delays.", where = "page 4" }]

[[entries.steps]]
text = "Register online through the UMANG page for PMAY-G."
evidence = [{ source_id = "pmayg-pib-2024", quote = "To avail benefits under PMAY-G, beneficiaries must go through a simple online registration process: https://web.umang.gov.in/landing/department/pmayg.html", where = "page 2" }]

[[entries.steps]]
text = "Beneficiaries are selected through a three-stage validation: the survey lists, Gram Sabha approval and geo-tagging."
evidence = [{ source_id = "pmayg-pib-2024", quote = "Beneficiaries are selected through a rigorous three-stage validation process that includes the Socio-Economic Caste Census (SECC 2011) and Awaas+ (2018) surveys, Gram Sabha approvals, and geo-tagging.", where = "page 1" }]

