target = { en = "Households that own a house with a suitable roof and have an electricity connection, and have not taken another subsidy for solar panels.", bn = "যে পরিবারের উপযুক্ত ছাদসহ বাড়ি আছে, বিদ্যুতের সংযোগ আছে এবং সোলার প্যানেলের জন্য অন্য কোনো ভর্তুকি নেয়নি।", hi = "वे परिवार जिनका उपयुक्त छत वाला अपना मकान है, बिजली कनेक्शन है और जिन्होंने सोलर पैनल के लिए कोई अन्य सब्सिडी नहीं ली है।" }
