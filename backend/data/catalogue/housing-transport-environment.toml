  { source_id = "pmsg-pib-2024", quote = "Step 9: Submit bank details and a cancelled cheque.", where = "page 3" },
]

[[entries.steps]]
text = "Visit the official website, register with your personal details, log in with your consumer number and mobile number, and fill in the online application for rooftop solar."
evidence = [
  { source_id = "pmsg-pib-2024", quote = "Step-1 : Visit the official website", where = "page 3" },
  { source_id = "pmsg-pib-2024", quote = "Step-2 : Provide personal details for registration", where = "page 3" },
  { source_id = "pmsg-pib-2024", quote = "Step-5 : Fill out the online application form.", where = "page 3" },
]

[[entries.steps]]
