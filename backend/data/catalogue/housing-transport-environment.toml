  { source_id = "pmsg-pib-2024", quote = "Step 8: After net meter installation and DISCOM inspection, obtain the commissioning certificate from the portal.", where = "page 3" },
]

[[entries.steps]]
text = "Submit your bank details and a cancelled cheque, and receive the subsidy within 30 days."
evidence = [{ source_id = "pmsg-pib-2024", quote = "Step 9: Submit bank details and a cancelled cheque. Receive subsidy within 30 days.", where = "page 3" }]

