url = "https://pmsuryaghar.gov.in/"
evidence = [{ source_id = "pmsg-pib-2024", quote = "Households can apply for the subsidy through the National Portal, where they can also select a suitable vendor for installing rooftop solar.", where = "page 2" }]

[[entries.benefits]]
text = "Central financial assistance is Rs 30,000 per kWp for the first 2 kWp of rooftop solar capacity and Rs 18,000 per kWp for the next 1 kWp, with no extra assistance beyond 3 kWp. Special category States get Rs 33,000 and Rs 19,800."
evidence = [{ source_id = "pmsg-pib-annex", quote = "1 Residential Sector (first 2 kWp of RTS capacity or part thereof) Rs 30,000/kWp Rs 33,000/kWp 2 Residential Sector (with additional RTS capacity of 1 kWp or part thereof) Rs 18,000/kWp Rs 19,800/kWp 3 Residential Sector (additional RTS capacity beyond 3 kWp) No additional CFA No additional CFA", where = "Annexure I, page 1" }]

[[entries.benefits]]
text = "Households get free electricity by installing subsidised rooftop solar panels, which reduces their energy costs."
evidence = [{ source_id = "pmsg-pib-2024", quote = "The scheme provides households with free electricity by installing subsidised rooftop solar panels, significantly reducing their energy costs.", where = "page 1" }]

[[entries.benefits]]
text = "Collateral-free, low-interest loans at around 7% are available for rooftop solar systems up to 3 kW."
evidence = [{ source_id = "pmsg-pib-2024", quote = "Households will have access to collateral-free, low-interest loans at around 7% interest for installing residential rooftop solar (RTS) systems up to 3 kW.", where = "page 2" }]

[[entries.benefits]]
text = "Households can earn extra income by selling surplus power from their rooftop systems to the electricity distribution company (DISCOM)."
evidence = [{ source_id = "pmsg-pib-2024", quote = "they will have the opportunity to earn extra income by selling surplus power generated by their rooftop solar systems to DISCOMs.", where = "page 4" }]

[[entries.eligibility]]
text = "The household must be an Indian citizen."
evidence = [{ source_id = "pmsg-pib-2024", quote = "The household must be an Indian citizen.", where = "page 3" }]

[[entries.eligibility]]
text = "The household must own a house with a roof suitable for solar panels, and have a valid electricity connection."
evidence = [
  { source_id = "pmsg-pib-2024", quote = "The household must own a house with a roof that is suitable for installing solar panels.", where = "page 3" },
  { source_id = "pmsg-pib-2024", quote = "The household must have a valid electricity connection.", where = "page 3" },
]

[[entries.eligibility]]
text = "The Parliament-reply annexure puts it more simply: any consumer tagged to a residential power connection of the local DISCOM is eligible, and the system can go on a roof, terrace, balcony or elevated structure."
evidence = [{ source_id = "pmsg-pib-annex", quote = "Any consumer tagged to a particular residential power connection of the local DISCOM, is eligible to take benefit under the scheme and can install RTS system on a roof/terrace/balcony or on top of elevated structures.", where = "Annexure I, page 1" }]

[[entries.exclusions]]
text = "A household that has already taken another subsidy for solar panels is not eligible."
evidence = [{ source_id = "pmsg-pib-2024", quote = "The household must not have availed any other subsidy for solar panels.", where = "page 3" }]

[[entries.documents]]
text = "Your electricity consumer number and mobile number, to log in; and at the end, bank details and a cancelled cheque."
evidence = [
