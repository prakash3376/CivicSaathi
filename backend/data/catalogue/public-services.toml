[[entries.steps]]
text = "After submission an acknowledgement or application number is generated. The revenue authority verifies the application, a field enquiry or hearing may be held (especially for inheritance, partition, disputed or complex cases), and notice may go to interested parties."
evidence = [
  { source_id = "wbgov-mutation-page", quote = "After submission, an acknowledgement number or application number is generated.", where = "How to apply/process" },
  { source_id = "wbgov-mutation-page", quote = "Field enquiry or hearing may be conducted, especially in inheritance, partition, disputed or complex cases.", where = "How to apply/process" },
