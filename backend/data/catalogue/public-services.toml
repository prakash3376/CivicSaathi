  { source_id = "wbgov-mutation-page", quote = "Online tracking and application: Can be done on https://banglarbhumi.gov.in", where = "Benefits" },
]

[[entries.steps]]
text = "Fill in the form with details of the applicant, transferor, land parcel, mouza, khatian, plot number, area, nature of transfer and supporting documents, and upload the documents or submit them at the office."
evidence = [
  { source_id = "wbgov-mutation-page", quote = "The mutation application form should be filled with details of applicant, transferor, land parcel, mouza, khatian, plot number, area, nature of transfer and supporting documents.", where = "How to apply/process" },
