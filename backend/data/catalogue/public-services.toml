# Public Services & Citizen Rights: services and entitlements in the catalogue. Every statement
# carries a quote that `python -m app.cli catalogue-check` finds in the saved document. English
# wording only (the quotes are English); the summary and the "who is it for" line are in three
# languages and hold no figure. The Bengali and Hindi are drafts by a non-native speaker and need a
# native speaker's review.

# --- e-Shram -----------------------------------------------------------------------------------

[[entries]]
id = "e-shram"
name = "e-Shram: registration of unorganised workers (National Database of Unorganised Workers)"
kind = "service"
sectors = ["public-services", "employment"]
level = "central"
department = "Ministry of Labour & Employment, Government of India"
status = "active"
source_ids = ["eshram-faqs", "wbgov-e-shram-page"]
last_verified = 2026-10-31
summary = { en = "A free registration for unorganised workers that gives a permanent unique number and card, used to reach government schemes.", bn = "অসংগঠিত শ্রমিকদের জন্য বিনামূল্যের নিবন্ধন, যা একটি স্থায়ী স্বতন্ত্র নম্বর ও কার্ড দেয় এবং সরকারি প্রকল্পে পৌঁছাতে কাজে লাগে।", hi = "असंगठित श्रमिकों के लिए निःशुल्क पंजीकरण, जो एक स्थायी विशिष्ट संख्या और कार्ड देता है और सरकारी योजनाओं तक पहुँचने में काम आता है।" }
target = { en = "Home-based, self-employed and wage workers in the unorganised sector who are not members of ESIC or EPFO.", bn = "অসংগঠিত ক্ষেত্রের গৃহভিত্তিক, স্বনিযুক্ত ও মজুরি-শ্রমিক, যাঁরা ইএসআইসি বা ইপিএফও-র সদস্য নন।", hi = "असंगठित क्षेत्र के घर-आधारित, स्वरोज़गार और मज़दूरी करने वाले श्रमिक, जो ईएसआईसी या ईपीएफओ के सदस्य नहीं हैं।" }
not_stated = [
  "A fixed cash payment for registering. The FAQ says the database is meant to help deliver social security benefits and may be used for assistance in emergencies, not that registration itself pays money.",
  "Which schemes you will qualify for. Each scheme on the portal keeps its own rules and is run by its own ministry or department.",
  "One age limit and income level. The Ministry's FAQ says age 16 and above with no income criterion, while the West Bengal state portal page gives age 16 to 59 and a lower or unstable income. The Ministry's FAQ is used for eligibility here; check the e-Shram portal for the current rule.",
]

[entries.apply]
label = "e-Shram portal"
url = "https://eshram.gov.in/"
evidence = [{ source_id = "eshram-faqs", quote = "eShram services may be accessed through the portal, available at http://www.eshram.gov.in.", where = "FAQ 2" }]

[[entries.benefits]]
text = "Registration gives the worker a 12 digit unique number (UAN) card, which is meant to make it easier to reach government schemes, entitlements and services."
evidence = [{ source_id = "eshram-faqs", quote = "issues them a 12 digit unique identification number (UAN) card, thereby enabling efficient access to various government schemes, entitlements and services.", where = "FAQ 1" }]

[[entries.benefits]]
text = "The card never expires, and renewal is not required (keeping the details on it up to date is advised)."
evidence = [
  { source_id = "eshram-faqs", quote = "The eShram card never expires.", where = "FAQ 35" },
  { source_id = "eshram-faqs", quote = "No, renewal of the eShram card is not required.", where = "FAQ 36" },
]

[[entries.benefits]]
text = "The unique number lets a registered worker track the schemes linked to the portal without visiting many portals or filling separate forms for each."
evidence = [{ source_id = "eshram-faqs", quote = "No need to visit multiple portals or fill out separate forms for each scheme.", where = "FAQ 8" }]

[[entries.benefits]]
text = "The West Bengal state portal lists accidental insurance cover under PMSBY of up to Rs 2 lakh for accidental death or total disability and Rs 1 lakh for partial disability."
evidence = [{ source_id = "wbgov-e-shram-page", quote = "Accidental insurance coverage: Up to Rs 2 lakh for accidental death or total disability and Rs 1 lakh for partial disability (via PMSBY).", where = "Benefits" }]

[[entries.benefits]]
text = "The same page says eligible workers can receive a monthly pension of around Rs 3,000 after the age of 60, through schemes like PM-SYM."
evidence = [{ source_id = "wbgov-e-shram-page", quote = "Pension benefit: Eligible workers can receive a monthly pension of around Rs 3,000 after the age of 60 (through schemes like PM-SYM).", where = "Benefits" }]

[[entries.benefits]]
text = "Benefits can be accessed anywhere in India, which is useful for migrant labourers."
evidence = [{ source_id = "wbgov-e-shram-page", quote = "Portability of benefits: Workers can access benefits anywhere in India, useful for migrant labourers.", where = "Benefits" }]

[[entries.eligibility]]
text = "An unorganised worker is a home-based worker, self-employed worker or wage worker in the unorganised sector who is not a member of ESIC or EPFO."
evidence = [{ source_id = "eshram-faqs", quote = "Any worker who is a home-based worker, self-employed worker or a wage worker working in the unorganised sector and not a member of ESIC or EPFO, is called an unorganised worker.", where = "FAQ 3" }]

[[entries.eligibility]]
text = "Anyone doing unorganised work who is aged 16 years or more can register, subject to the other prescribed criteria."
evidence = [{ source_id = "eshram-faqs", quote = "any individual engaged in unorganised work and aged 16 years and above is eligible to register on the eShram portal, subject to the fulfilment of other prescribed criteria.", where = "FAQ 30" }]

[[entries.eligibility]]
text = "There is no income criterion for registering."
evidence = [{ source_id = "eshram-faqs", quote = "There are no income criteria for registering on eShram as unorganised worker.", where = "FAQ 29" }]

[[entries.eligibility]]
text = "Agriculture labourers and landless farmers can register."
evidence = [{ source_id = "eshram-faqs", quote = "Agriculture labours and landless farmers are eligible for registration in the eShram portal.", where = "FAQ 54" }]

[[entries.documents]]
text = "At a Common Service Centre the worker does not submit any document but must carry the Aadhaar number and the mobile for registration."
evidence = [{ source_id = "eshram-faqs", quote = "Worker is not required to submit any document at the CSC’s. They are required to carry their Aadhaar number & Mobile for registration.", where = "FAQ 46" }]

[[entries.documents]]
text = "A worker without an Aadhaar linked mobile number can visit a Common Service Centre or State Seva Kendra and register through biometric authentication."
evidence = [{ source_id = "eshram-faqs", quote = "If a worker does not have Aadhaar linked mobile number, he/ she may visit nearest Common Service Centre (CSC) or State Seva Kendra (SSK) and register through biometric authentication.", where = "FAQ 31" }]

[[entries.documents]]
text = "No proof of date of birth or income is required at present."
evidence = [{ source_id = "eshram-faqs", quote = "At present there is no requirement to provide any proof of date of birth and income.", where = "FAQ 44" }]

[[entries.steps]]
text = "Register yourself on the e-Shram portal, or with help at the nearest Common Service Centre."
evidence = [{ source_id = "eshram-faqs", quote = "An unorganised worker may register himself/ herself by visiting eShram portal or through assisted approach by visiting nearest CSC.", where = "FAQ 33" }]

[[entries.steps]]
text = "Online: click Register on e-Shram and enter your Aadhaar-linked mobile number to receive an OTP, complete Aadhaar verification, fill personal and bank details, and submit a self-declaration."
evidence = [
  { source_id = "wbgov-e-shram-page", quote = "Start registration: Click on \"Register on e-Shram\" and enter your Aadhaar-linked mobile number to receive an OTP.", where = "Application Details" },
  { source_id = "wbgov-e-shram-page", quote = "Submit bank details: Provide bank account number and IFSC code for benefit transfers.", where = "Application Details" },
]

[[entries.steps]]
text = "After registration the card can be downloaded instantly in PDF format or printed."
evidence = [{ source_id = "wbgov-e-shram-page", quote = "Download E-Shram Card: The card can be downloaded instantly in PDF format or printed.", where = "Application Details" }]

[[entries.steps]]
text = "Registration is free; workers are not required to pay any charges to any registering entity."
evidence = [{ source_id = "eshram-faqs", quote = "Registration on eShram portal is totally free. Workers are not required to pay any charges to any registering entity.", where = "FAQ 34" }]

[[entries.steps]]
text = "There is no fixed last date for registration."
evidence = [{ source_id = "eshram-faqs", quote = "No, there is no fixed last date for registration.", where = "FAQ 57" }]

[[entries.steps]]
text = "For help with registration, the national helpdesk can be called on 14434."
evidence = [{ source_id = "eshram-faqs", quote = "Users may contact the helpdesk by dialling 14434 for support and guidance", where = "FAQ 27" }]

# --- West Bengal: caste certificates -----------------------------------------------------------

[[entries]]
id = "wb-caste-certificate"
name = "Caste certificate (SC / ST / OBC) in West Bengal, through the OSCAR portal"
kind = "service"
sectors = ["public-services"]
level = "state"
state = "West Bengal"
department = "Backward Classes Welfare Department, Government of West Bengal"
status = "active"
source_ids = ["wb-castcert-how-to-apply", "bsk-manual-2021"]
last_verified = 2026-10-31
summary = { en = "A free certificate that identifies a person as belonging to a Scheduled Caste, Scheduled Tribe or Other Backward Class, applied for online.", bn = "তফসিলি জাতি, তফসিলি উপজাতি বা অন্যান্য অনগ্রসর শ্রেণিভুক্ত হিসেবে পরিচয় দেওয়া বিনামূল্যের শংসাপত্র, যার জন্য অনলাইনে আবেদন করা যায়।", hi = "अनुसूचित जाति, अनुसूचित जनजाति या अन्य पिछड़ा वर्ग के रूप में पहचान देने वाला निःशुल्क प्रमाणपत्र, जिसके लिए ऑनलाइन आवेदन किया जाता है।" }
target = { en = "People in West Bengal who belong to a Scheduled Caste, Scheduled Tribe or Other Backward Class and need the certificate for reservation and other facilities.", bn = "পশ্চিমবঙ্গের যে মানুষ তফসিলি জাতি, তফসিলি উপজাতি বা অন্যান্য অনগ্রসর শ্রেণিভুক্ত এবং সংরক্ষণ ও অন্যান্য সুবিধার জন্য শংসাপত্র দরকার।", hi = "पश्चिम बंगाल के वे लोग जो अनुसूचित जाति, अनुसूचित जनजाति या अन्य पिछड़ा वर्ग से हैं और आरक्षण व अन्य सुविधाओं के लिए प्रमाणपत्र चाहते हैं।" }
not_stated = [
  "How long the certificate takes to issue. Neither document gives a time limit.",
  "The full list of supporting documents. The 2021 BSK manual points to the department's guidelines for SC/ST and OBC certificates, which could not be downloaded for this check, so ask the Block, Sub-division or Kolkata office for the current list.",
  "Whether you must also hand in papers. The OSCAR page says no documents are uploaded online, while the 2021 BSK manual says the signed application goes to the Block or Sub-division with documents in support of the claim. Ask the office before you go.",
]

[entries.apply]
label = "OSCAR caste certificate portal"
url = "https://castcertificatewb.gov.in/"
evidence = [{ source_id = "bsk-manual-2021", quote = "Application for certificate can be filed online on the website at www.castcertificatewb.gov.in", where = "BSK manual: Issuance of SC/ST/OBC certificate" }]

[[entries.benefits]]
text = "The certificate identifies a person as SC, ST or OBC so that they can claim reservation and other facilities meant for these groups."
evidence = [{ source_id = "bsk-manual-2021", quote = "To issue caste identification certificate for the purpose of obtaining benefit of reservation and other facilities meant for SC/ST/OBC", where = "BSK manual: Issuance of SC/ST/OBC certificate" }]

[[entries.benefits]]
text = "The benefit is reservation in services and posts and admission in educational institutions."
evidence = [{ source_id = "bsk-manual-2021", quote = "Reservation in services and posts and admission in educational institutions", where = "BSK manual: Issuance of SC/ST/OBC certificate" }]

[[entries.benefits]]
text = "Issuing the certificate is free of cost."
evidence = [{ source_id = "wb-castcert-how-to-apply", quote = "Issuance of Certificate is free of cost.", where = "Important Note 2" }]

[[entries.eligibility]]
text = "There is no age or education bar. For an OBC certificate the applicant must belong to the non-creamy layer."
evidence = [{ source_id = "bsk-manual-2021", quote = "There is no age or education bar. For obtaining OBC certificate, candidate needs to belong to non-creamy layer.", where = "BSK manual: Issuance of SC/ST/OBC certificate" }]

[[entries.documents]]
text = "A scanned photograph is compulsory with the online application; it can be at most 150kb."
evidence = [
  { source_id = "wb-castcert-how-to-apply", quote = "Scanned Photograph to be submitted mandatorily during online application.", where = "Important Note 1" },
  { source_id = "wb-castcert-how-to-apply", quote = "Upload the photograph of the applicant(Maximum Size - 150kb).", where = "Page III, step 1" },
]

[[entries.documents]]
text = "At least one identity number is asked for: the voter card (EPIC) number, the Aadhaar number, or the Khadya Sathi number."
evidence = [{ source_id = "wb-castcert-how-to-apply", quote = "Documents Required(Atleast One). a. Enter Your Epic No. b. Enter your Adhar Number(Adhar Number Should Be Numeric Only).", where = "Page I, step 7" }]

[[entries.documents]]
text = "The form asks for details of these papers: proof of relationship to the applicant, age proof, a photo identity document, proof of citizenship, proof of residence in West Bengal and proof of local residence."
evidence = [{ source_id = "wb-castcert-how-to-apply", quote = "Select the document type and Enter the details/no of the below documents :- a. Document establishing relationship with applicant. b. Age Proof. c. Photo Identity Document. d. Proof of Citizenship. e. Proof of residence in West Bengal. f. Proof of Local Residence.", where = "Page III, step 2" }]

[[entries.documents]]
text = "No documents have to be uploaded for the online application."
evidence = [{ source_id = "wb-castcert-how-to-apply", quote = "No Documents are required to be uploaded for online application of caste Certificate.", where = "Important Note 3" }]

[[entries.steps]]
text = "Apply online on the OSCAR portal. You get an acknowledgement with a receipt number."
evidence = [{ source_id = "bsk-manual-2021", quote = "Application for certificate can be filed online on the website at www.castcertificatewb.gov.in and the applicant gets an acknowledgement with receipt number", where = "BSK manual: Issuance of SC/ST/OBC certificate" }]

[[entries.steps]]
text = "The form asks for details of two local referees."
evidence = [{ source_id = "wb-castcert-how-to-apply", quote = "Please enter the details of two (2) local referees.", where = "Page I, step 14" }]

[[entries.steps]]
text = "After submitting, download the automatically generated application form, acknowledgement and service details."
evidence = [{ source_id = "wb-castcert-how-to-apply", quote = "Then click on Submit button and download the autogenerated Application form, Acknowledgement,Service Details .", where = "end of the guideline" }]

[[entries.steps]]
text = "A Bangla Sahayata Kendra operator can help fill in the application and scan and download it."
evidence = [{ source_id = "bsk-manual-2021", quote = "Assistance with filling up application, scanning and downloading the application on the OSCAR portal", where = "BSK manual: Issuance of SC/ST/OBC certificate" }]

[[entries.steps]]
text = "The certificate is issued by the SDO for districts and the DWO for Kolkata; the paper application goes to the BDO for a Gram Panchayat area, the SDO for a municipality area and the DWO for Kolkata."
evidence = [
  { source_id = "bsk-manual-2021", quote = "SDO for districts and DWO for Kolkata is the certificate issuing authority", where = "BSK manual: Issuance of SC/ST/OBC certificate" },
  { source_id = "bsk-manual-2021", quote = "For GP area concerned BDO, for municipality area concerned SDO and for KMC area DWO, Kolkata", where = "BSK manual: Issuance of SC/ST/OBC certificate" },
]

# --- West Bengal: land records -----------------------------------------------------------------

[[entries]]
id = "wb-land-mutation"
name = "Mutation of land records (change of name in the record-of-rights), West Bengal"
kind = "service"
sectors = ["public-services"]
level = "state"
state = "West Bengal"
department = "Land & Land Reforms and Refugee Relief & Rehabilitation Department, Government of West Bengal"
status = "active"
source_ids = ["wbgov-mutation-page", "wb-mutation-citizen-guide", "wb-mutation-proforma", "bsk-manual-2021"]
last_verified = 2026-10-31
summary = { en = "Putting the new owner's name in the land record after a sale, gift, exchange or inheritance.", bn = "বিক্রি, দান, বিনিময় বা উত্তরাধিকারের পর জমির রেকর্ডে নতুন মালিকের নাম তোলা।", hi = "बिक्री, दान, अदला-बदली या उत्तराधिकार के बाद भूमि अभिलेख में नए मालिक का नाम दर्ज कराना।" }
target = { en = "People who have got land by sale, gift, exchange or inheritance and want the land record to show their name.", bn = "যাঁরা বিক্রি, দান, বিনিময় বা উত্তরাধিকারে জমি পেয়েছেন এবং জমির রেকর্ডে নিজের নাম চান।", hi = "वे लोग जिन्हें बिक्री, दान, अदला-बदली या उत्तराधिकार से ज़मीन मिली है और जो भूमि अभिलेख में अपना नाम चाहते हैं।" }
not_stated = [
  "How long mutation takes. None of the documents gives a time limit.",
  "Whether the fee rates are still current. The guide cites a circular from 2005 for them, and the form was last revised in 2009. Check the rates at the Block Land & Land Reforms Office.",
  "The Banglarbhumi portal's own pages could not be read by the checking tools (they need JavaScript). The steps below come from the West Bengal state portal's mutation page (26 June 2026), the department's citizen guide, the application form and the 2021 BSK manual.",
  "The fee amount on the state portal page. It says only that mutation fees or service charges are paid online or through the prescribed mode; the amounts in the older citizen guide may not apply.",
]

[entries.apply]
label = "Banglarbhumi (West Bengal land records portal)"
url = "https://banglarbhumi.gov.in/"
evidence = [{ source_id = "bsk-manual-2021", quote = "Updation of record of rights owing to change of ownership of land.", where = "BSK manual: Application for Mutation/ Conversion" }]

[[entries.benefits]]
text = "Mutation means substituting the name of a person with the name of another in the record-of-rights."
evidence = [{ source_id = "wb-mutation-citizen-guide", quote = "Mutation means substitution of the name of a person by the name of another in the record-of-rights.", where = "FAQ 1, page 2" }]

[[entries.benefits]]
text = "The aim is to update the record of rights when ownership of land changes."
evidence = [{ source_id = "bsk-manual-2021", quote = "Updation of record of rights owing to change of ownership of land.", where = "BSK manual: Application for Mutation/ Conversion" }]

[[entries.benefits]]
text = "After the case is heard and examined, a copy of the order and the corrected Record of Rights (khatian) can be obtained."
evidence = [{ source_id = "bsk-manual-2021", quote = "Cases are heard and examined and are allowed on merit and order is passed. Copy of order and corrected ROR(Khatian) can be obtained.", where = "BSK manual: Application for Mutation/ Conversion" }]

[[entries.benefits]]
text = "The name of the new owner or legal heir is entered in the land revenue records. Mutation does not create ownership by itself; it records the change in the revenue records."
evidence = [
  { source_id = "wbgov-mutation-page", quote = "Updated ownership record: The name of the new owner or legal heir is entered in the land revenue records.", where = "Benefits" },
  { source_id = "wbgov-mutation-page", quote = "Mutation does not create ownership by itself, but it records the change in the revenue records.", where = "introduction" },
]

[[entries.benefits]]
text = "The mutated owner can pay land revenue, rent or property-related dues in their own name, and can obtain the updated Record of Rights, khatian and plot information."
evidence = [
  { source_id = "wbgov-mutation-page", quote = "Payment of land revenue or tax: The mutated owner can pay land revenue, rent or property-related dues in their name.", where = "Benefits" },
  { source_id = "wbgov-mutation-page", quote = "Access to land record documents: The owner can obtain updated Record of Rights, khatian, plot information and other land documents.", where = "Benefits" },
]

[[entries.benefits]]
text = "Financial institutions often require updated land records for a bank loan or mortgage."
evidence = [{ source_id = "wbgov-mutation-page", quote = "Support for bank loans: Financial institutions often require updated land records for loan or mortgage processing.", where = "Benefits" }]

[[entries.eligibility]]
text = "Eligible applicants include the buyer under a registered sale deed, a legal heir after the owner's death, a donee under a registered gift deed, a person receiving land by partition or family settlement, exchange or transfer deed, and a person claiming under a court decree or government order."
evidence = [
  { source_id = "wbgov-mutation-page", quote = "Buyer of land or property through a registered sale deed.", where = "Eligibility" },
  { source_id = "wbgov-mutation-page", quote = "Legall heir after death of the recorded owner.", where = "Eligibility" },
  { source_id = "wbgov-mutation-page", quote = "Donee receiving land through a registered gift deed.", where = "Eligibility" },
  { source_id = "wbgov-mutation-page", quote = "Person claiming mutation based on court decree or government order.", where = "Eligibility" },
]

[[entries.eligibility]]
text = "The applicant must have valid supporting documents, and should not have a pending legal dispute that prevents mutation, unless the competent authority allows it."
evidence = [
  { source_id = "wbgov-mutation-page", quote = "Applicant must have valid supporting documents proving transfer, inheritance or legal entitlement.", where = "Eligibility" },
  { source_id = "wbgov-mutation-page", quote = "Applicant should not have a pending legal dispute that prevents mutation, unless allowed by the competent authority.", where = "Eligibility" },
]

[[entries.eligibility]]
text = "Mutation is done on a transfer by sale, gift or hebanama, on exchange, and on inheritance."
evidence = [{ source_id = "wb-mutation-citizen-guide", quote = "a. Transfer by sale, gift or hebanama b. Exchange and c. Inheritance", where = "page 1" }]

[[entries.eligibility]]
text = "The applicant should be the raiyat or owner holding the land."
evidence = [{ source_id = "bsk-manual-2021", quote = "Concerned raiyat/owner holding land.", where = "BSK manual: Application for Mutation/ Conversion" }]

[[entries.documents]]
text = "The state portal page lists generally required documents: the application form, the registered deed or transfer document, the previous Record of Rights or khatian extract, plot and mouza details, identity and address proof, and the latest land revenue or tax receipt."
evidence = [
  { source_id = "wbgov-mutation-page", quote = "Registered deed or transfer document", where = "Documents generally required" },
  { source_id = "wbgov-mutation-page", quote = "Previous Record of Rights/khatian / land record extract", where = "Documents generally required" },
  { source_id = "wbgov-mutation-page", quote = "Latest land revenue or tax receipt", where = "Documents generally required" },
]

[[entries.documents]]
text = "For inheritance, a death certificate and a legal heir certificate or succession-related documents are needed; a no objection certificate and a court order or decree are needed where they apply."
evidence = [
  { source_id = "wbgov-mutation-page", quote = "Death certificate, in case of inheritance", where = "Documents generally required" },
  { source_id = "wbgov-mutation-page", quote = "Legal heir certificate or succession-related documents, if applicable", where = "Documents generally required" },
  { source_id = "wbgov-mutation-page", quote = "Court order or decree, if applicable", where = "Documents generally required" },
]

[[entries.documents]]
text = "The application in the prescribed format, a copy of the registered deed of transfer, a copy of the rent receipt showing up to date revenue paid, and a declaration that the applicant will have no claim if the land later vests in the State."
evidence = [{ source_id = "wb-mutation-citizen-guide", quote = "a copy of the registered deed of transfer, copy of the Rent Receipt showing the payment of upto date revenue of the land in question, a declaration to the effect that in case the mutation is allowed the applicant will have no claim over the land if in future it vests in the State in any proceeding under any provisions of law.", where = "page 1, Necessary Documents" }]

[[entries.documents]]
text = "The application form lists these enclosures: copies of the registered deed, of the legal heir certificate or hebanama, of chain deeds, and of the up-to-date rent receipt; the declaration with a court fee stamp of Rs. 10/-; and proof of payment of the process fee."
evidence = [
