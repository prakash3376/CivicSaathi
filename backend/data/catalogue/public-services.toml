  { source_id = "bsk-manual-2021", quote = "Declaration by close relative/family member in prescribed pro-forma", where = "BSK manual: Application for Birth and Death Certificate" },
  { source_id = "bsk-manual-2021", quote = "Information in prescribed pro-forma (i.e., Form 2) and death certificate from medical practitioner (Form 4A)", where = "BSK manual: Application for Birth and Death Certificate" },
]

[[entries.steps]]
text = "Births and deaths are registered at the place where the event happened, by the registrar of that area."
evidence = [{ source_id = "bsk-manual-2021", quote = "Births and deaths are registered at the place of occurrence of the event and by the concerned registrar under whose jurisdiction the event has taken place.", where = "BSK manual: Application for Birth and Death Certificate" }]

[[entries.steps]]
text = "Only a home event can be reported online within 21 days. After 21 days, you must go to the office of the registrar."
evidence = [{ source_id = "bsk-manual-2021", quote = "Only domiciliary (house/home) events within 21 days of the occurrence of the event may be reported. If the event has crossed the limit of 21 days, one must approach the office of the concerned registrar (B&D).", where = "BSK manual: Application for Birth and Death Certificate" }]

[[entries.steps]]
text = "Print the application and hand it to the concerned registrar at the address printed on it, along with the required documents."
evidence = [{ source_id = "bsk-manual-2021", quote = "Get a print out of the application and forward it to the concerned registrar BY HAND at the given address (address will appear on the bottom of the print out of the application) along with the required documents.", where = "BSK manual: Application for Birth and Death Certificate" }]

