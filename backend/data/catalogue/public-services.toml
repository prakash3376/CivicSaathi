  { source_id = "wbgov-mutation-page", quote = "The applicant can download or collect the updated Record of Rights, khatian or mutation certificate as applicable.", where = "How to apply/process" },
]

[[entries.steps]]
text = "File the application at the office of the Revenue Inspector at the Gram Panchayat level or at the office of the Block Land & Land Reforms Officer."
evidence = [{ source_id = "wb-mutation-citizen-guide", quote = "Applications for mutation will have to be filed in the offices of the concerned Revenue Inspector at the Gram Panchayat level or in the Office of the concerned Block Land & Land Reforms Officer at the Block or Panchayat Samity level.", where = "page 1, How to apply" }]

[[entries.steps]]
text = "The application can also be made on the Banglarbhumi portal after signing in with the OTP sent to the mobile and e-mail, and the enclosures can be uploaded there."
evidence = [
  { source_id = "bsk-manual-2021", quote = "Application can be done by the applicant after signing in and entering OTP received in mobile and e-mail in web portal www.banglarbhumi.gov.in", where = "BSK manual: Application for Mutation/ Conversion" },
  { source_id = "bsk-manual-2021", quote = "The relevant enclosures can be uploaded.", where = "BSK manual: Application for Mutation/ Conversion" },
]

[[entries.steps]]
text = "An application fee of Rs. 10/- is paid with the application, and a processing fee is charged per decimal of land, at a rate that depends on whether the land is rural, municipal, within KMDA, or commercial and industrial."
evidence = [
  { source_id = "wb-mutation-citizen-guide", quote = "The application fees of Rs. 10/- has to be paid with application for mutation.", where = "page 1, Fees for mutation" },
  { source_id = "wb-mutation-citizen-guide", quote = "Rate of processing fees per decimal of land for mutation Classification of land Rural Area Municipal Area other than KMDA Municipal Area within KMDA Commercial and Industrial land", where = "page 1, Fees for mutation" },
]

[[entries.steps]]
text = "Which officer decides depends on the size of the land: the Block Land & Land Reforms Officer for 10 decimal or less, the Sub-Divisional officer for more than 10 decimal and up to one acre, and the District officer for above one acre."
evidence = [{ source_id = "bsk-manual-2021", quote = "For land 10 decimal or less, the concerned BL & LRO, for land more than 10 decimal but up to one acre, the SDL & LRO of the concerned Sub Division and for land above one acre, the DL & LRO(ADM-LR) of the concerned district.", where = "BSK manual: Application for Mutation/ Conversion" }]

[[entries.steps]]
text = "A hearing or enquiry notice can be downloaded after an SMS alert is received."
