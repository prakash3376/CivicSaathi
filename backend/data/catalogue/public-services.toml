[entries.apply]
label = "RTI portal (Department of Personnel & Training)"
url = "https://rti.gov.in/"
evidence = [{ source_id = "rti-portal-home", quote = "A Citizen Gateway An Initiative of Department of Personnel & Training, Government of India", where = "home page" }]

[[entries.benefits]]
text = "All citizens have the right to information."
evidence = [{ source_id = "rti-act-2005", quote = "3. Subject to the provisions of this Act, all citizens shall have the right to information.", where = "section 3" }]

[[entries.benefits]]
text = "The information officer must reply within thirty days of receiving the request, either giving the information or rejecting the request for a reason in the Act."
evidence = [{ source_id = "rti-act-2005", quote = "shall, as expeditiously as possible, and in any case within thirty days of the receipt of the request, either provide the information on payment of such fee as may be prescribed or reject the request for any of the reasons specified in sections 8 and 9:", where = "section 7(1)" }]

[[entries.benefits]]
text = "Where the information concerns the life or liberty of a person, it must be provided within forty-eight hours."
evidence = [{ source_id = "rti-act-2005", quote = "Provided that where the information sought for concerns the life or liberty of a person, the same shall be provided within forty-eight hours of the receipt of the request.", where = "section 7(1)" }]

[[entries.benefits]]
text = "No fee is charged from people who are below the poverty line, as determined by the appropriate Government."
evidence = [{ source_id = "rti-act-2005", quote = "shall be reasonable and no such fee shall be charged from the persons who are of below poverty line as may be determined by the appropriate Government.", where = "section 7(5)" }]

[[entries.eligibility]]
text = "The right is given to citizens."
evidence = [{ source_id = "rti-act-2005", quote = "3. Subject to the provisions of this Act, all citizens shall have the right to information.", where = "section 3" }]

[[entries.exclusions]]
text = "A request can be rejected for the reasons given in sections 8 and 9 of the Act."
evidence = [{ source_id = "rti-act-2005", quote = "reject the request for any of the reasons specified in sections 8 and 9:", where = "section 7(1)" }]

[[entries.documents]]
text = "You do not have to give a reason for asking, or any personal details except what is needed to contact you."
evidence = [{ source_id = "rti-act-2005", quote = "(2) An applicant making request for information shall not be required to give any reason for requesting the information or any other personal details except those that may be necessary for contacting him.", where = "section 6(2)" }]

[[entries.steps]]
text = "Make a request in writing or electronically, in English, Hindi or the official language of the area, with the prescribed fee, to the Public Information Officer of the public authority."
evidence = [{ source_id = "rti-act-2005", quote = "6. (1) A person, who desires to obtain any information under this Act, shall make a request in writing or through electronic means in English or Hindi or in the official language of the area in which the application is being made, accompanying such fee as may be prescribed, to—", where = "section 6(1)" }]

[[entries.steps]]
text = "If you cannot write the request, the officer must give all reasonable help to put an oral request into writing."
evidence = [{ source_id = "rti-act-2005", quote = "shall render all reasonable assistance to the person making the request orally to reduce the same in writing.", where = "section 6(1), proviso" }]

[[entries.steps]]
text = "If you get no decision in time or are unhappy with the decision, you can appeal to a senior officer within thirty days."
evidence = [{ source_id = "rti-act-2005", quote = "Any person who, does not receive a decision within the time specified in sub-section (1) or clause (a) of sub-section (3) of section 7, or is aggrieved by a decision of the Central Public Information Officer or State Public Information Officer, as the case may be, may within thirty days from the expiry of such period or from the receipt of such a decision prefer an appeal", where = "section 19(1)" }]

