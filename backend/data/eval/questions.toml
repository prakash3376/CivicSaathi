# The handwritten benchmark for AI Saathi. Run it with `python -m app.cli eval`.
#
# A case says what a citizen asks and where the answer is, never what the answer should say:
#   entries   catalogue entry ids; the evidence is any quote of those entries (each quote is
#             already checked against its document by `catalogue-check`)
#   sources   registered source ids; the evidence is any passage of those documents
#   hi / bn   the same question in Hindi / Bengali. The case is run in all three languages and
#             must find the same evidence. These wordings are drafts by a non-native speaker.
#   history   earlier questions of the conversation, for follow-ups
#   intent    what the question is for (see app/services/assistant/intent.py)
#   answerable  false when the documents cannot answer: the right result is to say so
#
# Groups: colloquial, factual, eligibility, numeric, multilingual, crosssector, followup,
# adversarial. `entries` and `sources` may be empty only when answerable is false.

[[cases]]
id = "farmer-money"
group = "colloquial"
intent = "scheme_discovery"
question = "Who can get farmer money from the government?"
entries = ["pm-kisan"]

[[cases]]
id = "pmkisan-amount"
group = "numeric"
intent = "benefit_amount"
question = "How much money does PM-KISAN give each year?"
hi = "पीएम-किसान में हर साल कितना पैसा मिलता है?"
bn = "পিএম-কিষাণে প্রতি বছর কত টাকা পাওয়া যায়?"
entries = ["pm-kisan"]

