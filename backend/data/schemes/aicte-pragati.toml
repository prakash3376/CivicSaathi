evidence = [{ source_id = "aicte-pragati-faq", quote = "Student must have General Saving Account in his / her name (FRILL/Minor/Joint account will not be accepted)." }]

[[steps]]
id = "apply_online"
text = { en = "Apply online on the National Scholarship Portal (NSP) once the application process has opened.", bn = "আবেদন প্রক্রিয়া শুরু হলে ন্যাশনাল স্কলারশিপ পোর্টালে (NSP) অনলাইনে আবেদন করুন।", hi = "आवेदन प्रक्रिया शुरू होने पर राष्ट्रीय छात्रवृत्ति पोर्टल (NSP) पर ऑनलाइन आवेदन करें।" }
evidence = [{ source_id = "aicte-pragati-faq", quote = "is required to apply online on National Scholarship Portal (NSP) after initiation of application process" }]

[[steps]]
id = "check_details"
text = { en = "After you submit, check all your details. If something is missing or wrong, contact your institute straight away.", bn = "জমা দেওয়ার পর আপনার সব তথ্য যাচাই করুন। কিছু বাদ পড়লে বা ভুল থাকলে সঙ্গে সঙ্গে আপনার প্রতিষ্ঠানের সঙ্গে যোগাযোগ করুন।", hi = "जमा करने के बाद अपनी सभी जानकारी जाँच लें। कुछ छूटा या ग़लत हो तो तुरंत अपने संस्थान से संपर्क करें।" }
evidence = [{ source_id = "aicte-pragati-faq", quote = "In case of omissions / errors, immediately contact the institute for rectifying the same." }]

[[steps]]
id = "institute_verifies"
text = { en = "Ask your institute to verify and forward your application within the time set on the NSP portal.", bn = "NSP পোর্টালে নির্ধারিত সময়ের মধ্যে আপনার আবেদন যাচাই করে এগিয়ে দিতে আপনার প্রতিষ্ঠানকে অনুরোধ করুন।", hi = "अपने संस्थान से कहें कि वह NSP पोर्टल पर तय समय के भीतर आपका आवेदन सत्यापित करके आगे भेजे।" }
evidence = [{ source_id = "aicte-pragati-faq", quote = "Students are also advised to request their Institute to verify and forward the application within the time period mentioned in the NSP Portal." }]

