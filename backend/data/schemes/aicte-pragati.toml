# AICTE Pragati Scholarship Scheme: scholarship for girl students in technical education.
#
# Every rule, document, step, contact and deadline below carries `evidence`: words copied from an
# indexed official document. The loader checks that each figure in the wording is in its quote,
# and `python -m app.cli schemes-check` checks that each quote is really in the document.
# Rules follow the document's own words: "less than" is a strict comparison (lt).
#
# Sources: the FAQ (created November 2021, so it may predate changes) and the 2026-27 notification
# (a scan read by OCR: its figures may be misread, so check them against the original).
#
# The Bengali is a draft by a non-native speaker and needs a native speaker's review.

id = "aicte-pragati"
name = "AICTE Pragati Scholarship Scheme"
authority = "All India Council for Technical Education (AICTE), Government of India"
level = "central"
sectors = ["education"]
source_ids = ["aicte-pragati-faq", "aicte-pragati-notification-2026-27"]
summary = { en = "AICTE's scholarship for girls who join a degree or diploma course in technical education.", bn = "প্রযুক্তিগত শিক্ষায় ডিগ্রি বা ডিপ্লোমা কোর্সে ভর্তি হওয়া মেয়েদের জন্য AICTE-র বৃত্তি।", hi = "AICTE की छात्रवृत्ति उन लड़कियों के लिए है जो तकनीकी शिक्षा में डिग्री या डिप्लोमा कोर्स में प्रवेश लेती हैं।" }
not_stated = [
  { en = "Any fee for applying. The documents do not mention one.", bn = "আবেদনের কোনো ফি আছে কি না। নথিগুলিতে এর উল্লেখ নেই।", hi = "आवेदन के लिए कोई शुल्क। दस्तावेज़ों में इसका ज़िक्र नहीं है।" },
]

# --- What the scheme requires of every applicant -------------------------------------------

[[criteria]]
id = "female"
label = { en = "You are a female student", bn = "আপনি একজন ছাত্রী (মহিলা)", hi = "आप एक छात्रा हैं" }
condition = { field = "gender", op = "eq", value = "female" }
evidence = [{ source_id = "aicte-pragati-faq", quote = "Only female students are eligible." }]

[[criteria]]
id = "two_girls"
label = { en = "There are at most two girls in your family", bn = "আপনার পরিবারে সর্বোচ্চ দুজন মেয়ে আছে", hi = "आपके परिवार में अधिकतम दो लड़कियाँ हैं" }
condition = { field = "girls_in_family", op = "lte", value = 2 }
note = { en = "The FAQ only says 'Up to Two Girls per family'. It does not explain how the girls are counted.", bn = "FAQ-তে শুধু লেখা আছে 'Up to Two Girls per family' (পরিবারপিছু সর্বোচ্চ দুজন মেয়ে)। মেয়েদের কীভাবে গোনা হবে, তা সেখানে বলা নেই।", hi = "FAQ में केवल 'Up to Two Girls per family' लिखा है। यह नहीं बताया गया कि लड़कियों की गिनती कैसे होगी।" }
evidence = [{ source_id = "aicte-pragati-faq", quote = "Up to Two Girls per family." }]

[[criteria]]
id = "income"
label = { en = "Your family income is less than Rs 8,00,000 a year", bn = "আপনার পরিবারের আয় বছরে 8,00,000 টাকার কম", hi = "आपके परिवार की आय 8,00,000 रुपये प्रति वर्ष से कम है" }
condition = { field = "family_income", op = "lt", value = 800000 }
evidence = [{ source_id = "aicte-pragati-faq", quote = "Family income should be less than Rs. 8 Lakh per annum." }]

[[criteria]]
id = "no_other_scholarship"
label = { en = "You do not already get another Central Government, State Government or AICTE scholarship", bn = "আপনি কেন্দ্রীয় সরকার, রাজ্য সরকার বা AICTE-র অন্য কোনো বৃত্তি পান না", hi = "आपको पहले से केंद्र सरकार, राज्य सरकार या AICTE की कोई दूसरी छात्रवृत्ति नहीं मिलती" }
condition = { field = "receives_other_scholarship", op = "eq", value = false }
evidence = [
  { source_id = "aicte-pragati-faq", quote = "The candidate should NOT be recipient of any of the Central Govt./ State Govt. / AICTE Sponsored scholarships." },
]

