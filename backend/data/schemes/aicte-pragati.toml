evidence = [{ source_id = "aicte-pragati-faq", quote = "Copy of SSC/10th certificate & mark sheet." }]

[[documents]]
id = "category"
label = { en = "Category certificate, if you belong to a reserved category", bn = "সংরক্ষিত শ্রেণিভুক্ত হলে বিভাগের (ক্যাটেগরি) শংসাপত্র", hi = "श्रेणी प्रमाण पत्र, यदि आप किसी आरक्षित श्रेणी से हैं" }
if_applicable = true
evidence = [{ source_id = "aicte-pragati-faq", quote = "Category, if applicable." }]

[[documents]]
id = "study_certificate"
label = { en = "Study (bonafide) certificate from your institute, in the format of Appendix I", bn = "আপনার প্রতিষ্ঠান থেকে পাওয়া পড়ুয়া (বোনাফাইড) শংসাপত্র, পরিশিষ্ট I-এর ছকে", hi = "आपके संस्थान से अध्ययन (बोनाफ़ाइड) प्रमाण पत्र, परिशिष्ट I के प्रारूप में" }
detail = { en = "It is issued by the Director, Principal or Head of the Institution.", bn = "এটি প্রতিষ্ঠানের ডিরেক্টর, অধ্যক্ষ বা প্রধান দেন।", hi = "यह निदेशक, प्राचार्य या संस्थान प्रमुख द्वारा जारी किया जाता है।" }
evidence = [
  { source_id = "aicte-pragati-faq", quote = "Study/ Bonafide Certificate (Appendix-I)." },
  { source_id = "aicte-pragati-faq", quote = "(To be issued by Director / Principal / Head of the Institution)" },
]

[[documents]]
id = "income_certificate"
label = { en = "Annual family income certificate of the current year, in the format of Appendix II", bn = "চলতি বছরের বার্ষিক পারিবারিক আয়ের শংসাপত্র, পরিশিষ্ট II-এর ছকে", hi = "चालू वर्ष का वार्षिक पारिवारिक आय प्रमाण पत्र, परिशिष्ट II के प्रारूप में" }
detail = { en = "It must be in your name or a family member's, and signed and stamped by a competent authority such as a Tehsildar, Magistrate, Revenue Officer or Block Development Officer.", bn = "এটি আপনার বা পরিবারের কোনো সদস্যের নামে হতে হবে এবং তহসিলদার, ম্যাজিস্ট্রেট, রাজস্ব আধিকারিক বা ব্লক উন্নয়ন আধিকারিকের মতো উপযুক্ত কর্তৃপক্ষের স্বাক্ষর ও সিলমোহর থাকতে হবে।", hi = "यह आपके या परिवार के किसी सदस्य के नाम पर होना चाहिए, और तहसीलदार, मजिस्ट्रेट, राजस्व अधिकारी या खंड विकास अधिकारी जैसे सक्षम अधिकारी द्वारा हस्ताक्षरित और मुहर लगा हुआ होना चाहिए।" }
evidence = [
  { source_id = "aicte-pragati-faq", quote = "Annual Family Income Certificate (Appendix-II)." },
  { source_id = "aicte-pragati-faq", quote = "Annual family income certificate of current year is not submitted." },
  { source_id = "aicte-pragati-faq", quote = "Annual family income certificate is not in the name of applicant or any his/her family member." },
  { source_id = "aicte-pragati-faq", quote = "Submitted Annual family income certificate issued by other than competent authority (Tehshildar, Magistrate, Revenue officer/Block Development Officer etc.)." },
  { source_id = "aicte-pragati-faq", quote = "Annual family income certificate submitted without signature/stamp of the competent authority." },
]

