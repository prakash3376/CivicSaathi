# Swami Vivekananda Merit-cum-Means Scholarship (SVMCM), Government of West Bengal.
#
# Every rule, document, step and deadline below carries `evidence`: words copied from an indexed
# official document. The loader checks that each figure in the wording is in its quote, and
# `python -m app.cli schemes-check` checks that each quote is really in the document.
# Rules follow the document's own words: "not more than Rs. 2,50,000" includes exactly 2,50,000
# (lte); "at least 60%" includes exactly 60 (gte).
#
# Not covered here, because the questionnaire cannot decide them or they need more rules:
# Class XI and XII are one track, medical degree courses and Engineering/Technology/Pharmacy
# postgraduate courses have other rates or marks, and so do M.Phil and Ph.D research scholars.
# The track descriptions say so.
#
# The Bengali is a draft by a non-native speaker and needs a native speaker's review.

id = "svmcm"
name = "Swami Vivekananda Merit-cum-Means Scholarship (SVMCM)"
authority = "Government of West Bengal"
level = "state"
state = "West Bengal"
sectors = ["education"]
source_ids = ["wb-svmcm-guidelines", "wb-svmcm-scheme-page"]
summary = { en = "West Bengal's scholarship for meritorious students from families with limited means, from Class XI up to postgraduate level.", bn = "পশ্চিমবঙ্গ সরকারের বৃত্তি: আর্থিকভাবে অনগ্রসর পরিবারের মেধাবী ছাত্রছাত্রীদের জন্য, একাদশ শ্রেণি থেকে স্নাতকোত্তর স্তর পর্যন্ত।", hi = "पश्चिम बंगाल की छात्रवृत्ति, सीमित साधनों वाले परिवारों के मेधावी छात्रों के लिए, कक्षा XI से स्नातकोत्तर स्तर तक।" }
not_stated = [
  { en = "The last date to apply. Check the SVMCM portal.", bn = "আবেদনের শেষ তারিখ। SVMCM পোর্টালে দেখুন।", hi = "आवेदन की अंतिम तिथि। SVMCM पोर्टल देखें।" },
  { en = "Any fee for applying. The documents do not mention one.", bn = "আবেদনের কোনো ফি আছে কি না। নথিগুলিতে এর উল্লেখ নেই।", hi = "आवेदन के लिए कोई शुल्क। दस्तावेज़ों में इसका ज़िक्र नहीं है।" },
  { en = "A helpline or e-mail address. The documents do not give one.", bn = "কোনো হেল্পলাইন বা ই-মেল ঠিকানা। নথিগুলিতে দেওয়া নেই।", hi = "कोई हेल्पलाइन या ईमेल पता। दस्तावेज़ों में कोई नहीं दिया गया है।" },
  { en = "A full list of documents for a first application. Check the portal's instructions.", bn = "প্রথমবার আবেদনের জন্য নথির সম্পূর্ণ তালিকা। পোর্টালের নির্দেশাবলি দেখুন।", hi = "पहले आवेदन के लिए दस्तावेज़ों की पूरी सूची। पोर्टल के निर्देश देखें।" },
]

# --- What the scheme requires of every applicant -------------------------------------------

[[criteria]]
id = "in_west_bengal"
label = { en = "Your school, college or university is in West Bengal", bn = "আপনার স্কুল, কলেজ বা বিশ্ববিদ্যালয় পশ্চিমবঙ্গে", hi = "आपका स्कूल, कॉलेज या विश्वविद्यालय पश्चिम बंगाल में है" }
condition = { field = "institution_in_west_bengal", op = "eq", value = true }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "the Government of West Bengal introduces this scheme of giving scholarships at different levels of higher studies, at educational institutions based in West Bengal" }]

[[criteria]]
id = "no_other_scholarship"
label = { en = "You do not get another Central or State Government scholarship or stipend for the same course", bn = "আপনি একই কোর্সের জন্য কেন্দ্রীয় বা রাজ্য সরকারের অন্য কোনো বৃত্তি বা ভাতা পান না", hi = "आपको उसी कोर्स के लिए केंद्र या राज्य सरकार की कोई दूसरी छात्रवृत्ति या वज़ीफ़ा नहीं मिलता" }
condition = { field = "receives_other_scholarship", op = "eq", value = false }
note = { en = "One-time grants and free or part-free studentships from your institution do not count.", bn = "আপনার প্রতিষ্ঠান থেকে একবারের অনুদান এবং বিনা বা আংশিক বিনা খরচে পড়ার সুযোগ এর মধ্যে পড়ে না।", hi = "आपके संस्थान से मिलने वाले एकमुश्त अनुदान और निःशुल्क या आंशिक निःशुल्क शिक्षा (स्टूडेंटशिप) गिने नहीं जाते।" }
evidence = [
  { source_id = "wb-svmcm-guidelines", quote = "will not be allowed to enjoy any other governmental (central/state) scholarship or stipend for the same course/stage of study" },
  { source_id = "wb-svmcm-guidelines", quote = "free or partly-free studentship allowed by the host institutions will not debar the students from availing of the benefits of this scheme" },
]

[[criteria]]
id = "income"
label = { en = "Your family income is not more than Rs 2,50,000 a year", bn = "আপনার পরিবারের আয় বছরে 2,50,000 টাকার বেশি নয়", hi = "आपके परिवार की आय 2,50,000 रुपये प्रति वर्ष से अधिक नहीं है" }
condition = { field = "family_income", op = "lte", value = 250000 }
waived_when = [{ field = "board_topper", op = "eq", value = true }]
note = { en = "This limit does not apply to Board toppers. The guidelines do not say who counts as one.", bn = "বোর্ডের শীর্ষস্থানীয়দের জন্য এই সীমা প্রযোজ্য নয়। কারা শীর্ষস্থানীয়, তা নির্দেশিকায় বলা নেই।", hi = "यह सीमा बोर्ड टॉपर पर लागू नहीं होती। दिशानिर्देश यह नहीं बताते कि टॉपर किसे माना जाएगा।" }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "The total family income for the prospective scholars will be not more than Rs. 2,50,000/-per annum. (Not applicable for Board Toppers or Kanyashree(K3) or M.Phil/Ph.D applicants)" }]

# --- Documents, steps ----------------------------------------------------------------------

[[documents]]
id = "bank_details"
label = { en = "Your bank account number, bank name and IFS code", bn = "আপনার ব্যাংক অ্যাকাউন্ট নম্বর, ব্যাংকের নাম ও IFS কোড", hi = "आपका बैंक खाता नंबर, बैंक का नाम और IFS कोड" }
detail = { en = "These are mandatory. The money is paid only by direct transfer to your account.", bn = "এগুলি বাধ্যতামূলক। টাকা শুধু সরাসরি আপনার অ্যাকাউন্টে পাঠানো হয়।", hi = "ये अनिवार्य हैं। पैसा केवल आपके खाते में सीधे हस्तांतरण से दिया जाता है।" }
evidence = [
  { source_id = "wb-svmcm-guidelines", quote = "furnishing of Bank details of the applicant, i.e. A/C No., Bank Name, IFS Code of Bank is mandatory" },
  { source_id = "wb-svmcm-guidelines", quote = "the payment will be made by direct beneficiary transfer only" },
]

[[documents]]
id = "income_documents"
label = { en = "Income certificate and income affidavit", bn = "আয়ের শংসাপত্র ও আয়ের হলফনামা", hi = "आय प्रमाण पत्र और आय शपथ पत्र" }
detail = { en = "The guidelines say Kanyashree (K3) applicants do not need them. Any deliberate falsification in the income documents is treated as a grievous offence.", bn = "নির্দেশিকা অনুযায়ী কন্যাশ্রী (K3) আবেদনকারীদের এগুলি লাগে না। আয়ের নথিতে ইচ্ছাকৃত জালিয়াতি গুরুতর অপরাধ বলে গণ্য হয়।", hi = "दिशानिर्देशों के अनुसार कन्याश्री (K3) आवेदकों को इनकी ज़रूरत नहीं है। आय के दस्तावेज़ों में जानबूझकर की गई कोई भी जालसाज़ी गंभीर अपराध मानी जाती है।" }
evidence = [
  { source_id = "wb-svmcm-guidelines", quote = "There is no need to submit Income Certificate and Income Affidavit in respect of Kanyashree students applying for K-3 scholarship" },
  { source_id = "wb-svmcm-guidelines", quote = "Any deliberate falsification in the Income documents discovered at any stage will be considered as a grievous offence" },
]

[[steps]]
id = "apply_online"
text = { en = "Submit your application online on the scholarship portal. You do not need to send a paper copy.", bn = "বৃত্তির পোর্টালে অনলাইনে আবেদন জমা দিন। কাগজের কপি পাঠাতে হবে না।", hi = "छात्रवृत्ति पोर्टल पर अपना आवेदन ऑनलाइन जमा करें। कागज़ की प्रति भेजने की ज़रूरत नहीं है।" }
evidence = [
  { source_id = "wb-svmcm-guidelines", quote = "Candidates for different categories will submit their applications online in the scholarship portal" },
  { source_id = "wb-svmcm-guidelines", quote = "There will be no need to submit hard copy of the application." },
]

[[steps]]
id = "merit_list"
text = { en = "Scholarships are given in order of marks (the merit list), as far as funds allow.", bn = "বৃত্তি দেওয়া হয় নম্বরের ক্রমে (মেধা তালিকা অনুযায়ী), তহবিলে যতটা কুলোয় ততটা।", hi = "छात्रवृत्ति अंकों के क्रम (मेरिट सूची) में दी जाती है, जहाँ तक धनराशि अनुमति दे।" }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "scholarship would be sanctioned as per the availability of fund and strictly on the basis of the merit list" }]

[[steps]]
id = "renewal"
text = { en = "To renew, apply online within one month of admission to the next higher class, after passing in the first attempt.", bn = "নবীকরণের জন্য প্রথমবারেই উত্তীর্ণ হয়ে পরের উঁচু শ্রেণিতে ভর্তির এক মাসের মধ্যে অনলাইনে আবেদন করুন।", hi = "नवीनीकरण के लिए, पहले प्रयास में पास होने के बाद अगली ऊँची कक्षा में प्रवेश के एक महीने के भीतर ऑनलाइन आवेदन करें।" }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "For renewal of scholarship, application must be submitted online to the concerned scholarship sanctioning authority within one month from the date of his/her admission in the next higher class due to promotion by passing in the first attempt" }]

[apply]
text = { en = "Apply online on the SVMCM scholarship portal.", bn = "SVMCM বৃত্তি পোর্টালে অনলাইনে আবেদন করুন।", hi = "SVMCM छात्रवृत्ति पोर्टल पर ऑनलाइन आवेदन करें।" }
url = "https://svmcm.wb.gov.in"
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "will submit their applications online in the scholarship portal" }]

# --- The tracks ----------------------------------------------------------------------------

[[tracks]]
id = "hs"
label = { en = "Class XI and XII (Higher Secondary)", bn = "একাদশ ও দ্বাদশ শ্রেণি (উচ্চমাধ্যমিক)", hi = "कक्षा XI और XII (उच्चतर माध्यमिक)" }

[tracks.benefit]
text = { en = "Rs 1,000 a month.", bn = "মাসে 1,000 টাকা।", hi = "1,000 रुपये प्रति माह।" }
evidence = [{ source_id = "wb-svmcm-scheme-page", quote = "COURSE: HS; Eligibility Criteria: At least 60% marks in MP/Equivalent Exam; SCHOLARSHIP RATE PER MONTH (RS.): 1000/-" }]

[[tracks.criteria]]
id = "board"
label = { en = "You passed the Madhyamik exam from the West Bengal Board of Secondary Education", bn = "আপনি পশ্চিমবঙ্গ মাধ্যমিক শিক্ষা পর্ষদ থেকে মাধ্যমিক পরীক্ষায় উত্তীর্ণ হয়েছেন", hi = "आपने पश्चिम बंगाल माध्यमिक शिक्षा बोर्ड से माध्यमिक परीक्षा पास की है" }
ask = { en = "Did you pass the Madhyamik exam from the West Bengal Board of Secondary Education?", bn = "আপনি কি পশ্চিমবঙ্গ মাধ্যমিক শিক্ষা পর্ষদ থেকে মাধ্যমিক পরীক্ষায় উত্তীর্ণ হয়েছেন?", hi = "क्या आपने पश्चिम बंगाल माध्यमिक शिक्षा बोर्ड से माध्यमिक परीक्षा पास की है?" }
condition = { field = "passed_wb_board", op = "eq", value = true }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "Candidates from outside the West Bengal Board of Secondary Education will not be eligible to apply for this scholarship." }]

[[tracks.criteria]]
id = "marks"
label = { en = "You got at least 60% in total in the Madhyamik exam", bn = "আপনি মাধ্যমিক পরীক্ষায় মোট কমপক্ষে 60% নম্বর পেয়েছেন", hi = "आपको माध्यमिक परीक्षा में कुल मिलाकर कम से कम 60% अंक मिले हैं" }
ask = { en = "What percentage of marks did you get in total in the Madhyamik exam?", bn = "মাধ্যমিক পরীক্ষায় আপনি মোট কত শতাংশ নম্বর পেয়েছেন?", hi = "माध्यमिक परीक्षा में आपके कुल कितने प्रतिशत अंक आए?" }
condition = { field = "marks_percent", op = "gte", value = 60 }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "The minimum qualifying marks for being considered for award of scholarships will be 60% in aggregate, in Madhyamik Pariksha" }]

[[tracks]]
id = "ug"
label = { en = "Undergraduate (Arts, Commerce, Science, professional courses)", bn = "স্নাতক (কলা, বাণিজ্য, বিজ্ঞান, পেশাদার কোর্স)", hi = "स्नातक (कला, वाणिज्य, विज्ञान, व्यावसायिक कोर्स)" }
description = { en = "Rates for medical degree courses and some others differ. See the guidelines.", bn = "মেডিকেল ডিগ্রি কোর্স ও আরও কয়েকটির হার আলাদা। নির্দেশিকা দেখুন।", hi = "चिकित्सा डिग्री कोर्स और कुछ अन्य के लिए दरें अलग हैं। दिशानिर्देश देखें।" }

[tracks.benefit]
text = { en = "Rs 1,000 a month for Arts and Commerce, and Rs 1,500 a month for Science and other professional courses.", bn = "কলা ও বাণিজ্যে মাসে 1,000 টাকা, এবং বিজ্ঞান ও অন্যান্য পেশাদার কোর্সে মাসে 1,500 টাকা।", hi = "कला और वाणिज्य के लिए 1,000 रुपये प्रति माह, और विज्ञान तथा अन्य व्यावसायिक कोर्स के लिए 1,500 रुपये प्रति माह।" }
evidence = [
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: UG (ARTS); Eligibility Criteria: At least 60% marks in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 1000/-" },
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: UG(COMMERCE); Eligibility Criteria: At least 60% marks in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 1000/-" },
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: UG (SCIENCE); Eligibility Criteria: At least 60% marks in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 1500/-" },
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: UG (OTHER PROFESSIONAL COURSES, UGC APPROVED)*; Eligibility Criteria: At least 60% marks in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 1500/-" },
]

[[tracks.criteria]]
id = "marks"
label = { en = "You got at least 60% in total in the Higher Secondary (H.S.) exam", bn = "আপনি উচ্চমাধ্যমিক (H.S.) পরীক্ষায় মোট কমপক্ষে 60% নম্বর পেয়েছেন", hi = "आपको उच्चतर माध्यमिक (H.S.) परीक्षा में कुल मिलाकर कम से कम 60% अंक मिले हैं" }
ask = { en = "What percentage of marks did you get in total in the Higher Secondary (H.S.) exam?", bn = "উচ্চমাধ্যমিক (H.S.) পরীক্ষায় আপনি মোট কত শতাংশ নম্বর পেয়েছেন?", hi = "उच्चतर माध्यमिक (H.S.) परीक्षा में आपके कुल कितने प्रतिशत अंक आए?" }
condition = { field = "marks_percent", op = "gte", value = 60 }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "The minimum qualifying marks for being considered for award of scholarships will be 60% in aggregate, in the H.S. Examination conducted by the W.B. Council of H.S. Education/Madrasha Siksha Parishad." }]

[[tracks.caveats]]
id = "lateral_entry"
text = { en = "If you joined the second year of an engineering, technology or pharmacy course through lateral entry, your diploma marks count instead: at least 60% in total.", bn = "ইঞ্জিনিয়ারিং, প্রযুক্তি বা ফার্মেসি কোর্সের দ্বিতীয় বর্ষে ল্যাটারাল এন্ট্রির মাধ্যমে ভর্তি হলে আপনার ডিপ্লোমার নম্বর গণ্য হবে: মোট কমপক্ষে 60%।", hi = "यदि आपने इंजीनियरिंग, प्रौद्योगिकी या फ़ार्मेसी कोर्स के दूसरे वर्ष में लेटरल एंट्री से प्रवेश लिया है, तो आपके डिप्लोमा के अंक गिने जाएँगे: कुल मिलाकर कम से कम 60%।" }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "60% marks in aggregate in diploma course from Institutes approved by AICTE and affiliated to WBSCT&VE&SD for Under Graduate level Scholarship (in 2nd year Engineering/Technology/Pharmacy courses through Lateral Entry)" }]

[[tracks]]
id = "pg"
label = { en = "Postgraduate (Arts, Commerce, Science)", bn = "স্নাতকোত্তর (কলা, বাণিজ্য, বিজ্ঞান)", hi = "स्नातकोत्तर (कला, वाणिज्य, विज्ञान)" }
description = { en = "Not for Engineering, Technology and Pharmacy postgraduate courses, which ask for 55%.", bn = "ইঞ্জিনিয়ারিং, প্রযুক্তি ও ফার্মেসি স্নাতকোত্তর কোর্সের জন্য নয়; সেখানে 55% লাগে।", hi = "इंजीनियरिंग, प्रौद्योगिकी और फ़ार्मेसी के स्नातकोत्तर कोर्स के लिए नहीं, जिनमें 55% माँगा जाता है।" }

[tracks.benefit]
text = { en = "Rs 2,000 a month for Arts and Commerce, and Rs 2,500 a month for Science and other professional courses.", bn = "কলা ও বাণিজ্যে মাসে 2,000 টাকা, এবং বিজ্ঞান ও অন্যান্য পেশাদার কোর্সে মাসে 2,500 টাকা।", hi = "कला और वाणिज्य के लिए 2,000 रुपये प्रति माह, और विज्ञान तथा अन्य व्यावसायिक कोर्स के लिए 2,500 रुपये प्रति माह।" }
evidence = [
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: PG (ARTS); Eligibility Criteria: At least 53% marks for SVMCM and 45% for Kanyashree(K3 applicants in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 2000/-" },
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: PG (COMMERCE); Eligibility Criteria: At least 53% marks for SVMCM and 45% for Kanyashree(K3 applicants in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 2000/-" },
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: PG (SCIENCE); Eligibility Criteria: At least 53% marks for SVMCM and 45% for Kanyashree(K3 applicants in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 2500/-" },
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: PG (OTHER PROFESSIONAL COURSES, UGC APPROVED); Eligibility Criteria: At least 53% marks in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 2500/-" },
]

[[tracks.criteria]]
id = "marks"
label = { en = "You got at least 53% in your Honours subject at graduation", bn = "স্নাতক স্তরে আপনার অনার্স বিষয়ে আপনি কমপক্ষে 53% নম্বর পেয়েছেন", hi = "स्नातक में आपके ऑनर्स विषय में आपको कम से कम 53% अंक मिले हैं" }
ask = { en = "What percentage of marks did you get in your Honours subject at graduation?", bn = "স্নাতক স্তরে আপনার অনার্স বিষয়ে আপনি কত শতাংশ নম্বর পেয়েছেন?", hi = "स्नातक में आपके ऑनर्स विषय में आपके कितने प्रतिशत अंक आए?" }
condition = { field = "marks_percent", op = "gte", value = 53 }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "Candidates should be graduates securing at least 53% marks (55% marks for applicants under DTE) in the Honours subject at the graduation level." }]

[[tracks]]
id = "pg-k3"
label = { en = "Postgraduate, Kanyashree (K3) applicant", bn = "স্নাতকোত্তর, কন্যাশ্রী (K3) আবেদনকারী", hi = "स्नातकोत्तर, कन्याश्री (K3) आवेदक" }
description = { en = "For girl students. There is no family income limit and no income documents.", bn = "ছাত্রীদের জন্য। পারিবারিক আয়ের সীমা নেই এবং আয়ের নথি লাগে না।", hi = "छात्राओं के लिए। पारिवारिक आय की कोई सीमा नहीं है और आय के दस्तावेज़ नहीं माँगे जाते।" }
omit_common = ["income", "income_documents"]

[tracks.benefit]
text = { en = "Rs 2,000 a month for Arts and Commerce, and Rs 2,500 a month for Science.", bn = "কলা ও বাণিজ্যে মাসে 2,000 টাকা, এবং বিজ্ঞানে মাসে 2,500 টাকা।", hi = "कला और वाणिज्य के लिए 2,000 रुपये प्रति माह, और विज्ञान के लिए 2,500 रुपये प्रति माह।" }
evidence = [
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: PG (ARTS); Eligibility Criteria: At least 53% marks for SVMCM and 45% for Kanyashree(K3 applicants in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 2000/-" },
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: PG (COMMERCE); Eligibility Criteria: At least 53% marks for SVMCM and 45% for Kanyashree(K3 applicants in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 2000/-" },
  { source_id = "wb-svmcm-scheme-page", quote = "COURSE: PG (SCIENCE); Eligibility Criteria: At least 53% marks for SVMCM and 45% for Kanyashree(K3 applicants in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 2500/-" },
]

[[tracks.criteria]]
id = "female"
label = { en = "You are a female student", bn = "আপনি একজন ছাত্রী (মহিলা)", hi = "आप एक छात्रा हैं" }
condition = { field = "gender", op = "eq", value = "female" }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "Girls Students pursuing Post Graduate courses in Science, Arts and Commerce stream from Universities of this State after obtaining Under Graduate Degree with 45% marks in aggregate from Institutions of this State will come under the aegis of this Scholarship Scheme as Kanyashree(K3) applicants." }]

[[tracks.criteria]]
id = "marks"
label = { en = "You got at least 45% in total in your undergraduate degree", bn = "আপনার স্নাতক ডিগ্রিতে আপনি মোট কমপক্ষে 45% নম্বর পেয়েছেন", hi = "आपको स्नातक डिग्री में कुल मिलाकर कम से कम 45% अंक मिले हैं" }
ask = { en = "What percentage of marks did you get in total in your undergraduate degree?", bn = "আপনার স্নাতক ডিগ্রিতে আপনি মোট কত শতাংশ নম্বর পেয়েছেন?", hi = "आपकी स्नातक डिग्री में कुल कितने प्रतिशत अंक आए?" }
condition = { field = "marks_percent", op = "gte", value = 45 }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "Girls Students pursuing Post Graduate courses in Science, Arts and Commerce stream from Universities of this State after obtaining Under Graduate Degree with 45% marks in aggregate from Institutions of this State will come under the aegis of this Scholarship Scheme as Kanyashree(K3) applicants." }]

[[tracks.caveats]]
id = "k2"
text = { en = "The guidelines also describe these applicants as Kanyashree (K-2) recipients. Check on the portal whether you must have received K2.", bn = "নির্দেশিকা এই আবেদনকারীদের কন্যাশ্রী (K-2) প্রাপক হিসেবেও বর্ণনা করেছে। K2 পেয়ে থাকা আপনার জন্য আবশ্যক কি না, পোর্টালে দেখে নিন।", hi = "दिशानिर्देश इन आवेदकों को कन्याश्री (K-2) प्राप्तकर्ता भी बताते हैं। पोर्टल पर देखें कि क्या आपको K2 मिला होना ज़रूरी है।" }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "Kanyashree recipients (K-2) (married/unmarried) pursuing Post Graduate courses in Science, Arts and Commerce stream from Universities of this State after obtaining Under Graduate Degree with 45% marks in aggregate from Institutions of this State will come under the aegis of this Scholarship Scheme" }]

[[tracks]]
id = "diploma"
label = { en = "Diploma (Polytechnic)", bn = "ডিপ্লোমা (পলিটেকনিক)", hi = "डिप्लोमा (पॉलिटेक्निक)" }

[tracks.benefit]
text = { en = "Rs 1,500 a month.", bn = "মাসে 1,500 টাকা।", hi = "1,500 रुपये प्रति माह।" }
evidence = [{ source_id = "wb-svmcm-scheme-page", quote = "COURSE: POLYTECHNIC (DIPLOMA COURSES); Eligibility Criteria: At least 60% marks in Last Qualifying Exam; SCHOLARSHIP RATE PER MONTH (RS.): 1500/-" }]

[[tracks.criteria]]
id = "marks"
label = { en = "You got at least 60% in total in your qualifying exam", bn = "আপনি যোগ্যতামূলক পরীক্ষায় মোট কমপক্ষে 60% নম্বর পেয়েছেন", hi = "आपको अपनी योग्यता परीक्षा में कुल मिलाकर कम से कम 60% अंक मिले हैं" }
condition = { field = "marks_percent", op = "gte", value = 60 }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "Candidates must obtain at least 60% marks in aggregate in the qualifying examination" }]

[[tracks.caveats]]
id = "approved_course"
text = { en = "The diploma course must be approved by AICTE (or the Pharmacy Council of India or the Council of Architecture) and affiliated to the West Bengal State Council of Technical and Vocational Education and Skill Development.", bn = "ডিপ্লোমা কোর্সটি AICTE (বা ফার্মেসি কাউন্সিল অব ইন্ডিয়া বা কাউন্সিল অব আর্কিটেকচার) অনুমোদিত এবং পশ্চিমবঙ্গ রাজ্য কারিগরি ও বৃত্তিমূলক শিক্ষা ও দক্ষতা উন্নয়ন পর্ষদের অধীনে হতে হবে।", hi = "डिप्लोमा कोर्स AICTE (या भारतीय फ़ार्मेसी परिषद या वास्तुकला परिषद) से मान्यता प्राप्त और पश्चिम बंगाल राज्य तकनीकी एवं व्यावसायिक शिक्षा और कौशल विकास परिषद से संबद्ध होना चाहिए।" }
evidence = [{ source_id = "wb-svmcm-guidelines", quote = "The Diploma (Polytechnic) courses of the State have to be approved by All India Council for Technical Education (AICTE) / Pharmacy Council of India (PCI) / Council of Architecture (CoA) and affiliated to West Bengal State Council of Technical & Vocational Education & Skill Development (WBSCT&VE&SD)" }]
