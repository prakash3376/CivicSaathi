[[sources]]
id = "pmfby-guidelines"
title = "PMFBY: Revised Operational Guidelines (PDF)"
scheme = "Pradhan Mantri Fasal Bima Yojana (PMFBY)"
authority = "Ministry of Agriculture and Farmers Welfare, Government of India"
level = "central"
doc_type = "guidelines"
format = "pdf"
url = "https://pmfby.gov.in/pdf/Revised_Operational_Guidelines.pdf"
expected_phrases = ["PMFBY", "Pradhan Mantri Fasal Bima Yojana"]
expected_facts = ["2.0%"]
curated_on = 2026-10-31
notes = """\
The scheme's revised operational guidelines, served by the National Crop Insurance Portal \
(pmfby.gov.in). The text carries no issue date. Each State notifies its own crops, areas, premium \
rates and cut-off dates for every season, so the guidelines are a framework, not the notice for a \
given season."""

