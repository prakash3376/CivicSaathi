expected_phrases = ["ALL INDIA COUNCIL FOR TECHNICAL EDUCATION", "Pragati", "Saksham", "Swanath"]
expected_facts = ["31.10.2026"]
curated_on = 2026-10-31
notes = """\
The current-year notification, linked from AICTE's Pragati page. It is a scan with a hidden \
OCR text layer: the Hindi letterhead is garbled and some dates are misread (for example the \
15 November date appears as '1 5"' Novcmber.2026'), so verification flags the OCR layer and \
the figures must be checked against the original (SPEC test T7). published_on is the date \
printed on the letter (19.06.2026)."""
