name: CI

# What `CLAUDE.md` calls "verify a change", run on every push and pull request. It needs the project
# folder to be the root of its repository; the scheme and catalogue checks that need the downloaded
# documents (`schemes-check`, `catalogue-check`) are run by a person after `ingest`, not here.

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
        env:
          GEMINI_API_KEY: ""

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No key-shaped string and no .env file is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "an .env file is tracked"; exit 1; fi
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}' -- . ':!*.lock' ':!package-lock.json'; then
            echo "a key-shaped string is committed"; exit 1
          fi
